  accOpen: {},           // `${file}:${criterion|finding}` -> expanded in the detail view
  accDraft: {},          // form key -> unsent note text, kept across redraws
  dwide: false,          // the detail view's expanded reading width
  flightSid: null,
  focusSid: null,
  filter: 'all',
  diffCache: {},         // agentId -> {at, files, fetching}
  // agentId -> {at, manifest, freshness, fetching}: the policy and inputs
  // ONE run was frozen with, read back off the board rather than resolved
  // again, so the panel can never show a run a permission it did not ride
  manifests: {},
  // agentId -> {at, data, fetching}: one run's whole progress timeline, as
  // `/api/progress` returns it — agent-reported throughout. The state
  // payload carries only the latest run per card, without its history
  progressFull: {},
  // card file -> {at, rollup, evidence, fetching}: what bench's own
  // verification runs found for one card, read back off disk. Fetched
  // rather than carried in the state payload for the manifest's reason,
  // and never re-run by being looked at
  evidence: {},
  // {at, report, fetching}: the last configuration check taken on this
  // tab. Held rather than refetched on every render because reading it
  // resolves every intent and hashes every approved input — cheap, but
  // not free — and because "no issues when you last looked" is the only
  // thing a cached reading may ever be shown as saying
  doctor: null,
  // why the last configuration check did not complete, shown in its place
  doctorError: null,
  // the purpose Settings → Diagnostics narrows the check to (null: all)
  settingsPurpose: null,
  // what had focus when a configuration or launch check opened
  sheetReturn: null,
  // {at, page, fetching}: the whole Settings reading, fetched on demand
  // rather than carried in the state payload — it resolves all three
  // intents, hashes every approved input and asks git for the tool's own
  // revision. Held so switching section repaints without asking again.
  settings: null,
  settingsSection: 'overview',
  // The draft being edited, and nothing else: {document, revision, checked,
  // preview, dirty}. `revision` is the one the editor was opened at, sent
  // back with an apply so a save made over somebody else's is refused
  // rather than silently winning. Null until the editor is opened — the
  // page holds no draft for a section nobody opened.
  draft: null,
  // The contextual editor open on that draft, if any: {kind: 'check',
  // index, anchor} in Checks, {kind: 'gate', scope} or {kind: 'overrides'}
  // in Merge rules. It edits the same draft as the advanced editor.
  sedit: null,
  // The card whose ⋯ tools are open, by file — one at a time, and held
  // here so a redraw does not close it under the person using it.
  cardMenu: null,
  openFolds: new Set(),  // expanded output folds, kept across renders
  fileView: null,        // {dir, name, content} open in the drawer
  drawerKey: null,       // which document the drawer last painted, for its scroll mark
  logStick: true,        // follow the newest event unless the user scrolled up
  logOpen: localStorage.getItem('bench-log-open') === '1',
  logFilter: 'all',
  acts: {},              // action key -> {phase: 'armed'|'busy', until} across re-renders
  dragging: null,        // {file, from} while a card is mid-drag
  dockHot: false,        // pointer over the bar with an archivable card
  dark: localStorage.getItem('bench-theme')
    ? localStorage.getItem('bench-theme') === 'dark'
    : !window.matchMedia('(prefers-color-scheme: light)').matches,
};

/* colour only ever means state */
const STAGE_TINT = { backlog: 'var(--dim)', 'to-do': 'var(--muted)',
  'in-progress': 'var(--accent)', review: 'var(--calm)', done: 'var(--idle)' };
const STAGE_NOTE = { 'to-do': 'next up', review: 'your move' };
const GLYPHS = { session: '●', end: '○', idle: '…', edit: '✎', read: '◔', search: '⌕',
  command: '$', test: '▶', check: '☑', git: '⎇', plan: '≡', subagent: '⑂', web: '∿',
  move: '⇢', new: '＋', agent: '⚑', report: '▣', sync: '⇅', phase: '⟶',
  verify: '◫', other: '·' };
const FILTERS = [
  ['all', 'All', null],
  ['moves', 'Moves', new Set(['move', 'new', 'agent', 'sync', 'phase'])],
  ['edits', 'Edits', new Set(['edit'])],
  ['reads', 'Reads', new Set(['read', 'search'])],
  // a run's own test commands, and the verifications bench ran itself:
  // two different accounts of the same question, filtered together
  ['tests', 'Tests', new Set(['test', 'check', 'verify'])],
  ['commands', 'Commands', new Set(['command', 'subagent', 'web', 'other'])],
  ['git', 'Git', new Set(['git'])],
  ['plan', 'Plan', new Set(['plan', 'report'])],
  // what the run said about its work, as against everything above, which
  // is what it did — a session's own filter only (the activity bar holds
  // board events, and no progress update is one)
  ['progress', 'Progress updates', new Set(['progress']), 'session'],
];
GLYPHS.progress = '◆';

function mix(tint, pct) { return `color-mix(in oklab, ${tint} ${pct}%, transparent)`; }
function pillFor(stage, working) {
  if (working) return { text: 'working', tint: 'var(--accent)', bg: mix('var(--accent)', 16) };
  if (stage === 'review') return { text: 'waiting on you', tint: 'var(--calm)', bg: mix('var(--calm)', 18) };
  if (stage === 'to-do') return { text: 'queued', tint: 'var(--muted)', bg: 'var(--sunken)' };
  if (stage === 'in-progress') return { text: 'in progress', tint: 'var(--accent)', bg: mix('var(--accent)', 12) };
  if (stage === 'done') return { text: 'done', tint: 'var(--idle)', bg: 'var(--sunken)' };
  return { text: 'backlog', tint: 'var(--dim)', bg: 'var(--sunken)' };
}

/* PR verdict: the file's latest claude review + GitHub's live state.
   Any red signal wins; green needs an approval and no red. */
function prVerdict(task) {
  if (!task.pr) return null;
  const gh = (S.state.prs || {})[task.file];
  const signals = [task.prVerdict, gh && gh.verdict];
  if (signals.includes('red')) return 'red';
  if (signals.includes('green')) return 'green';
  return 'pending';
}

function fmtClock(ts) {
  return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function fmtShort(ts) {
  return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}
function elapsed(fromTs, toTs) {
  const s = Math.max(0, (toTs || Date.now() / 1000) - fromTs);
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h ? `${h}h ${m % 60}m` : `${m}m`;
}
function sessionElapsed(meta) {
  const over = meta.status === 'ended' || !isLiveSession(meta);
  return elapsed(meta.started, over ? (meta.last || meta.started) : null);
}

let toastTimer = null;
/* A refusal that names what to do instead is longer than "07 → done/", and
   a message you cannot finish reading is a wall however politely it is
   worded. So the pill takes the shape its text needs and stays up for as
   long as that text takes to read, up to a ceiling. */
function toast(message, isError = false) {
  const el = $('#toast');
  $('#toastmsg').textContent = message;
  el.classList.toggle('err', isError);
  el.classList.toggle('wrapped', message.length > 90);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'),
                          Math.min(9000, 3200 + message.length * 28));
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', S.dark ? 'dark' : 'light');
  $('#themebtn').textContent = S.dark ? 'Daylight' : 'Night';
  localStorage.setItem('bench-theme', S.dark ? 'dark' : 'light');
}

/* ── data ─────────────────────────────────────────────────────────────── */

async function loadState() {
  const res = await fetch('/api/state');
  S.state = await res.json();
  for (const meta of S.state.sessions) if (!(meta.id in S.events)) S.events[meta.id] = [];
  $('#root').textContent = S.state.board.root.replace(/^.*?\/([^/]+\/\.task-manager).*$/, '$1');
  render();
}

async function loadSession(sid) {
  if (S.loaded[sid]) return;
  S.loaded[sid] = true;
  try {
    const res = await fetch('/api/session?id=' + encodeURIComponent(sid));
    const data = await res.json();
    // keep any events that streamed in after the history snapshot was taken
    const lastTs = data.events.length ? data.events[data.events.length - 1].ts : 0;
    const streamed = (S.events[sid] || []).filter(e => e.ts > lastTs);
    S.events[sid] = data.events.concat(streamed);
    render();
  } catch { S.loaded[sid] = false; }
}

function sessionsOf(pred) { return (S.state?.sessions || []).filter(pred); }
/* The run behind a session: the live launch record while this board still
   holds it, else the identity persisted with the session itself. The two
   answer different amounts — a replayed run has a name and a model, not a
   process — so what depends on liveness (Hold, the worktree branch) simply
   finds nothing on the second, and the chip finds what it needs on both. */
function agentFor(sid) {
  const live = (S.state?.agents || []).find(a => a.session === sid);
  if (live) return live;
  const meta = (S.state?.sessions || []).find(m => m.id === sid);
  return meta && meta.agentId
    ? { id: meta.agentId, name: meta.agentName, model: meta.agentModel, replayed: true }
    : undefined;
}
function agentOnTask(file) {
  return (S.state?.agents || []).find(a => a.task === file && a.status === 'running');
}
/* The most recent run on a card. Records outlive their processes, so the
   latest launch is a max-by-start question, not a find. */
function lastRunOn(file) {
  return (S.state?.agents || []).reduce(
    (best, a) => (a.task === file && (!best || a.started > best.started) ? a : best), null);
}
/* A dead run is a state the card wears: alarm border, `run failed` pill and
   the log's tail, until the next launch replaces it (a newer run is the
   latest one) or the card moves stage (the server drops the state, and the
   stage stamp keeps the card honest in the seconds before the watcher
   notices). Every headless kind counts — work, act-pr, PR review, relevance. */
function failedRun(task) {
  const last = lastRunOn(task.file);
  const failure = last && last.status === 'failed' ? last.failure : null;
  return failure && failure.stage === task.stage ? failure : null;
}
/* The line a run died on: the excerpt's last, which is where a dying
   process says why ("API Error: 500 …"). Bounded, so one enormous line of
   machine output cannot grow the card — the whole excerpt is a hover away. */
function whyFailed(failure) {
  const lines = (failure.excerpt || '').split('\n').filter(l => l.trim());
  const why = lines.length ? lines[lines.length - 1].trim() : 'no output';
  return why.length > 160 ? why.slice(0, 160) + '…' : why;
}
function sessionMeta(sid) { return (S.state?.sessions || []).find(m => m.id === sid); }
function isLiveSession(m) {
  const fresh = (Date.now() / 1000 - (m.last || m.started || 0)) < 900;
  return m.status !== 'ended' && fresh;
}
function allTasks() { return (S.state?.board.stages || []).flatMap(s => s.tasks); }

/* Which model a run rode, shortened for the chip: the provider path an
   opencode-style id carries (anthropic/model-x) and the vendor word a
   claude one repeats (claude-opus-4-8) are both redundant beside a board
   that already knows its vendor. Nothing else is touched — an unknown
   name is shown as recorded rather than guessed at. */
function shortModel(model) {
  return String(model).split('/').pop().replace(/^claude-/, '');
}

/* One chip, every place a name identifies a run. A launch that never knew
   its model (it inherited the vendor default, or the session was replayed
   from disk after a restart) gets nothing at all: no chip is the honest
   answer, a placeholder would read as a model named "unknown". */
function modelChip(agent) {
  if (!agent || !agent.model) return '';
  return `<span class="mchip" title="${esc(agent.model)}">${esc(shortModel(agent.model))}</span>`;
}

function connectStream() {
  const es = new EventSource('/api/stream');
  let hadError = false;
  es.onopen = () => {
    if (hadError) { hadError = false; loadState(); }
    S.sseDown = false; renderChip();
  };
  es.onerror = () => { hadError = true; S.sseDown = true; renderChip(); };
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'event') {
      const ev = msg.event, sid = ev.session;
      if (msg.session) {
        const idx = (S.state.sessions || []).findIndex(m => m.id === sid);
        if (idx >= 0) S.state.sessions[idx] = msg.session;
        else S.state.sessions.unshift(msg.session);
      }
      if (ev.running) { S.running[sid] = ev; }
      else {
        delete S.running[sid];
        (S.events[sid] ||= []).push(ev);
        if (S.events[sid].length > 800) S.events[sid].splice(0, S.events[sid].length - 800);
      }
      // an agent's first event links it to its session — refetch so cards
      // switch from "warming up" to the live line without waiting for a move
      if (msg.session && msg.session.agentId) {
        const rec = (S.state.agents || []).find(a => a.id === msg.session.agentId);
        if (rec && !rec.session) { loadState(); return; }
      }
      scheduleRender();
    } else if (msg.type === 'board' || msg.type === 'agents') {
      loadState();
    } else if (msg.type === 'progress') {
      // a run reported, ended, or had a report refused: its timeline is
      // re-read rather than patched, and the card's reading rides the state
      delete S.progressFull[msg.agent];
      loadState();
    } else if (msg.type === 'verify') {
      // a verification started, ended or was refused: the per-card
      // reading rides the state payload, and the cached rollup a panel
      // is drawing has to be re-read rather than aged out
      S.evidence = {};
      loadState();
    } else if (msg.type === 'toast') {
      // the server needs to say something to the person, not just the
      // ticker — losing a card to another board is the case that matters
      toast(msg.message, !!msg.error);
    } else if (msg.type === 'board_event') {
      S.state?.boardEvents.push(msg.event);
      scheduleRender();
    } else if (msg.type === 'completing') {
      // the cards this board is merging and cleaning up, and which step
      // each is on — whole map, so it can never go stale in pieces
      if (S.state) S.state.completing = msg.completing;
      scheduleRender();
    }
  };
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/* ── keeping your place across a redraw ───────────────────────────────── */

/* The page redraws by demolition: every pass throws the DOM away and
   builds it again, so a scrolling element it rebuilds is a brand-new node
   and a new node's scrollTop is 0. render() runs on every SSE frame and a
   working agent emits an event per tool use, so without this you lose your
   place several times a minute — precisely when you are trying to read.

   The cure is small and paid separately: note where each scroller was
   before the wipe, put it back once the new nodes are in. Both halves run
   inside the same synchronous render, so nothing flashes.

   Keys are stable names rather than nodes — the stage slug for a column,
   the session id for a timeline — because the node itself does not
   survive. A `v:` prefix marks a key belonging to a view; those are
   dropped when you switch views, so coming back is a fresh look rather
   than a stale position from a previous visit. The activity log spans
   every view, so its key carries no prefix and outlives the switch. */
const scrollMarks = {};

function markScroll(key, el) {
  if (!el) return;
  scrollMarks[key] = { top: el.scrollTop, left: el.scrollLeft };
}

/* Clamp rather than guess. A column whose cards moved on may be shorter
   than it was, and an offset past the new bottom should land at the new
   bottom — not throw, not blank. (Content that changed *above* the
   viewport still shifts what you are looking at. That is honest, and it is
   not what this is for.) */
function restoreScroll(key, el) {
  const at = scrollMarks[key];
  // a scroller that was at the top is already where it belongs, and
  // saying so here is what keeps the common frame free of the layout
  // flush that reading scrollHeight costs
  if (!el || !at || (!at.top && !at.left)) return;
  el.scrollTop = Math.max(0, Math.min(at.top, el.scrollHeight - el.clientHeight));
  el.scrollLeft = Math.max(0, Math.min(at.left, el.scrollWidth - el.clientWidth));
}

function forgetViewScroll() {
  for (const key of Object.keys(scrollMarks)) {
    if (key.startsWith('v:')) delete scrollMarks[key];
  }
}

/* ── header ───────────────────────────────────────────────────────────── */

/* One reading of "an agent is working", shared by the header chip and the
   tab title, so the two can never disagree about how many. */
function runningAgents() {
  return (S.state?.agents || []).filter(a => a.status === 'running');
}

function renderChip() {
  const agents = runningAgents();
  const liveYou = sessionsOf(m => isLiveSession(m) && !m.agentId);
  const el = $('#livechip');
  if (S.sseDown) {
    el.innerHTML = `<span class="dot" style="background:var(--alarm)"></span>` +
      `<span style="color:var(--alarm)">reconnecting…</span>` +
      `<span class="mono">what you see may be stale</span>`;
    return;
  }
  if (agents.length) {
    const longest = Math.min(...agents.map(a => a.started));
    el.innerHTML = `<span class="dot live"></span>` +
      `<span>${agents.length} agent${agents.length > 1 ? 's' : ''} working</span>` +
      `<span class="mono">${elapsed(longest)}</span>`;
  } else if (liveYou.length) {
    el.innerHTML = `<span class="dot live"></span><span>you, working</span>` +
      `<span class="mono">${liveYou.length} session${liveYou.length > 1 ? 's' : ''}</span>`;
  } else {
    el.innerHTML = `<span class="dot"></span><span style="color:var(--muted)">quiet</span>`;
  }
}

/* Sync only shows itself when it has stopped converging: a stall that is
   not visible is two halves of a team quietly drifting apart. Offline is
   driftwood (degraded, self-healing); anything waiting on a human is
   terracotta. */
function renderSync() {
  const s = S.state?.sync;
  const el = $('#syncchip');
  if (!s || !s.enabled || s.state === 'ok') { el.hidden = true; return; }
  const alarm = s.state === 'stalled';
  const detail = s.detail || '';
  el.hidden = false;
  el.title = detail;
  el.innerHTML = `<span class="dot" style="background:var(--${alarm ? 'alarm' : 'idle'})"></span>` +
    `<span style="color:var(--${alarm ? 'alarm' : 'muted'})">sync ${alarm ? 'stalled' : 'behind'}</span>` +
    `<span class="mono">${esc(detail.split(' — ')[0].replace(/^sync[^:]*:\s*/, ''))}</span>`;
}

/* The commands a headless agent may run are the one thing it cannot work
   around: with none configured a work agent still edits and commits, but it
   can never run this project's tests, and nothing said so until a run had
   already ended saying it. Same shape as the drive's "no driver" — a quiet
   statement of what this project has not set up, in the settled register,
   never `--alarm`: nothing is failing here. A project that set it, by
   detection or by hand, sees nothing at all. */
function renderAgentCommands() {
  const el = $('#cmdchip');
  const missing = S.state && S.state.hasAgentCommands === false;
  el.hidden = !missing;
  if (!missing) return;
  el.title = 'Headless agents have no project commands to run here, so a ' +
    "work agent cannot run this project's tests. Set BOARD_AGENT_COMMANDS " +
    'in manager/local/.env — comma-separated command prefixes, e.g. ' +
    '"npm test". Work still runs; the agent simply cannot check itself.';
  el.innerHTML = `<span class="dot" style="background:var(--idle)"></span>` +
    `<span style="color:var(--muted)">no agent commands</span>` +
    `<span class="mono">BOARD_AGENT_COMMANDS</span>`;
}

/* The configuration check's own chip. Unlike the sync and phase chips it
   is always here, and deliberately: those two are *states* that come and
   go, and this is the door to a diagnosis — a door that appeared only
   when something was already wrong would be a door nobody learned about.

   What it says, it says honestly. Before anything has been read it offers
   the check and names where the policy comes from. A document that does
   not parse is the one fact the cheap state payload already knows, so
   that wears `--alarm` without anything being resolved. After a reading
   it carries that reading's issue count, `stale` once the policy has
   moved under it, and the title says when it was taken — "no issues when
   you last looked" is a different claim from "no issues". */
function renderDoctor() {
  const el = $('#doctorchip');
  const policy = S.state?.policy || {};
  const read = S.doctor && S.doctor.report;
  let colour = 'muted', tail = policy.kind === 'legacy'
    ? 'legacy settings' : (policy.identity || 'policy');
  let title = 'Configuration check — what this board would grant, run and ' +
    'refuse for each purpose, and how to fix anything that would stop a ' +
    'launch. Opening it starts nothing.';
  if (policy.problem) {
    colour = 'alarm';
    tail = 'policy broken';
    title = policy.problem + ' — open the configuration check for the fix.';
  } else if (read) {
    // No calm colour for "no issues": a static reading is not a pass, so
    // only an issue changes the chip's colour.
    const issues = (read.summary.issues || []).length;
    const stale = configStale(read);
    colour = issues ? 'alarm' : 'muted';
    tail = stale ? 'stale' : issues ? `${issues} issue${issues === 1 ? '' : 's'}` : 'no issues';
    title = `${read.summary.headline}. ${read.summary.scope} Checked ` +
      `${fmtShort(read.generated)}${stale ? '; the policy has changed since' : ''}.`;
  }
  el.title = title;
  el.setAttribute('aria-label', `open the configuration check — ${tail}`);
  el.innerHTML = `<span class="dot" style="background:var(--${colour === 'muted' ? 'idle' : colour})"></span>` +
    `<span style="color:var(--${colour})">⚕ configuration</span>` +
    `<span class="mono">${esc(clip(String(tail), 28))}</span>`;
}

/* ── a phase in flight ────────────────────────────────────────────────── */

/* The phases the header has something to say about: one running, or one
   halted and not yet settled. A phase nobody has started, and one whose
   card has left in-progress/, are simply not here — with none of them the
   header is exactly what it was before phases existed.

   A halt leads, because it is the one a person must not scroll past. */
function phasesInFlight() {
  return Object.values(S.state?.phases || {})
    .filter(p => p.running || p.halted)
    .sort((a, b) => (b.halted ? 1 : 0) - (a.halted ? 1 : 0) ||
                    a.file.localeCompare(b.file));
}

/* Where a phase is up to, from the members the last pass read: how many
   have landed on the phase branch, and which one is in flight — an agent
   on it, or its checks still running. */
function phaseProgress(p) {
  const members = p.members || [];
  return {
    done: members.filter(m => m.state === 'merged').length,
    total: members.length,
    on: members.find(m => m.state === 'running') ||
        members.find(m => m.state === 'waiting') || null,
  };
}

function clip(text, n) {
  return text.length > n ? text.slice(0, n - 1) + '…' : text;
}

/* What the chip says after the name: the halt and where it happened, or
   the progress and the card in flight. The whole of it is on the title —
   a header chip is not the place a reason gets to run long. */
function phaseChipDetail(p) {
  if (p.halted) {
    return (p.haltedAt ? `halted at #${p.haltedAt} — ` : 'halted — ') +
      clip(p.haltedWhy || p.halted, 46);
  }
  const at = phaseProgress(p);
  const rest = at.on ? `on #${at.on.number || at.on.file}`
    : (p.waitingOn || []).length ? `waiting on #${p.waitingOn[0]}` : '';
  return `${at.done}/${at.total}` + (rest ? ` · ${rest}` : '');
}

function renderPhases() {
  const el = $('#phasechips');
  const live = phasesInFlight();
  el.hidden = !live.length;
  el.innerHTML = live.map(p => {
    const at = phaseProgress(p);
    const detail = phaseChipDetail(p);
    // colour only means state: a run alive breathes in accent, a halt
    // holds in alarm until the phase is resumed or held
    const title = (p.halted
      ? `${p.file} halted${p.haltedAt ? ` at ${p.haltedAt}` : ''} — ` +
        `${p.haltedWhy || p.halted}. It stays here until the phase is run again or held.`
      : `${p.file} is running on ${p.branch} — ${at.done} of ${at.total} cards merged`) +
      ' · click to open the phase card';
    const dot = p.halted
      ? '<span class="dot" style="background:var(--alarm)"></span>'
      : '<span class="dot live"></span>';
    return `<div class="livechip" data-phasechip="${esc(p.file)}" title="${esc(title)}">` +
      dot + `<span class="name${p.halted ? ' halted' : ''}">⟶ ${esc(phaseLabel(p))}</span>` +
      `<span class="mono${p.halted ? ' halted' : ''}">${esc(detail)}</span></div>`;
  }).join('');
  el.querySelectorAll('[data-phasechip]').forEach(chip =>
    chip.addEventListener('click', () => {
      const task = findTask(chip.dataset.phasechip);
      if (!task) return;
      setView('board');
      showDetail(task);
    }));
}

/* The crossing this feature stands on, seen from the other side: a phase
   halts while you are on the Board, and the switcher says so without you
   having to go and look. The count is the phases running; the mark is a
   halt, in the alarm every other stopped thing wears. A board with no
   phase in flight has a switcher that reads exactly as it always did. */
function renderViews() {
  const btn = document.querySelector('#views button[data-view="phases"]');
  if (!btn) return;
  const all = Object.values(S.state?.phases || {});
  const running = all.filter(p => p.running).length;
  const halted = all.filter(p => p.halted);
  btn.innerHTML = 'Phases' +
    (running ? `<span class="vcount">${running}</span>` : '') +
    (halted.length ? '<span class="vhalt"></span>' : '');
  btn.title = halted.length
    ? halted.map(p => `${p.file} halted${p.haltedAt ? ` at ${p.haltedAt}` : ''} — ` +
        `${p.haltedWhy || p.halted}`).join(' · ') + ' — open Phases to read it and run it again'
    : running
      ? `${running} phase${running > 1 ? 's' : ''} running — a swimlane each`
      : 'One swimlane per phase: its cards, its log, its controls';
  renderSettingsTab();
}

/* The same crossing, for configuration: a policy that refuses something
   has to be learnable from whichever view you are on, because the thing it
   refuses is the next launch. The mark is the alarm every other blocked
   thing wears, and it appears only when the cheap reading in the state
   payload says there is something to say — a board on the legacy settings
   has a switcher that reads exactly as it did before this view existed. */
function renderSettingsTab() {
  const btn = document.querySelector('#views button[data-view="settings"]');
  if (!btn) return;
  const s = S.state?.settings || {};
  btn.innerHTML = 'Settings' + (s.invalid ? '<span class="vhalt"></span>' : '');
  btn.title = s.invalid
    ? (s.problem || 'this board\'s execution policy refuses something') +
      ' — open Settings for the field and the remedy'
    : s.configured
      ? `${s.checks} named check${s.checks === 1 ? '' : 's'}` +
        (s.gated.length ? `, gating ${s.gated.join(', ')}`
                        : ', and no gate requiring any of them')
      : 'How this board is configured, what has been verified, and what to ' +
        'configure next';
}

function setView(view) {
  // leaving a view drops where you were in it: a hidden view's scrollers
  // read 0 anyway, and coming back with a remembered offset would be
  // restoring a position from a visit that has since gone stale
  if (view !== S.view) forgetViewScroll();
  S.view = view;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  render();
}

/* The tab says which bench this is: the project first (tab truncation eats
   the tail, and the tail is the same in every bench tab), then the view.
   Without a project in state the server-rendered title stands.

   Ahead of even the project, while and only while agents run, the count —
   the one state you want most from a tab you are not looking at, and the
   only place a backgrounded window can still say it. The same reasoning
   that put the project first applies harder to it, so it leads: a tab
   narrowed to a few characters still shows it. It is the in-flight glyph
   the CI and copilot chips already use, not an emoji, and a quiet board
   is the plain title, byte for byte. */
const VIEW_TITLES = { board: 'bench', phases: 'phases', flight: 'sessions',
  focus: 'focus', settings: 'settings' };
const WORKING_MARK = '◌';

function tabTitle(project, view, working) {
  return (working ? working + WORKING_MARK + ' · ' : '') +
    project + ' · ' + (VIEW_TITLES[view] || 'bench');
}

/* render() runs on every SSE frame, so the title is written only when it
   actually changed rather than dozens of times a second. */
let shownTitle = null;

function renderTitle() {
  if (!S.state?.project) return;
  const title = tabTitle(S.state.project, S.view, runningAgents().length);
  if (title === shownTitle) return;
  shownTitle = title;
  document.title = title;
}

function render() {
  if (!S.state) return;
  forgetActsOfVanishedCards();
  renderTitle();
  renderChip();
  renderPhases();
  renderViews();
  renderSync();
  renderAgentCommands();
  renderDoctor();
  if (S.view === 'flight') renderFlight();
  else if (S.view === 'focus') renderFocus();
  // render() runs on every SSE frame. Repainting the policy editor from
  // under a half-typed field would lose the edit, so a dirty draft holds
  // the paint: every other change to this view comes from a handler that
  // calls renderSettings() itself.
  else if (S.view === 'settings') { if (!settingsEditing()) renderSettings(); }
  else renderCards();
  renderBar();
  renderLog();
}

/* Two views draw cards, and they draw the same cards: the Board's columns
   and a phase lane's. Anything that changes what a card looks like —
   selecting one, closing the drawer — redraws whichever of them you are
   on, rather than assuming the Board. */
function renderCards() {
  if (S.view === 'phases') renderLanes(); else renderBoard();
}

/* ── board ────────────────────────────────────────────────────────────── */

/* A phase member is not drawn on the Board view. It keeps its stage, its
   file, its agent and its actions — this view simply stops listing it,
   because the phase card stands for it here. The Board goes back to
   meaning one thing: the work you are personally holding, in five columns
   that fit.

   Membership is the only thing that hides a card, so *removing* membership
   is the un-hiding — no sweep, no migration, no second rule. A phase card
   archived, or a number dropped from its `## Cards` list, stops deriving
   the membership at all (the server weaves it fresh on every read), and a
   phase that has reached done/ is over: it holds nothing and hands its
   cards straight back into the columns they are genuinely in.

   A membership that did not resolve hides nothing either: an authoring
   mistake must not make work vanish, so a card wearing `phase drift` stays
   where it can be seen. */
function heldByPhase(task) {
  if (!task.phase || (task.phaseDrift || []).length) return false;
  const card = findTask(task.phase.file);
  return !!card && card.stage !== 'done';
}

/* What a column draws, and what its header says about what it does not.
   The count is the number of cards you can see — true by construction
   rather than true-with-a-footnote — and `+2 in phases` beside it is a
   signpost to where the rest went, in the register the existing note uses.
   It appears only where members are actually hidden, so a board with no
   phases on it reads exactly as it did before they existed.

   The agents note counts the agents on the cards this column draws;
   counting every agent anywhere is the header's live chip's job, and that
   chip still sees an agent working on a hidden member. */
function columnCards(stage) {
  return stage.tasks.filter(t => !heldByPhase(t));
}

function columnNote(stage, shown) {
  const agentsHere = shown.filter(t => agentOnTask(t.file)).length;
  const hidden = stage.tasks.length - shown.length;
  const notes = [];
  if (agentsHere) notes.push(`${agentsHere} agent${agentsHere > 1 ? 's' : ''}`);
  else if (STAGE_NOTE[stage.slug]) notes.push(STAGE_NOTE[stage.slug]);
  if (hidden) notes.push(`+${hidden} in phases`);
  return notes.join(' · ');
}

function renderBoard() {
  const board = $('#board');
  // where you were looking, taken before the wipe throws the nodes away:
  // the columns scroll down, #board itself scrolls sideways
  markScroll('v:board', board);
  board.querySelectorAll('.drop[data-stage]').forEach(d =>
    markScroll('v:col:' + d.dataset.stage, d));
  board.innerHTML = '';
  const drops = [];
  for (const stage of S.state.board.stages) {
    const col = document.createElement('section');
    col.className = 'kcol';
    const shown = columnCards(stage);
    col.innerHTML =
      `<h2><span class="tickmark" style="background:${STAGE_TINT[stage.slug]}"></span>` +
      `<span>${stage.label}</span><span class="count">${shown.length}</span>` +
      `<span class="note">${esc(columnNote(stage, shown))}</span></h2>`;
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.dataset.stage = stage.slug;
    // a column emptied by a phase says so rather than congratulating you
    if (!shown.length) drop.innerHTML = '<div class="empty">' +
      (stage.tasks.length ? 'Everything here is in a phase.' : 'Nothing here. Good.') +
      '</div>';
    for (const task of shown) drop.appendChild(cardFor(task));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      const { file, from } = JSON.parse(e.dataTransfer.getData('application/json'));
      if (from !== stage.slug) move(file, from, stage.slug);
    });
    col.appendChild(drop);
    board.appendChild(col);
    drops.push([stage.slug, drop]);
  }
  // the new nodes are in place: put the page back where it was, same frame
  restoreScroll('v:board', board);
  for (const [slug, drop] of drops) restoreScroll('v:col:' + slug, drop);
  if (S.selected) {
    S.selected = allTasks().find(t => t.file === S.selected.file) || null;
  }
  renderDrawer();
}

/* A phase is named by its card, so the chip says what the card says —
   minus the number it usually opens with (the chip's own tooltip carries
   that), and clipped to a chip's width. The whole name is one hover away. */
function phaseLabel(phase) {
  const name = phase.title ? phase.title.replace(/^\s*\d+\s*[—–-]\s*/, '') : phase.file;
  return name.length > 22 ? name.slice(0, 21) + '…' : name;
}

/* The phase card is now the only thing standing for its members on this
   view, so it carries the summary it owes them: how far the run has got.
   Progress is what has landed on the phase branch, which only a run knows
   — before there is one the card says how much it holds, which is the
   honest reading of a phase nobody has started. */
function phaseSummary(task) {
  const snap = (S.state.phases || {})[task.file];
  if (snap) {
    const at = phaseProgress(snap);
    return `${at.done} of ${at.total} merged`;
  }
  const total = (task.members || []).length;
  return `${total} card${total === 1 ? '' : 's'}`;
}

/* …and what it is doing right now: the member in flight while a run is on,
   the halt while one is held — and the quiet case this exists for, that
   nobody has started it. A phase card sitting in in-progress/ that has not
   been run used to look exactly like one that is running: the header chip
   is the only other place that difference is written, and it is absent both
   when a phase has not started and when there is no phase at all. So the
   card says it itself. `idle` is not work — it takes no accent, no
   breathing mark and no caret, because nothing is happening. Null when the
   phase has no story to tell here: one waiting in to-do/ is just a card. */
function phaseFlight(task) {
  const snap = (S.state.phases || {})[task.file];
  if (!snap) return null;
  if (snap.halted) {
    return { bad: true, line: 'halted' + (snap.haltedAt ? ` at #${snap.haltedAt}` : '') +
      ' — ' + (snap.haltedWhy || snap.halted) };
  }
  if (!snap.running) {
    if (task.stage !== 'in-progress') return null;
    return snap.stopped
      ? { idle: true, pill: 'held',
          line: 'held — ▸ run phase carries on from where it stopped' }
      : { idle: true, pill: 'not started',
          line: 'not started — ▸ run phase cuts its branch and starts the first card' };
  }
  const at = phaseProgress(snap);
  if (at.on) return { bad: false, line: `on #${at.on.number || at.on.file} — ${at.on.title}` };
  if ((snap.waitingOn || []).length) {
    return { bad: false, line: `waiting on #${snap.waitingOn[0]}` };
  }
  return { bad: false, line: 'running' };
}

/* Which phases this card could join, which is also whether the action is
   there at all: the phase cards waiting in to-do/, and none whatsoever for
   a card already in a phase, a phase card itself (they do not nest), or a
   card with no number for a list to name it by. A phase in in-progress/ is
   running — its members are being worked in the order the list had when it
   started — so it is not on offer. The board offers what it can do. */

/* Where a card's work starts and what its PR targets, as a chip.

   Two branch names and an arrow, which is the whole of what a person
   needs at card altitude: `⌖ task/56 → task/56` reads as "cut from the
   prerequisite, aimed back at it". When the two agree — the usual stacked
   case — the arrow is redundant, so only one name is drawn. */
function planChipLabel(p) {
  if ((p.drift || []).length) return 'plan drift';
  return p.startBranch === p.prBase ? p.startBranch
    : `${p.startBranch} → ${p.prBase}`;
}

function planChipTitle(p) {
  if ((p.drift || []).length) return p.drift.join(' · ');
  const bits = [`Starts from ${p.startBranch} (${p.source})`,
                `Its PR targets ${p.prBase} (${p.prSource})`];
  if (p.recorded) {
    bits.push(p.startCommit
      ? `Recorded when the run began, at ${p.startCommit.slice(0, 9)} — a later `
        + 'change to the board\'s default does not retarget it'
      : 'Recorded when the run began');
    if (p.provenance === 'adopted')
      bits.push('Adopted: this branch predates its recorded plan, so its base '
                + 'was read back out of git rather than planned');
    if (p.delivery === 'local-only')
      bits.push('Local-only: this board cannot open the PR automatically');
  } else {
    bits.push('Not recorded yet — resolved from the card as it stands. '
              + 'Click for the full preflight.');
  }
  return bits.join('. ') + '.';
}

/* The preflight itself, on demand: everything the board resolved and
   validated, or the one reason it does not resolve. It is read-only — the
   server fetches and answers, and creates no branch, no worktree and no
   run — so opening it before a launch costs nothing and is the point.

   `⌖ replan` is the one button here, and it is the only thing in the whole
   design that retargets work already under way. It records a new plan or
   refuses; it never resets, rebases or removes anything. */
async function planSheet(task) {
  const wrap = $('#sheetwrap');
  wrap.innerHTML = `<div class="sheet"><div class="stitle"><span>${esc(task.title)}</span>` +
    `<span class="mono">⌖ preflight</span></div><p>Resolving…</p></div>`;
  wrap.classList.add('open');
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
  const res = await fetch('/api/plan?file=' + encodeURIComponent(task.file) +
                          '&stage=' + encodeURIComponent(task.stage));
  const data = await res.json();
  if (!res.ok || !data.plan) {
    wrap.innerHTML = `<div class="sheet"><div class="stitle"><span>${esc(task.title)}</span>` +
      `<span class="mono">⌖ preflight</span></div>` +
      `<p>${esc(data.error || 'the plan could not be resolved')}</p>` +
      `<div class="sbtns"><button id="sh-noplan">Close<small>Nothing was started.</small></button>` +
      `</div></div>`;
    $('#sh-noplan').addEventListener('click', closeSheet);
    return;
  }
  const p = data.plan;
  const rows = [
    ['Starts from', (p.startRef || p.startBranch) +
      (p.startCommit ? ` · ${p.startCommit.slice(0, 9)}` : ''), p.source],
    ['Branch', p.branch, p.continuing ? 'already exists — the run continues on it'
                                      : 'cut by the board when the run starts'],
    ['PR targets', p.prBase, p.prSource],
    ['Delivery', p.delivery === 'pr' ? 'a PR is opened automatically' : 'local-only',
      p.delivery === 'pr' ? `${p.appRemote} and gh are both available`
                          : 'the work itself is unaffected'],
  ];
  const blocked = (p.blockers || []).length;
  wrap.innerHTML =
    `<div class="sheet"><div class="stitle"><span>${esc(task.title)}</span>` +
    `<span class="mono">${task.number ? '#' + esc(task.number) + ' · ' : ''}⌖ preflight</span></div>` +
    (blocked
      ? `<p class="bad">This card will not start: ${esc(p.blockers[0])}</p>`
      : `<p>Resolved and validated. Nothing has been created — a branch, a ` +
        `worktree and a run follow the launch, not this.</p>`) +
    `<div class="prows">` +
    rows.map(([k, v, why]) => `<div class="prow"><span class="k">${esc(k)}</span>` +
      `<span class="v">${esc(v)}</span><span class="why">${esc(why || '')}</span></div>`).join('') +
    `</div>` +
    ((p.notes || []).length
      ? `<p>${p.notes.map(n => esc(n)).join('<br>')}</p>` : '') +
    `<div class="sbtns">` +
    `<button id="sh-replan">⌖ Replan<small>Resolve this card afresh and record the ` +
    `result. Nothing is reset, rebased or removed — a branch that is not built on the ` +
    `new base is refused instead.</small></button>` +
    `<button id="sh-noplan">Close<small>Nothing is written.</small></button>` +
    `</div></div>`;
  $('#sh-noplan').addEventListener('click', closeSheet);
  $('#sh-replan').addEventListener('click', () => { closeSheet(); replan(task); });
}

/* ── what a run may do, and what it is guaranteed to have read ─────────
   The profile preflight, on demand: the resolved policy for one card and
   one launch intent, read from the same resolver the launch rides. It is
   read-only — it resolves and hashes, and pins nothing — so opening it
   before a launch costs nothing and is the point.

   Three things are kept visually apart because conflating them is the
   mistake this exists to end: what is *configured*, what is actually
   *enforced* (and by whom — a prefix rule is not a sandbox), and what is
   merely asked for in the prompt or owed to a later gate. Hashes and the
   settings precedence are real but secondary, so they fold away. */

const PROFILE_INTENT_FOR = { 'in-progress': 'work', review: 'act-pr' };

/* Has a review come in on this card's PR? The card's own action slot
   reads the same answer: until one has, a review card offers ◔ review PR
   and not ↻ act on PR, so its launch check opens on Review. */
function reviewIsIn(task) {
  const pr = (S.state.prs || {})[task.file];
  return !!task.prVerdict ||
    !!(pr && (pr.verdict !== 'pending' || (pr.copilot && pr.copilot !== 'asked')));
}

function profileIntentFor(task) {
  if (task.stage === 'review' && !(task.pr && reviewIsIn(task))) return 'review';
  return PROFILE_INTENT_FOR[task.stage] || 'review';
}

/* The purposes, in the words Settings → Agents uses (task 77). A launch
   check offers the three a card can launch; `refine` is listed only where
   every purpose is — the board-wide configuration check. */
const INTENT_LABEL = { work: 'Implementation', 'act-pr': 'PR fixes',
                       review: 'Review', 'refine': 'Card refinement' };
const LAUNCH_INTENTS = ['work', 'act-pr', 'review'];

/* An input's readable status, as the row's own state. `pinned` is the
   strong one: bench holds a read-only copy, so the run's bytes cannot
   change under it. `resolved` is the pre-launch reading of the same file
   — validated and hashed, not yet copied. */
const INPUT_STATE = {
  pinned: ['pass', '✓', 'pinned read-only for the run'],
  resolved: ['pass', '✓', 'readable — pinned at launch'],
  missing: ['fail', '✕', 'not there'],
  unreadable: ['fail', '✕', 'cannot be read'],
  refused: ['fail', '✕', 'refused'],
  unresolved: ['none', '—', 'not resolved'],
};

function inputRows(found) {
  const items = found.context || [];
  if (!items.length) {
    return `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">no approved context selected</span>` +
      `<span class="state">the run reads the repository it is in</span></div>`;
  }
  return items.map(i => {
    const [cls, glyph, word] = INPUT_STATE[i.status] || INPUT_STATE.unresolved;
    const need = i.required ? '' : ' · optional';
    return `<div class="check-row ${cls}" title="${esc(i.source)}">` +
      `<span class="glyph">${glyph}</span>` +
      `<span class="name">${esc(i.name)}</span>` +
      `<span class="state">${esc(word)}${need}</span></div>`;
  }).join('');
}

function grantRows(found) {
  const grants = found.commands || [];
  if (!grants.length) {
    return `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">no command grants</span>` +
      `<span class="state">this run may run nothing of the project's</span></div>`;
  }
  return grants.map(g =>
    `<div class="check-row" title="runs in the ${esc(g.root)} root">` +
    `<span class="glyph">$</span><span class="name">${esc(g.name)}</span>` +
    `<span class="state">${esc(g.prefix)}</span></div>`).join('');
}

function deniedRow(found) {
  const words = (found.denied || []).map(d => d.capability);
  const pub = found.publication || {};
  const allowed = ['commit', 'push', 'publish'].filter(k => pub[k]);
  return `<div class="prow"><span class="k">Blocked</span>` +
    `<span class="v">${esc(words.join(', ') || 'nothing named')}</span>` +
    `<span class="why">may ${esc(allowed.join(' and ') || 'change nothing')}</span></div>`;
}

/* Configured is not enforced, and the difference is the whole point. Each
   line names who answers for it; a prefix allow-rule says so in those
   words rather than borrowing the word "sandbox". */
function guaranteeLines(found) {
  const g = found.guarantees || {};
  const table = found.capabilities || {};
  const say = (list, lead) => (list || []).length
    ? `${lead}: ${list.map(n => `${n} (${(table[n] || {}).by || '—'})`).join(', ')}`
    : '';
  return [
    say(g.enforced, 'Enforced'),
    say(g.prefixMatched, 'Narrowed by prefix match, not confined'),
    say(g.pending, 'Asked for, enforced by nothing yet'),
    ...(g.promptOnly || []),
    g.caveat,
  ].filter(Boolean);
}

/* Where a run is meant to write is not where it is held. The intended
   scope and the OS isolation are two rows, and the second says plainly
   that nothing enforces it — read from the profile's own `isolation`, or,
   for a record frozen before that existed, from the capability table. */
function isolated(p) {
  if (p.isolation) return !!p.isolation.enforced;
  const cap = (p.capabilities || {})['filesystem-sandbox'] || {};
  return cap.enforcement === 'enforced';
}

function isolationLine(p) {
  if (p.isolation) return p.isolation.why;
  return isolated(p)
    ? 'filesystem-sandbox is enforced here'
    : 'not enforced — no filesystem-sandbox, so the writable scope is '
      + 'intended rather than a boundary';
}

/* Which existing action launches this purpose on this card, or why none
   does right now. The specs are the card's own — same label, same
   confirmation, same endpoint and the same `<file>::<label>` key — so
   the launch check reuses the card's arm-then-fire rather than adding a
   confirmation of its own, and an armed window is one window wherever
   the second click lands. The endpoint is sent the card and nothing the
   sheet resolved: the launch runs its own preflight again. */
function launchActionFor(task, intent) {
  if (agentOnTask(task.file))
    return { why: 'An agent is already working on this card. ‖ hold it first to launch another.' };
  if (intent === 'work') {
    if (task.stage !== 'in-progress')
      return { why: 'Implementation launches from in-progress/. Move the card there first.' };
    if (task.isPhase)
      return { why: 'A phase card is run with ▸ run phase; its work belongs to its members.' };
    const held = task.assignee && S.state.me && task.assignee !== S.state.me
      ? task.assignee : null;
    return { act: held
      ? { glyph: '▸', label: 'take over', confirm: `take from ${held}?`, busy: 'starting…',
          run: () => fireAgent(task, '/api/agent/start', { takeover: true }) }
      : { glyph: '▸', label: 'start work', confirm: 'start it?', busy: 'starting…',
          run: () => fireAgent(task, '/api/agent/start') } };
  }
  if (intent === 'act-pr') {
    if (task.stage !== 'review' || !task.pr)
      return { why: 'PR fixes need a card in review/ with an open PR.' };
    if (!reviewIsIn(task))
      return { why: 'PR fixes are offered once a review is in. Run ◔ review PR first.' };
    return { act: { glyph: '↻', label: 'act on PR', confirm: 'act on it?', busy: 'acting…',
                    run: () => fireAgent(task, '/api/agent/act-pr') } };
  }
  if (task.stage === 'review' && task.pr)
    return { act: { glyph: '◔', label: 'review PR', confirm: 'review it?', busy: 'reviewing…',
                    run: () => fireAgent(task, '/api/agent/review-pr') } };
  return { act: { glyph: '◔', label: 'still true?', confirm: 'check it?', busy: 'checking…',
                  run: () => fireAgent(task, '/api/agent/review') } };
}

/* The harness and model a launch of this purpose would ride, as the
   resolver gave them. An empty model is the harness's own default, and
   the page says so rather than naming a model nobody chose. */
function selectionRows(p) {
  const sel = p.selection;
  if (!sel) return [['Harness', 'not reported by this resolution', '']];
  const h = sel.harness || {}, m = sel.model || {};
  return [
    ['Harness', h.name || '—', h.inherited ? 'inherits the default' : (h.setting || '')],
    ['Model', m.value || 'harness default', m.value
      ? (m.inherited ? 'inherits the default' : (m.setting || ''))
      : 'bench passes no model; the vendor chooses'],
  ];
}

/* One left-aligned row: a short label, then its value wrapping in its
   own column. `copy` adds a labelled copy control for a path. */
function lrow(k, v, opts) {
  const o = opts || {};
  return `<div class="lrow${o.bad ? ' bad' : ''}"><span class="k">${esc(k)}</span>` +
    `<span class="v${o.mono === false ? ' prose' : ''}">${o.html ? v : esc(v)}` +
    (o.why ? `<small>${esc(o.why)}</small>` : '') + `</span>` +
    (o.copy ? copyButton(o.copy, k) : '') + `</div>`;
}

function copyButton(value, label) {
  return `<button class="chip2 ccopy" data-copy="${esc(value)}" ` +
    `aria-label="Copy ${esc(label)}">Copy</button>`;
}

/* The launch check: one card, one purpose, read from the resolvers the
   launch itself rides — `/api/plan` for where the work starts and what
   its PR targets, `/api/profile` for the harness, model, access and
   anything that stops it. Opening it fetches and resolves; it creates no
   branch, pins nothing and starts nothing, and it authorises nothing
   either: the launch below is the card's own action, which resolves and
   refuses again for itself. Launch readiness is its own question, so
   merge rules, Bench checks, CI and review stay on their own chips. */
async function profileSheet(task, intent) {
  intent = LAUNCH_INTENTS.includes(intent) ? intent : profileIntentFor(task);
  const wrap = $('#sheetwrap');
  if (!wrap.classList.contains('open')) S.sheetReturn = document.activeElement;
  const ref = task.number ? '#' + task.number : task.file;
  const head = (tail) =>
    `<div class="stitle"><span id="lc-title" tabindex="-1">Launch check</span>` +
    `<span class="mono">${esc(ref)} · ${esc(tail)}</span></div>`;
  const label = `launch check for ${ref}`;
  wrap.innerHTML = `<div class="sheet wide" role="dialog" aria-label="${esc(label)}">` +
    `${head(INTENT_LABEL[intent])}<p>Resolving…</p></div>`;
  wrap.classList.add('open');
  wrap.onclick = (e) => { if (e.target === wrap) closeSheet(); };

  const q = 'file=' + encodeURIComponent(task.file) +
            '&stage=' + encodeURIComponent(task.stage);
  // a relevance check reviews no branch, so it has no plan to show
  const wantsPlan = intent !== 'review' || !!task.pr;
  const read = async (url) => {
    try {
      const res = await fetch(url);
      return { ok: res.ok, data: await res.json() };
    } catch (e) {
      return { ok: false, data: { error: e.message || 'the board could not be asked' } };
    }
  };
  const [prof, plan] = await Promise.all([
    read('/api/profile?' + q + '&intent=' + encodeURIComponent(intent)),
    wantsPlan ? read('/api/plan?' + q) : Promise.resolve(null),
  ]);
  const p = prof.data.profile;
  const switcher = LAUNCH_INTENTS.map(key =>
    `<button class="chip2 ${key === intent ? 'accent' : ''}" data-intent="${key}" ` +
    `aria-pressed="${key === intent}">${esc(INTENT_LABEL[key])}</button>`).join('');
  if (!prof.ok || !p) {
    wrap.innerHTML = `<div class="sheet wide" role="dialog" aria-label="${esc(label)}">` +
      `${head(INTENT_LABEL[intent])}<div class="chiprow" role="group" ` +
      `aria-label="purpose">${switcher}</div>` +
      `<div class="cissue" role="alert"><b>Could not be checked</b>` +
      `<span>${esc(prof.data.error || 'the profile could not be resolved')}</span></div>` +
      `<div class="sbtns"><button id="sh-noprof">Close<small>Nothing was ` +
      `started, and nothing was pinned.</small></button></div></div>`;
    $('#sh-noprof').addEventListener('click', closeSheet);
    wrap.querySelectorAll('[data-intent]').forEach(btn =>
      btn.addEventListener('click', () => profileSheet(task, btn.dataset.intent)));
    return;
  }
  const pl = plan && plan.ok ? plan.data.plan : null;

  // What stops it, from either resolver, each with what to do about it.
  // The profile's diagnostics carry their remedy; the plan's refusals are
  // already sentences that name their way out.
  const stops = [];
  (p.diagnostics || []).forEach(d =>
    stops.push({ what: d.why || d.title, fix: d.remedy, code: d.code }));
  if (!(p.diagnostics || []).length)
    (p.blockers || []).forEach(b => stops.push({ what: b }));
  if (plan && !plan.ok)
    stops.push({ what: plan.data.error || 'the branch plan does not resolve',
                 fix: 'Open the branch plan (⌖) for the whole preflight.' });
  (pl && pl.blockers || []).forEach(b =>
    stops.push({ what: b, fix: 'Settle the card\'s branch headers, or ⌖ replan.' }));

  const pr = (S.state.prs || {})[task.file] || {};
  const rows = [
    lrow('Task', `${ref} — ${task.title}`, { mono: false }),
    lrow('Purpose', INTENT_LABEL[intent], { mono: false,
      why: intent === 'review'
        ? (task.pr ? 'PR review — the review intent, read-only'
                   : 'relevance check (◔ still true?) — the review intent, read-only')
        : `the ${intent} intent` }),
    ...selectionRows(p).map(([k, v, why]) => lrow(k, v, { why })),
  ];
  if (intent === 'review' && task.pr) {
    rows.push(lrow('Reviews', pr.head
      ? `PR head ${pr.head.slice(0, 12)}`
      : 'the PR head, read when the review starts',
      { why: 'pinned in a detached checkout of that commit at launch' }));
    if (pl) rows.push(lrow('PR target', pl.prBase, { why: pl.prSource }));
  } else if (intent === 'review') {
    rows.push(lrow('Reads', 'the application checkout',
      { mono: false, why: 'a relevance check pins nothing and reviews no branch' }));
  } else if (pl) {
    rows.push(
      lrow('Starts from', (pl.startRef || pl.startBranch) +
        (pl.startCommit ? ` · ${pl.startCommit.slice(0, 9)}` : ''), { why: pl.source }),
      lrow('Branch', pl.branch, { why: pl.continuing
        ? 'already exists — the run continues on it' : 'cut when the run starts' }),
      lrow('PR target', pl.prBase, { why: pl.prSource }));
  }
  rows.push(
    lrow('Access', !(p.publication || {}).commit
      ? 'read-only — no edits, commits or pushes'
      : `edits and commits${(p.publication || {}).push ? ', pushes' : ''} in its worktree`,
      { mono: false }),
    lrow('Runs in', p.cwd.path || `the ${p.cwd.policy} root`, { why: `${p.cwd.policy} root` }),
    // a limitation stays beside the decision it qualifies
    lrow('Intended writes', (p.writable || []).map(w => w.path).join(', ') || 'nothing',
      { why: 'intended scope, not a boundary' }),
    lrow('OS isolation', isolated(p) ? 'enforced' : 'none enforced',
      { mono: false, why: isolationLine(p) }));

  const action = launchActionFor(task, intent);
  const next = stops.length
    ? `<div class="cissue" role="alert"><b>Blocked — this launch would be refused</b>` +
      stops.map(s => `<span>${esc(s.what)}</span>` +
        (s.fix ? `<span class="fix"><b>Fix:</b> ${esc(s.fix)}</span>` : '') +
        (s.code ? `<code>${esc(s.code)}</code>` : '')).join('') + `</div>`
    : action.act
      ? `<div class="lnext"><button class="primary" id="lc-launch" ` +
        `aria-label="${esc(action.act.glyph + ' ' + action.act.label)}">` +
        `<span class="g">${action.act.glyph}</span>` +
        `${actLabel(action.act.label, action.act.confirm, action.act.busy)}</button>` +
        `<small>Configuration allows this launch. It arms on the first click ` +
        `and starts on the second; the launch checks the branch and policy ` +
        `again, so this summary authorises nothing.</small></div>`
      : `<div class="lnext"><small>${esc(action.why)}</small></div>`;

  markScroll('v:sheet:launch', wrap.querySelector('.sheet'));
  wrap.innerHTML =
    `<div class="sheet wide" role="dialog" aria-label="${esc(label)}">` +
    head(stops.length ? 'blocked' : INTENT_LABEL[intent]) +
    `<div class="chiprow" role="group" aria-label="purpose">${switcher}</div>` +
    `<p class="cscope">${stops.length ? 'Blocked.' : 'Configuration valid for this launch.'} ` +
    `Checked ${esc(fmtShort(Date.now() / 1000))} against current settings. ` +
    `This is not proof the run will succeed.</p>` +
    next +
    `<div class="lrows">${rows.join('')}</div>` +
    `<p class="cscope">Launch only. Merge rules, Bench checks, CI and review ` +
    `are separate signals on the card.</p>` +
    `<details class="fold"><summary>Access details — commands, files and blocked capabilities</summary>` +
    `<div class="panel"><div class="phead"><span class="label">Commands it may run</span>` +
    `<span class="r">prefix rules</span></div>${grantRows(p)}</div>` +
    `<div class="panel"><div class="phead"><span class="label">Files it is given</span>` +
    `<span class="r">read-only</span></div>${inputRows(p)}</div>` +
    `<div class="prows">${deniedRow(p)}</div>` +
    `<pre>${esc(guaranteeLines(p).join('\n\n'))}</pre></details>` +
    (pl ? `<details class="fold"><summary>Branch plan details</summary>` +
      `<div class="lrows">` +
      lrow('Delivery', pl.delivery === 'pr' ? 'a PR is opened automatically' : 'local-only',
        { mono: false }) +
      (pl.notes || []).map(n => lrow('Note', n, { mono: false })).join('') +
      `</div><button class="chip2" id="lc-plan">⌖ open the branch plan</button></details>` : '') +
    `<details class="fold"><summary>Policy, revisions and provenance</summary>` +
    `<div class="lrows">` +
    lrow('Policy', p.source.kind === 'legacy' ? 'the legacy settings'
      : (p.source.identity || 'a profile document'), { why: p.source.describes || '' }) +
    `</div><pre>${esc(profileDetail(p))}` +
    `${p.selection && !p.selection.model.value ? '\nmodel       ' + p.selection.model.words : ''}` +
    `</pre></details>` +
    `<div class="sbtns"><button id="lc-again">Check again<small>Resolves the ` +
    `current settings again. Starts nothing.</small></button>` +
    `<button id="sh-noprof">Close<small>Nothing is written.</small></button></div></div>`;
  restoreScroll('v:sheet:launch', wrap.querySelector('.sheet'));
  $('#sh-noprof').addEventListener('click', closeSheet);
  $('#lc-again').addEventListener('click', () => profileSheet(task, intent));
  const toPlan = $('#lc-plan');
  if (toPlan) toPlan.addEventListener('click', () => planSheet(task));
  wrap.querySelectorAll('[data-intent]').forEach(btn =>
    btn.addEventListener('click', () => profileSheet(task, btn.dataset.intent)));
  const launch = $('#lc-launch');
  if (launch && action.act) {
    const act = action.act;
    wireAction(launch, `${task.file}::${act.label}`, { ...act,
      run: async () => {
        const ok = await act.run();
        if (ok !== false) closeSheet();
        return ok;
      } });
  }
  const t = $('#lc-title');
  if (t && !wrap.contains(document.activeElement)) t.focus();
}

/* The technical half: identities, hashes, where the policy came from. Real
   and checkable, and nobody reads it first — so it folds. Contents never
   appear here; the server's allowlist has none to send. */
function profileDetail(p) {
  const lines = [
    `policy      ${p.policyId}`,
    `revision    ${p.revision}`,
    `resolver    ${p.runner.module} v${p.runner.version} · schema v${p.v}`,
    `adapter     ${p.adapter.name}${p.adapter.version ? ' v' + p.adapter.version : ''}` +
      `${p.adapter.declared ? '' : ' (declares no capabilities)'}`,
    `source      ${p.source.kind}${p.source.identity ? ' · ' + p.source.identity : ''}` +
      ` · ${(p.source.revision || '').slice(0, 12)}`,
    `precedence  ${(p.source.precedence || []).join('  >  ')}`,
    `request     ${p.requestId || '—'}`,
  ];
  if (p.requires && p.requires.length)
    lines.push(`requires    ${p.requires.join(', ')}`);
  for (const i of p.context || []) {
    lines.push(`input       ${i.name}  ${i.source}  ${i.revision || '—'}  ` +
               `sha256 ${(i.sha256 || '').slice(0, 16)}`);
    if (i.why) lines.push(`            ${i.why}`);
    if (i.remedy) lines.push(`            remedy: ${i.remedy}`);
  }
  if (p.bundle) lines.push(`bundle      ${p.bundle.path}`);
  for (const v of p.verify || [])
    lines.push(`verify      ${v.name} — ${v.status}: ${v.why}`);
  for (const v of p.prepare || [])
    lines.push(`prepare     ${v.name} — ${v.status}: ${v.why}`);
  for (const c of p.uiCommands || [])
    lines.push(`ui command  ${c.name} — ${c.why}`);
  return lines.join('\n');
}

/* ── readiness: what this board would grant, run and refuse ────────────

   The inspector. Everything the profile sheet says about one card, asked
   for the board as a whole and without a card at all — plus the two
   things only a diagnosis can say: what a *deliberately broken* policy
   would be told, and what each answer is actually worth.

   That second one is the whole discipline here. A resolution, a generated
   settings document, an adapter's own `run` against a stub, a process
   bench ran, and the installed CLI with a model are five different
   amounts of knowledge, and a single green badge over all of them would
   be the most reassuring lie this board could tell. So every row carries
   its level, every level carries what it does *not* prove, and a mode
   nobody asked for is drawn as `not asked` rather than left out.

   Four words, and the word carries the meaning rather than the colour —
   as it does in the verification panel, and for the same reason: a
   reader who cannot tell pine from terracotta still has to be able to
   tell "we checked and it is fine" from "we never checked". */
const DOCTOR_OUTCOME = {
  passed:   ['pass', '✓', 'passed'],
  failed:   ['fail', '✕', 'failed'],
  skipped:  ['none', '—', 'skipped'],
  deferred: ['none', '·', 'deferred'],
};

function doctorOutcome(word) {
  return DOCTOR_OUTCOME[word] || ['none', '?', String(word || '—')];
}

/* ── the configuration check (task 79) ────────────────────────────────

   One result model, drawn by the header's ⚕ sheet, Settings →
   Diagnostics and the Focus view alike, so there are no competing health
   summaries. The words come from the doctor — `summary.headline`, one
   `summary.scope` sentence adapted to what was actually recorded, each
   problem once (`summary.issues`) and a state word per row naming its
   evidence level — and the page decides no verdict of its own.

   Problems lead, each with the purpose or setting it affects, what is
   wrong and how to fix it. Everything that is fine folds into a count; so
   does everything not tested or not enforced, apart from it and never
   counted as fine. Definitions and limits sit behind "What was checked?",
   and the consequences of anything that executes stay beside its control. */
const CC_BAD = new Set(['invalid', 'blocked', 'unsupported',
                        'conformance-failed', 'execution-failed']);

/* A reading taken against a policy revision the board has since moved
   off is stale, and says so rather than standing as the current answer. */
function configStale(report) {
  const now = S.state && S.state.policy;
  if (!now || !report || !report.policy) return false;
  return (now.revision || '') !== (report.policy.revision || '')
    || (now.kind || '') !== (report.policy.kind || '');
}

function ccBadge(word, cls) {
  return `<span class="cbadge ${cls || ''}">${esc(word)}</span>`;
}

/* Which rows a purpose filter keeps: that purpose's own, plus the
   board-wide ones every launch shares. Bench's self-test belongs to no
   purpose. */
function ccFor(rows, purpose) {
  if (!purpose) return rows;
  return rows.filter(f => f.purpose === purpose || (!f.intent && !f.example));
}

function ccIssue(report, f) {
  const level = (report.evidence[f.evidence] || {}).label || f.evidence;
  return `<div class="cissue" role="listitem">` +
    `<div class="chead"><b>${esc(f.area || f.name)}</b>` +
    `${ccBadge(f.stateWord || f.outcome, 'bad')}<span class="clevel">${esc(level)}</span></div>` +
    `<span>${esc(f.detail)}</span>` +
    (f.remedy ? `<span class="fix"><b>Fix:</b> ${esc(f.remedy)}</span>` : '') +
    (f.code ? `<code>${esc(f.code)}</code>` : '') + `</div>`;
}

/* A short label for a row, so a list reads as a list rather than as
   prose; the sentence it stands for is one click away. */
function ccShort(f) {
  const n = f.name;
  if (n === 'launch') return 'Launch';
  if (n === 'verification') return 'Named checks';
  if (n.startsWith('harness:')) return 'Harness and model';
  if (n === 'roots') return 'Locations';
  if (n === 'policy') return 'Policy document';
  if (n === 'adapter') return 'Adapter';
  if (n === 'scope') return 'Which card';
  if (n.startsWith('gate:')) return 'Gate · ' + n.slice(5);
  return n.replace(/^(pending|fixture):/, '').replace(/-/g, ' ');
}

function ccRows(report, rows) {
  return rows.map(f => {
    const level = (report.evidence[f.evidence] || {}).label || f.evidence;
    return `<details class="crow"><summary><span class="ca">${esc(f.area || '')}</span>` +
      `<span class="cn">${esc(ccShort(f))}</span>` +
      `${ccBadge(f.stateWord || f.outcome, CC_BAD.has(f.state) ? 'bad' : 'dim')}</summary>` +
      `<div class="cbody"><span>${esc(f.about)}</span><span>${esc(f.detail)}</span>` +
      `<span class="clevel">evidence: ${esc(level)}${f.code ? ' · ' + esc(f.code) : ''}</span>` +
      (f.remedy && f.outcome !== 'passed'
        ? `<span class="fix"><b>Fix:</b> ${esc(f.remedy)}</span>` : '') +
      `</div></details>`;
  }).join('');
}

/* Workspace locations and execution permissions: short labels, one path
   per row, left-aligned and wrapping in its own column, each with a
   labelled copy control. */
function ccLocations(report) {
  const l = report.layout || {}, pol = report.policy || {};
  const path = (k, v) => v ? lrow(k, v, { copy: v }) : '';
  return `<details class="fold cfold"><summary>Workspace locations</summary>` +
    `<div class="lrows">` +
    path('Application', l.app) + path('Task storage', l.work) +
    path('Worktrees', l.worktrees) + path('Bench install', l.tool) +
    lrow('Layout', `${l.external ? 'external' : 'vendored'} · app base ${l.appBase} · ` +
      `state base ${l.stateBase}`) +
    `</div></details>` +
    `<details class="fold cfold"><summary>Execution permissions</summary>` +
    `<div class="lrows">` +
    (pol.path ? lrow('Policy document', pol.path, { copy: pol.path })
              : lrow('Policy document', 'none — the legacy settings apply', { mono: false })) +
    lrow('Revision', (pol.revision || '—').slice(0, 12)) +
    lrow('Adapter', (report.adapter || {}).name || '—') +
    lrow('Precedence', (pol.precedence || []).join(' > '), { mono: false }) +
    `</div></details>`;
}

/* The definitions and limits, kept out of the way of the result: what
   each stage proves and does not, what each evidence level is worth,
   every diagnostic and its remedy, and what the report withholds. */
function ccWhatWasChecked(report, extra) {
  const scopeRow = report.findings.find(f => f.name === 'scope');
  return `<details class="fold cfold"><summary>What was checked?</summary>` +
    `<div class="cbody">` +
    report.coverage.map(row =>
      `<span><b>${esc(row.label)}</b> — ${esc(row.asked ? 'asked in this check' : 'not asked')}. ` +
      `Proves ${esc(row.proves)}. Does not prove ${esc(row.doesNotProve)}.</span>`).join('') +
    (scopeRow ? `<span><b>Which card</b> — ${esc(scopeRow.detail)}</span>` : '') +
    Object.entries(report.outcomes || {}).map(([w, why]) =>
      `<span><b>${esc(doctorOutcome(w)[2])}</b> — ${esc(why)}</span>`).join('') +
    (extra || '') +
    `<span><b>Where this lives</b> — ${esc(report.location)}</span>` +
    `</div>` +
    `<details class="fold"><summary>Every diagnostic bench can produce, and its remedy</summary>` +
    `<pre>${esc(Object.entries(report.diagnosticCodes).map(
      ([code, d]) => `${code}\n  ${d.title}\n  ${d.remedy}`).join('\n\n'))}</pre></details>` +
    `<details class="fold"><summary>Roots, policy and what this report withholds</summary>` +
    `<pre>${esc(doctorDetail(report))}</pre></details></details>`;
}

/* The result itself. `o.purpose` narrows the lists to one purpose;
   `o.compact` (the Focus view) leaves out the locations and the
   reference fold. */
function configCheckBody(report, opts) {
  const o = opts || {};
  const sum = report.summary;
  const byId = Object.fromEntries(report.findings.map(f => [f.id, f]));
  const issueIds = new Set(sum.issues || []);
  const issues = ccFor((sum.issues || []).map(id => byId[id]).filter(Boolean), o.purpose);
  const rest = ccFor(report.findings.filter(f => !issueIds.has(f.id)
    && f.outcome !== 'failed' && f.name !== 'scope'), o.purpose);
  const fine = rest.filter(f => f.outcome === 'passed');
  const open = rest.filter(f => f.outcome !== 'passed');
  const stale = configStale(report);
  const ran = (sum.stages || []).filter(s => s.asked).map(s => s.label).join(', ');
  const stages = (sum.stages || []).map(s =>
    `<div class="lrow"><span class="k">${esc(s.label)}</span>` +
    `<span class="v prose">${ccBadge(s.word, s.state === 'failed' || s.state === 'issues'
      ? 'bad' : s.state === 'passed' || s.state === 'valid' ? '' : 'dim')}</span></div>`).join('');
  return `<div class="ccheck">` +
    `<div class="cresult" role="status">` +
    `<div class="cheadline${(sum.issues || []).length ? ' bad' : ''}">${esc(sum.headline)}` +
    (stale ? ' ' + ccBadge('Stale', 'bad') : '') + `</div>` +
    `<p class="cscope">${esc(sum.scope)}</p>` +
    `<p class="cmeta">Checked ${esc(fmtShort(report.generated))} · ${esc(ran)}</p></div>` +
    (stale ? `<p class="bad">The execution policy has changed since this check, so ` +
      `this result is stale. Check again for a current one.</p>` : '') +
    (issues.length
      ? `<div class="cissues" role="list" aria-label="configuration issues">` +
        issues.map(f => ccIssue(report, f)).join('') + `</div>`
      : o.purpose && (sum.issues || []).length
        ? `<p class="cscope">No issues for ${esc(INTENT_LABEL[o.purpose] || o.purpose)}.</p>`
        : '') +
    (o.compact ? '' : `<div class="lrows cstages" aria-label="results by stage">${stages}</div>`) +
    (fine.length
      ? `<details class="fold cfold"><summary>${fine.length} check${fine.length === 1 ? '' : 's'} ` +
        `with no issues</summary><div class="crows">${ccRows(report, fine)}</div></details>` : '') +
    (open.length
      ? `<details class="fold cfold"><summary>${open.length} not tested, not enforced ` +
        `or not configured</summary><div class="crows">${ccRows(report, open)}</div></details>` : '') +
    (o.compact ? '' : ccLocations(report) + ccWhatWasChecked(report, o.reference)) +
    `</div>`;
}

/* The Focus view's panel: the same result, narrowed to the purpose the
   run rides, with no overall tick — a static reading says nothing about
   whether this run will work. */
function readinessPanel(report, opts) {
  const o = opts || {};
  return `<div class="panel"><div class="phead">` +
    `<span class="label">${esc(o.title || 'Configuration check')}</span>` +
    `<span class="r">${esc(o.intent ? (INTENT_LABEL[o.intent] || o.intent) : 'All purposes')}` +
    `</span></div>` + configCheckBody(report, { purpose: o.intent || null, compact: true }) +
    `</div>`;
}

/* The inspector itself. A GET of the report, so opening it resolves,
   hashes and reads approved files and does nothing else: no process, no
   pinned bundle, no provisioned checkout, no model, no grant changed.
   Every stage that *does* something is a button below, armed, with its
   side effects written out beside it in the server's own words. */
async function doctorSheet(mode) {
  const wrap = $('#sheetwrap');
  if (!wrap.classList.contains('open')) S.sheetReturn = document.activeElement;
  const head = (tail) =>
    `<div class="stitle"><span id="cc-title" tabindex="-1">Configuration check</span>` +
    `<span class="mono">⚕ ${esc(tail)}</span></div>`;
  wrap.innerHTML = `<div class="sheet wide" role="dialog" ` +
    `aria-label="configuration check">${head('checking…')}` +
    `<p>Checking the configuration. Nothing is being started.</p></div>`;
  wrap.classList.add('open');
  wrap.onclick = (e) => { if (e.target === wrap) closeSheet(); };

  let report = null, error = null;
  try {
    const res = await fetch('/api/doctor');
    const data = await res.json();
    if (res.ok && data.doctor) report = data.doctor;
    else error = data.error || 'the configuration check could not be built';
  } catch (e) {
    error = e.message || 'the board could not be asked';
  }
  if (!report) {
    // a check that did not complete is its own result, never a blank or
    // an earlier reading passed off as this one
    wrap.innerHTML = `<div class="sheet wide" role="dialog" ` +
      `aria-label="configuration check">${head('not completed')}` +
      `<div class="cissue" role="alert"><b>The configuration check did not complete</b>` +
      `<span>${esc(error)}</span>` +
      `<span class="fix"><b>Fix:</b> make sure the board is running, then check again.</span></div>` +
      `<div class="sbtns"><button id="sh-again">Check again<small>Starts nothing.</small></button>` +
      `<button id="sh-nodoc">Close<small>Nothing was started.</small></button></div></div>`;
    $('#sh-nodoc').addEventListener('click', closeSheet);
    $('#sh-again').addEventListener('click', () => doctorSheet(mode));
    $('#cc-title').focus();
    return;
  }
  S.doctor = { at: Date.now(), report };
  renderDoctor();
  paintDoctorSheet(report, mode);
}

/* Drawn from a report already in hand, so switching the intent tab or
   coming back from an active stage repaints without asking again. */
function paintDoctorSheet(report, intent) {
  const wrap = $('#sheetwrap');
  const head = (tail) =>
    `<div class="stitle"><span id="cc-title" tabindex="-1">Configuration check</span>` +
    `<span class="mono">⚕ ${esc(tail)}</span></div>`;
  const switcher = ['', ...Object.keys(INTENT_LABEL)].map(key =>
    `<button class="chip2 ${key === (intent || '') ? 'accent' : ''}" ` +
    `data-doctorintent="${esc(key)}" aria-pressed="${key === (intent || '')}">` +
    `${key ? esc(INTENT_LABEL[key]) : 'All purposes'}</button>`).join('');

  // The stages that execute something, each its own result beside its
  // own armed control, with what it would do written out next to it.
  const results = Object.fromEntries((report.summary.stages || []).map(s => [s.mode, s]));
  const stages = report.coverage.filter(row => row.mode !== 'inspect')
    .map(row => {
      const m = report.modes[row.mode];
      const s = results[row.mode] || { word: row.asked ? 'asked' : 'Not tested' };
      const effects = (m.sideEffects || [])
        .map(e => `<li>${esc(e)}</li>`).join('');
      const label = row.mode === 'real-agent'
        ? `⚕ ${m.label} — needs your approval`
        : `⚕ run ${m.label}`;
      return `<div class="cstage"><div class="chead"><b>${esc(m.label)}</b>` +
        ccBadge(s.word, s.state === 'failed' ? 'bad' : s.state === 'passed' ? '' : 'dim') +
        `<button class="chip2" data-doctormode="${esc(row.mode)}" ` +
        `aria-label="${esc(label)}">${actLabel(label, 'run it?', 'running…')}` +
        `</button></div><span>${esc(m.does)}</span>` +
        `<span class="fx"><b>Side effects:</b></span>` +
        `<ul>${effects}</ul>` +
        `${m.needsApproval ? '<span class="fx">This one needs your explicit approval and ' +
          'is never implied by another stage.</span>' : ''}</div>`;
    }).join('');
  const issues = (report.summary.issues || []).length;

  // the sheet scrolls inside itself and this replaces it: a stage run from
  // near its end, or a purpose tab, must not drop the reader at the top
  markScroll('v:sheet:doctor', wrap.querySelector('.sheet'));
  wrap.innerHTML =
    `<div class="sheet wide" role="dialog" aria-label="configuration check">` +
    head(issues ? `${issues} issue${issues === 1 ? '' : 's'}` : 'no issues') +
    `<div class="chiprow" role="group" aria-label="purpose">${switcher}</div>` +
    configCheckBody(report, { purpose: intent || null,
      reference: Object.entries(report.evidence).map(([level, e]) =>
        `<span><b>${esc(e.label)}</b> (${esc(level)}) — proves ${esc(e.proves)}; ` +
        `does not prove ${esc(e.doesNotProve)}.</span>`).join('') }) +
    // open once a stage has been run from here, so its control and its
    // side effects are where the person who ran it left them
    `<details class="fold cfold"${report.ran.length > 1 ? ' open' : ''}>` +
    `<summary>Run execution diagnostics</summary>` +
    `<div class="cstages">${stages}</div></details>` +
