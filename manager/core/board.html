    return c && c.error ? `<p class="dnote bad">${esc(c.error)}</p>`
                        : `<p class="dnote">reading the discussion…</p>`;
  }
  const d = c.data;
  const notes = [];
  if (d.blocked) notes.push(d.blocked);
  if (!d.refine.ready) {
    notes.push('Update card with agent is not available on this board: ' +
               (d.refine.blockers[0] || 'the refine intent does not resolve'));
  }
  const persistence = !d.persistence.commits
    ? `<p class="dnote">Comments and decisions are written to the card file; ` +
      `they are not committed, because BOARD_COMMIT_MOVES is off.</p>`
    : !d.persistence.syncs
    ? `<p class="dnote">Comments and decisions are committed to the work state; ` +
      `BOARD_SYNC is off, so they reach other boards when you push.</p>` : '';
  const jobs = {};
  for (const job of d.jobs) (jobs[job.comment] = jobs[job.comment] || []).push(job);
  const rows = d.entries.map(e => {
    if (e.kind === 'decision') {
      return `<div class="dentry decision"><div class="dhead2">` +
        `<b>${esc(e.outcome)}</b> <span class="mono">${esc(e.proposal || '')}</span>` +
        ` · ${esc(e.author || '')} · ${esc(e.at || '')}</div>` +
        `<div class="cbody">${esc(e.body || '')}</div></div>`;
    }
    const mine = jobs[e.id] || [];
    const latest = mine[0];
    return `<div class="dentry comment" data-comment="${esc(e.id)}">` +
      `<div class="dhead2"><b>${esc(e.author || 'unattributed')}</b> · ` +
      `${esc(e.at || '')} <span class="mono">${esc(e.id)}</span></div>` +
      `<div class="cbody">${esc(e.body || '')}</div>` +
      (latest ? jobHtml(latest, t) +
                (mine.length > 1 ? `<p class="dnote">${mine.length - 1} earlier attempt` +
                 `${mine.length === 2 ? '' : 's'}: ${mine.slice(1).map(j => esc(j.status)).join(', ')}</p>` : '')
              : `<div class="racts"><button class="dact" data-act="refine"` +
                `${d.blocked || !d.refine.ready ? ' disabled' : ''}>` +
                `${actLabel('✎ Update card with agent', 'click again — asks an agent', 'asking…')}` +
                `</button></div>`) +
      `</div>`;
  }).join('');
  return (notes.length ? `<div class="well bad"><span class="lead">·</span><div class="wbody">` +
           notes.map(esc).join('<br>') + `</div></div>` : '') +
    persistence +
    (rows || `<p class="dnote">No comments yet.</p>`);
}

function discussionPanel(t) {
  const c = (S.disc[t.file] || {}).data;
  const cannot = !c || !!c.blocked || !c.refine.ready;
  return `<section class="discussion" aria-label="Discussion">` +
    `<div class="phead">Discussion<span class="mono">history — the brief above is the requirement</span></div>` +
    `<div id="disc-live">${discussionLive(t)}</div>` +
    `<div class="composer">` +
    `<textarea id="commentbox" rows="3" aria-label="Comment or instruction for this card" ` +
    `placeholder="A comment, or an instruction for the brief">${esc(S.commentDraft[t.file] || '')}</textarea>` +
    `<div class="racts"><button class="dact" id="addComment">Add comment</button>` +
    `<button class="dact" id="refineNew"${cannot ? ' disabled' : ''}>` +
    `${actLabel('✎ Update card with agent', 'click again — asks an agent', 'asking…')}</button></div>` +
    `<p class="dnote">Add comment only saves it. Update card with agent also asks an ` +
    `agent to propose a revised brief — it reads, it implements nothing, and the ` +
    `brief changes only when you apply the proposal.</p></div></section>`;
}

async function postCard(url, payload) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!res.ok) {
    toast(data.error || 'the board refused that', true);
    if (data.stale && S.selected) loadDiscussion(S.selected, true);
    return null;
  }
  return data;
}

function afterCardWrite(t) {
  loadDiscussion(t, true);
  loadState();
}

function wireDiscussion(t) {
  loadDiscussion(t);
  const box = $('#commentbox');
  if (!box) return;
  box.addEventListener('input', () => {
    S.commentDraft[t.file] = box.value;
    // a different text is a different request; the same text resent is not
    delete S.refineKey[t.file];
  });
  $('#addComment').addEventListener('click', async () => {
    const data = await postCard('/api/card/comment',
      { file: t.file, stage: t.stage, body: box.value });
    if (!data) return;
    S.commentDraft[t.file] = '';
    toast(`comment ${data.comment.id} saved` +
          (data.comment.committed ? '' : ' — written to the card, not committed'));
    afterCardWrite(t);
  });
  wireAction($('#refineNew'), `${t.file}::refine-new`, {
    label: 'Update card with agent', confirm: true,
    run: async () => {
      const key = S.refineKey[t.file] = S.refineKey[t.file] || newRequestKey();
      const data = await postCard('/api/card/refine',
        { file: t.file, stage: t.stage, text: box.value, request: key });
      if (!data) return false;
      S.commentDraft[t.file] = '';
      delete S.refineKey[t.file];
      toast(data.duplicate ? 'that refinement was already asked for'
                           : `${data.job.name || 'an agent'} is refining ${t.file} — it proposes; nothing changes until you apply`);
      afterCardWrite(t);
      return true;
    },
  });
  wireLive(t);
}

function wireLive(t) {
  const live = $('#disc-live');
  if (!live) return;
  live.querySelectorAll('.dentry.comment').forEach(row => {
    const comment = row.dataset.comment;
    row.querySelectorAll('button[data-act]').forEach(btn => {
      const jobEl = btn.closest('[data-job]');
      const job = jobEl ? jobEl.dataset.job : null;
      const act = btn.dataset.act;
      const key = `${t.file}::refine-${act}-${job || comment}`;
      const call = (url, payload, said) => async () => {
        const data = await postCard(url, payload);
        if (!data) return false;
        toast(said(data));
        afterCardWrite(t);
        return true;
      };
      const acts = {
        refine: { label: 'Update card with agent', confirm: true,
          run: call('/api/card/refine', { file: t.file, stage: t.stage, comment,
                                          request: newRequestKey() },
                    d => d.duplicate ? 'that refinement was already asked for'
                                     : `${d.job.name || 'an agent'} is refining ${t.file}`) },
        retry: { label: 'Retry', confirm: true,
          run: call('/api/card/refine', { file: t.file, stage: t.stage, comment,
                                          retry: true, request: newRequestKey() },
                    d => `${d.job.name || 'an agent'} is refining ${t.file} again`) },
        apply: { label: 'Apply', confirm: true,
          run: call('/api/card/refine/apply', { id: job },
                    d => d.already ? 'already applied' : `the brief of ${t.file} was updated`) },
        discard: { label: 'Discard',
          run: call('/api/card/refine/discard', { id: job },
                    d => d.already ? 'already discarded' : 'proposal discarded — the brief is unchanged') },
        cancel: { label: 'Cancel',
          run: call('/api/card/refine/cancel', { id: job }, () => 'refinement cancelled') },
      };
      if (acts[act]) wireAction(btn, key, acts[act]);
    });
  });
}

function renderDiscussion(t) {
  const live = $('#disc-live');
  if (!live) return;
  live.innerHTML = discussionLive(t);
  const c = (S.disc[t.file] || {}).data;
  const btn = $('#refineNew');
  if (btn && !btn.classList.contains('busy')) btn.disabled = !c || !!c.blocked || !c.refine.ready;
  wireLive(t);
}

/* Four signals a single green tick would collapse, each in its own words
   and with the revision it is about: what bench itself ran, what external
   CI said, what reviewers said, and what the merge gate decides from
   them. Green CI is not a named check, and no gate is not a pass — so each
   row says only what its own authority said. */
function signalsBlock(t) {
  const rows = [];
  const v = (S.state.verify || {})[t.file];
  if (v) {
    const [, , word] = verifyState(v.outcome);
    rows.push(['Bench checks', `${word} · ${v.passed} of ${v.checks} passed` +
      `${v.notRun ? ` · ${v.notRun} not run` : ''}`,
      verifyState(v.outcome)[0] === 'fail' ? 'bad' : '']);
  }
  const pr = (S.state.prs || {})[t.file];
  if (t.pr || pr) {
    const ci = pr && pr.ci;
    rows.push(['External CI', ci
      ? ({ pass: 'passing', fail: 'failing', running: 'running' }[ci] || ci) +
        (pr.detail ? ` · ${pr.detail}` : '') + ' — not a Bench check'
      : 'no CI result', ci === 'fail' ? 'bad' : '']);
    const verdict = prVerdict(t);
    rows.push(['Review', ({ green: 'approved', red: 'changes requested',
      pending: 'no verdict yet' }[verdict] || 'no pull request') +
      (pr && pr.copilot ? ` · copilot ${pr.copilot}` : ''),
      verdict === 'red' ? 'bad' : '']);
  }
  const r = (S.state.reviews || {})[t.file];
  if (r) {
    const [, word] = REVIEW_LABELS[r.label] || REVIEW_LABELS.none;
    rows.push(['Pinned review', `${word} · ${(r.head || 'unrecorded').slice(0, 12)}`,
      r.label === 'superseded' ? 'bad' : '']);
  }
  const g = (S.state.gates || {})[t.file];
  if (g) {
    const [cls, , word] = gateState(g.decision);
    rows.push(['Merge gate', `${word} — ${g.summary}`, cls === 'bad' ? 'bad' : '']);
  } else if (rows.length) {
    rows.push(['Merge gate', 'no gate configured — nothing is required before a '
      + 'merge, and that is not a pass', '']);
  }
  if (!rows.length) return '';
  return `<div class="pmembers"><div class="phead">Signals` +
    `<span class="mono">kept apart</span></div>` +
    rows.map(([k, v2, cls]) => `<div class="prow flat${cls === 'bad' ? ' bad' : ''}">` +
      `<span class="pstage">${esc(k)}</span>` +
      `<span class="ptitle">${esc(v2)}</span></div>`).join('') +
    `</div>`;
}

function allRecentEvents() {
  const merged = [];
  for (const evs of Object.values(S.events)) merged.push(...evs.slice(-40));
  merged.push(...(S.state.boardEvents || []).slice(-60));
  for (const run of Object.values(S.running)) merged.push(run);
  merged.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return merged;
}

function evRow(ev) {
  const cls = ev.running ? 'run' : ev.ok === false ? 'bad' : ev.ok === true ? 'ok' : '';
  const glyph = GLYPHS[ev.kind] || '·';
  const meta = ev.session ? sessionMeta(ev.session) : null;
  const who = meta ? `<span class="who-b">${esc((meta.label || '').split(' · ')[0])}</span> ` : '';
  return `<div class="ev ${cls}"><time>${fmtClock(ev.ts)}</time>` +
    `<span class="glyph">${glyph}</span><span class="what">${who}${esc(ev.summary)}</span></div>`;
}

function renderBar() {
  const bar = $('#statusbar');
  const drag = !!S.dragging;
  const hot = drag && S.dockHot;
  bar.classList.toggle('drag', drag);
  bar.classList.toggle('hot', hot);

  const merged = allRecentEvents();
  $('#actbtn').innerHTML =
    `<span class="chev">${S.logOpen ? '▾' : '▴'}</span>` +
    `<span class="dot live"></span><span>Activity</span>` +
    `<span class="mono">${merged.length}</span>`;

  const tail = merged[merged.length - 1];
  $('#bartail').innerHTML = tail
    ? `<span>${fmtClock(tail.ts)}</span>` +
      `<span style="color:${tail.ok === false ? 'var(--alarm)' : tail.ok === true ? 'var(--calm)' : 'var(--muted)'}">${GLYPHS[tail.kind] || '·'}</span>` +
      `<span class="t-what">${tail.session && sessionMeta(tail.session) ? `<span class="t-who">${esc((sessionMeta(tail.session).label || '').split(' · ')[0])}</span> ` : ''}${esc(tail.summary)}</span>`
    : `<span style="color:var(--dim)">quiet — events tick along here as they happen</span>`;

  $('#barhinttext').textContent = hot
    ? 'Release to archive — ⌘Z brings it back'
    : 'Drop anywhere along this bar to archive';

  const count = S.state.archivedCount || 0;
  $('#tray').innerHTML =
    `<span class="glyph2">${hot ? '↓' : '⌸'}</span>` +
    `<b>${hot ? 'Let go' : 'Archive'}</b>` +
    (count > 0 && !hot ? `<span class="count">${count}</span>` : '');
}

function renderLog() {
  $('#logpanel').classList.toggle('open', S.logOpen);
  if (!S.logOpen) return;
  const active = FILTERS.find(([key]) => key === S.logFilter);
  const kinds = active ? active[2] : null;
  const merged = allRecentEvents();
  const events = merged.filter(ev => !kinds || kinds.has(ev.kind)).slice(-150);
  const extras = Object.entries(S.state.board.extras).map(([name, files]) =>
    `<details><summary>${name}/ ${files.length}</summary><ul>` +
    files.map(f => `<li class="xfile" data-dir="${esc(name)}" data-name="${esc(f)}">${esc(f)}</li>`).join('') +
    `</ul></details>`).join('');
  $('#loghead').innerHTML =
    `<span class="label">Everything that happened</span>` +
    `<span class="mono">${merged.length} events</span>` +
    `<span class="spacer"></span>` +
    FILTERS.filter(f => f[3] !== 'session').map(([key, label]) =>
      `<button class="${S.logFilter === key ? 'on' : ''}" data-lf="${key}">${label}</button>`).join('') +
    extras;
  document.querySelectorAll('#loghead [data-lf]').forEach(b =>
    b.addEventListener('click', () => { S.logFilter = b.dataset.lf; renderLog(); }));
  document.querySelectorAll('#loghead .xfile').forEach(li =>
    li.addEventListener('click', () => openExtra(li.dataset.dir, li.dataset.name)));
  const body = $('#logbody');
  markScroll('log', body);
  body.innerHTML = events.length ? events.map(evRow).join('')
    : '<div class="ev quiet"><time></time><span class="glyph">·</span><span class="what">Nothing here. Good.</span></div>';
  restoreScroll('log', body);
  // and stuck to the bottom stays stuck to the bottom: that reading was
  // already right, and it outranks the mark
  if (S.logStick) body.scrollTop = body.scrollHeight;
}

async function archiveCard(file, from) {

  });

/* ── phases: a swimlane each ──────────────────────────────────────────────

   The Board draws the work you are personally holding; this draws what the
   phases are holding. One lane per phase card, the same five stages left to
   right, and the cards are the cards — the very nodes cardFor() builds for
   the Board, agent line, chips and hover actions intact. That fidelity is
   the whole reason this is a view and not a rail squeezed into five
   columns that could never spare the width.

   Nothing here ends a phase. Merging is a board move on the phase card, so
   there is exactly one place where work leaves the board, and it is not
   this one. */

/* Where a lane sits in the stack: a halt first, because it is the one
   thing on this page waiting on a person and it must not be below the
   fold; then a run in flight; then a run a person held, which is still
   theirs to resume and so belongs above the phases nobody has started;
   then the ones that are over. Every phase card draws a lane — a phase
   whose members are all merged and which is waiting on its own PR still
   owns them, and a lane that vanished exactly when it needed merging
   would be a view you could not trust. */
function laneRank(task) {
  const snap = (S.state.phases || {})[task.file];
  if (snap && snap.halted) return 0;
  if (snap && snap.running) return 1;
  if (snap && snap.stopped) return 2;
  return task.stage === 'done' ? 4 : 3;
}

function lanePhases() {
  return allTasks().filter(t => t.isPhase).sort((a, b) =>
    laneRank(a) - laneRank(b) ||
    (+a.number || 0) - (+b.number || 0) ||
    a.file.localeCompare(b.file));
}

/* `07`, `7` and `#007` are one card, on this side of the wire too —
   taskfiles.canonical_number, in the language the page is written in. */
function canonicalNumber(number) {
  const n = parseInt(number, 10);
  return Number.isNaN(n) ? String(number ?? '') : String(n);
}

/* The phase log: the `- <date> <time> · <entry>` lines the runner appends
   to a `## Phase log` section on the phase card, read here exactly as
   phases.py writes them. It is the record of every decision a run made,
   and the only thing that can tell "the phase has not reached this card"
   from "it started it and it ended badly" — until this view it had
   nowhere to be shown. */
const PHASE_LOG_LINE = /^-\s+(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})\s+·\s+(.+?)\s*$/;

function phaseLog(task) {
  const lines = (task.body || '').split('\n');
  const start = lines.findIndex(line => /^##\s+Phase log\s*$/.test(line));
  if (start < 0) return [];
  const entries = [];
  for (const line of lines.slice(start + 1)) {
    if (/^##\s/.test(line)) break;
    const match = PHASE_LOG_LINE.exec(line.trim());
    if (match) entries.push({ at: match[1], text: match[2] });
  }
  return entries;
}

/* Which members the phase branch already holds. While a run is on, the
   runner's last pass has just read it off git; once the phase leaves
   in-progress/ there are no more passes — and the log, written by the same
   runner as it merged them, still remembers. Two durable sources for one
   fact, which is what keeps a phase in review/ from drawing a lane where
   nothing ever landed. */
function mergedIn(task) {
  const merged = new Set();
  const snap = (S.state.phases || {})[task.file];
  for (const m of ((snap && snap.members) || [])) {
    if (m.state === 'merged' && m.number) merged.add(canonicalNumber(m.number));
  }
  for (const entry of phaseLog(task)) {
    const match = /^(\d+) merged into /.exec(entry.text);
    if (match) merged.add(canonicalNumber(match[1]));
  }
  return merged;
}

/* The columns a lane runs. The first four are the board's own stages, named
   by the server that names them everywhere else. The last one is the
   phase's own and it is deliberately not done/: a member merged into the
   phase branch is finished as far as the phase is concerned, and is not in
   main yet — main waits on the phase's own PR, at the end, for a person.
   So the column is named for what it actually holds. */
function laneColumns() {
  const stages = ((S.state.board || {}).stages || []).filter(s => s.slug !== 'done');
  return [...stages.map(s => ({ slug: s.slug, label: s.label, tint: STAGE_TINT[s.slug] })),
          { slug: 'merged', label: 'Merged in', tint: 'var(--calm)',
            note: 'on the phase branch' }];
}

/* Where one member is drawn: the stage it is actually in, unless the phase
   branch already holds it — then it is in the lane's last column whatever
   its card says, because within the phase that work has landed. A card in
   done/ is finished by any reading. */
function laneColumnOf(task, merged) {
  if (task.number && merged.has(canonicalNumber(task.number))) return 'merged';
  return task.stage === 'done' ? 'merged' : task.stage;
}

/* Every card the phase lists, in run order, each with the column it is
   drawn in. The card itself is the whole of what is known about it — this
   only says where in the lane it goes. A listed number that resolves to no
   card is not here: the phase card wears `phase drift` for that, as it
   already did. */
function laneMembers(task) {
  const merged = mergedIn(task);
  const members = [];
  (task.members || []).forEach((listed, index) => {
    const card = findTask(listed.file);
    if (!card) return;
    members.push({ pos: index + 1, task: card, column: laneColumnOf(card, merged) });
  });
  return members;
}

/* What the head says it has got through, counted off the same placement
   the columns draw by — so the head and the last column can never
   disagree about how far the phase has got. */
function laneProgress(members) {
  return { done: members.filter(m => m.column === 'merged').length,
           total: members.length };
}

function laneLog(task) {
  const entries = phaseLog(task);
  const lines = entries.map(entry =>
    `<div class="pline${/^halted\b/.test(entry.text) ? ' bad' : ''}">` +
    `<span class="stamp">${esc(entry.at)}</span>` +
    `<span class="what">${esc(entry.text)}</span></div>`).join('');
  return `<div class="plog"><div class="phead">Phase log` +
    `<span class="mono">${entries.length ? entries.length + ' in the order they were made'
                                         : 'nothing yet'}</span></div>` +
    (entries.length
      ? `<div class="plines" data-phase="${esc(task.file)}">${lines}</div>`
      : `<div class="pempty">The runner writes a line here for every decision it makes — ` +
        `a run started, a card started, a card merged, a halt.</div>`) +
    `</div>`;
}

function laneFor(task) {
  const el = document.createElement('section');
  const snap = (S.state.phases || {})[task.file];
  const members = laneMembers(task);
  const at = laneProgress(members);
  const halted = !!(snap && snap.halted);
  const running = !!(snap && snap.running);
  el.className = 'lane' + (halted ? ' halted' : running ? ' running' : '');
  el.dataset.phase = task.file;

  const branch = (snap && snap.branch) || 'phase/' + task.file.replace(/\.md$/, '');
  // the branch is only claimed to be missing when the runner has just
  // looked; without a pass to read, the name is offered without a verdict
  const uncut = !!(snap && !snap.started);
  const flight = phaseFlight(task);
  const head =
    `<div class="lhead">` +
    `<span class="mark${running ? ' breathing' : ''}" style="background:${
      halted ? 'var(--alarm)' : running ? 'var(--accent)' : STAGE_TINT[task.stage]}"></span>` +
    (task.number ? `<span class="lref">#${esc(task.number)}</span>` : '') +
    `<button class="ltitle" data-open="1" title="Open the phase card — its text, ` +
      `its list and its PR">${esc(task.title)}</button>` +
    `<span class="lprog">${at.total ? `${at.done} of ${at.total} merged`
                                    : 'no cards listed'} · ${esc(task.stage)}</span>` +
    `<button class="chip2" data-open="1" title="Open the phase card">card<span class="g2">↗</span></button>` +
    `<span class="chip2${uncut ? ' dim' : ''}" title="${uncut
      ? 'The phase branch has not been cut yet — running the phase cuts it from the newest main'
      : "The phase's integration branch: every member is branched from its tip and merged back into it"
      }">${esc(branch)}</span>` +
    `<span class="lacts"></span></div>`;

  // the card the phase stopped on, named rather than left as a number
  const stoppedOn = halted && snap.haltedAt
    ? members.find(m => m.task.number &&
        canonicalNumber(m.task.number) === canonicalNumber(snap.haltedAt))
    : null;
  const halt = halted
    ? `<div class="lhalt"><span class="lglyph">✕</span><span class="lwhy">` +
      `<b>halted${snap.haltedAt ? ` at #${esc(snap.haltedAt)}` : ''}</b>` +
      `${stoppedOn ? ' · ' + esc(stoppedOn.task.title) : ''} — ` +
      `${esc(snap.haltedWhy || snap.halted)}</span>` +
      `<span class="lacts"></span></div>`
    : '';
  // a run in flight, in the same well the cards use for the same fact
  const well = !halted && flight
    ? `<div class="well"><span class="lead">·</span><span class="wbody">${esc(flight.line)}` +
      `${flight.idle ? '' : '<span class="caret">▌</span>'}</span></div>`
    : '';

  // What accepting *this* phase requires, which the lane owes a reader
  // for the same reason the halt is drawn at the top of it: every member
  // merged and green says nothing about the commit they were merged
  // into, and the one place that distinction can be learned before
  // somebody drags the card to done/ is here. Drawn only where a gate is
  // configured, and `ungated` is never drawn as a pass.
  const gate = snap && snap.gate && snap.gate.gated ? snap.gate : null;
  const gateLine = gate
    ? `<div class="lhalt"${gate.decision === 'blocked'
        ? '' : ' style="border-color:var(--line)"'}>` +
      `<span class="lglyph">${gateState(gate.decision)[1]}</span>` +
      `<span class="lwhy"><b>integration gate ${esc(gateState(gate.decision)[2])}` +
      `</b> — ${esc(gate.summary)}</span><span class="lacts"></span></div>`
    : '';

  el.innerHTML = head + halt + gateLine + well +
    `<div class="lstages" data-phase="${esc(task.file)}"></div>` + laneLog(task);

  const stages = el.querySelector('.lstages');
  for (const col of laneColumns()) {
    const here = members.filter(m => m.column === col.slug);
    const box = document.createElement('div');
    box.className = 'lcol';
    box.innerHTML = `<h3><span class="tickmark" style="background:${col.tint}"></span>` +
      `<span>${esc(col.label)}</span><span class="count">${here.length}</span>` +
      `<span class="note">${esc(col.note || '')}</span></h3>`;
    const cards = document.createElement('div');
    cards.className = 'lcards';
    if (!here.length) cards.innerHTML = '<div class="empty">—</div>';
    // the cards are the cards: same builder, same actions, same chips —
    // including the ⟶ chip that says where each one sits in the run
    for (const m of here) cards.appendChild(cardFor(m.task));
    box.appendChild(cards);
    stages.appendChild(box);
  }

  el.querySelectorAll('[data-open]').forEach(btn =>
    btn.addEventListener('click', () => showDetail(task)));

  // ▸ run again lives here and nowhere else: clearing a halt should mean
  // having read what caused it, and the reason is the line above it
  if (halted) {
    laneAction(el.querySelector('.lhalt .lacts'), task,
      { glyph: '▸', label: 'run again', confirm: 'run it again?', busy: 'starting…',
        title: 'Clear the halt and carry on from where it stopped — every card already '
             + 'merged into the phase branch stays merged',
        run: () => runPhase(task) });
  }
  // ‖ hold means here what it means everywhere: the run stops, the member
  // agent in flight stops with it, and nothing is unwound
  if (running || halted) {
    laneAction(el.querySelector('.lhead .lacts'), task,
      { glyph: '‖', label: 'hold', confirm: 'hold it?', busy: 'holding…',
        title: 'Stop the phase and the agent it has in flight — the phase branch, every '
             + 'card already merged into it and every worktree stay exactly as they are',
        run: () => holdPhase(task) });
  }
  return el;
}

/* A phase's controls are card actions in every way that matters, so they
   go through the one arm-then-fire machine, keyed like every other. */
function laneAction(slot, task, act) {
  if (!slot) return;
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="g">${act.glyph}</span>${actLabel(act.label, act.confirm, act.busy)}`;
  btn.title = act.title;
  wireAction(btn, `${task.file}::${act.label}`, act);
  slot.appendChild(btn);
}

function renderLanes() {
  const view = $('#view-phases'), wrap = $('#lanes');
  // where you were looking, taken before the wipe throws the nodes away:
  // the page scrolls down, each lane's stages scroll sideways, each log
  // scrolls in its own box
  markScroll('v:phases', view);
  wrap.querySelectorAll('.lstages').forEach(el =>
    markScroll('v:lanestages:' + el.dataset.phase, el));
  wrap.querySelectorAll('.plines').forEach(el =>
    markScroll('v:phaselog:' + el.dataset.phase, el));
  wrap.innerHTML = '';
  const phases = lanePhases();
  if (!phases.length) {
    // an empty grid of five columns would be a room pretending to be full
    wrap.innerHTML = '<div class="empty">No phases yet. A phase is an ordinary card ' +
      'marked <b>Type: Phase</b> with a <code>## Cards</code> section listing the cards ' +
      'it runs, in the order they run.</div>';
  } else {
    for (const task of phases) wrap.appendChild(laneFor(task));
  }
  restoreScroll('v:phases', view);
  wrap.querySelectorAll('.lstages').forEach(el =>
    restoreScroll('v:lanestages:' + el.dataset.phase, el));
  wrap.querySelectorAll('.plines').forEach(el => {
    // a log you have not touched opens on its newest line, which is the one
    // that says where the phase is; once you have scrolled it, that is where
    // it stays through every redraw
    const key = 'v:phaselog:' + el.dataset.phase;
    if (scrollMarks[key]) restoreScroll(key, el);
    else el.scrollTop = el.scrollHeight;
  });
  if (S.selected) {
    S.selected = allTasks().find(t => t.file === S.selected.file) || null;
  }
  renderDrawer();
}

/* ── sessions ─────────────────────────────────────────────────────────── */

function pickFlightSid() {
  if (S.flightSid && sessionMeta(S.flightSid)) return S.flightSid;
  const live = sessionsOf(isLiveSession);
  const agentLive = live.find(m => m.agentId);
  S.flightSid = (agentLive || live[0] || (S.state.sessions || [])[0] || {}).id || null;
  return S.flightSid;
}

function renderFlight() {
  const sid = pickFlightSid();
  if (sid) loadSession(sid);

  const rows = (S.state.sessions || []).map(m => {
    const active = isLiveSession(m) && m.status === 'active';
    return `<div class="sess-row${m.id === sid ? ' sel' : ''}" data-sid="${esc(m.id)}" role="button" tabindex="0">` +
      `<span class="top"><span class="dot${active ? ' live' : ''}"></span>` +
      `<span>${esc((m.label || m.id.slice(0, 8)).split(' · ')[0])}</span>` +
      `<span class="sid">${esc(m.id.slice(0, 8))}</span>${modelChip(agentFor(m.id))}</span>` +
      `<span class="sub">${m.task ? 'on ' + esc(m.task) + ' · ' : ''}${m.count || 0} events · ${m.last ? ago(m.last) + ' ago' : ''}</span>` +
      (m.lastSummary ? `<span class="sub">${esc(m.lastSummary)}</span>` : '') +
      `</div>`;
  }).join('');
  const rail = $('#frail');
  markScroll('v:rail', rail);
  rail.innerHTML = `<div class="label">Sessions</div>` +
    (rows || '<div class="f-empty">None yet. Start an agent, or open a claude session in this repo.</div>');
  restoreScroll('v:rail', rail);
  document.querySelectorAll('#frail .sess-row').forEach(el =>
    el.addEventListener('click', () => { S.flightSid = el.dataset.sid; render(); }));

  const meta = sessionMeta(sid);
  if (!meta) {
    $('#fsession').innerHTML = '<span style="color:var(--dim)">no session selected</span>';
    $('#ffilters').innerHTML = '';
    $('#ftl').innerHTML = '';
    return;
  }
  const events = S.events[sid] || [];
  const files = new Set(events.filter(e => e.file && e.kind === 'edit').map(e => e.file));
  const checks = events.filter(e => e.kind === 'test' || e.kind === 'check').length;
  const agent = agentFor(sid);
  const stopBtn = agent && agent.status === 'running'
    ? `<button id="stopagent" class="stopbtn" data-aid="${esc(agent.id)}">Hold</button>` : '';
  const branch = agent && agent.branch ? ` · <span class="mono">${esc(agent.branch)}</span>` : '';
  // Honesty about what the run actually rode. A known model is the chip's
  // job now, beside the name; the line keeps only what the chip cannot
  // say — that this launch inherited the vendor default. Interactive
  // sessions say nothing.
  const model = agent && !agent.model ? ` · <span class="mono">model inherited</span>` : '';
  $('#fsession').innerHTML =
    `<div><div class="s-title">${esc((meta.label || sid).split(' · ')[0])}` +
    `<span class="sid">${esc(sid.slice(0, 8))}</span>${modelChip(agent)}</div>` +
    `<div class="s-line">${meta.task ? 'on ' + esc(meta.task) + ' · ' : ''}` +
    `started ${fmtShort(meta.started)} · ${meta.count || 0} events · ` +
    `${files.size} files edited · ${checks} check runs${branch}${model}</div></div>` +
    stopBtn + spark(events, meta);
  const stop = $('#stopagent');
  if (stop) stop.addEventListener('click', () => stopAgent(stop.dataset.aid));

  $('#ffilters').innerHTML = FILTERS.map(([key, label]) =>
    `<button class="${S.filter === key ? 'on' : ''}" data-f="${key}">${label}</button>`).join('');
  document.querySelectorAll('#ffilters button').forEach(el =>
    el.addEventListener('click', () => { S.filter = el.dataset.f; render(); }));

  renderTimeline(sid, meta, events);
}

async function stopAgent(aid) {
  const res = await fetch('/api/agent/stop', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: aid }),
  });
  const data = await res.json();
  toast(res.ok ? 'Held — nothing is lost' : (data.error || 'could not stop it'), !res.ok);
  await loadState();
  return res.ok;
}

function spark(events, meta) {
  if (!events.length) return '';
  const start = meta.started || events[0].ts;
  const end = Math.max(meta.last || 0, events[events.length - 1].ts, start + 60);
  const n = 34, span = (end - start) / n;
  const buckets = new Array(n).fill(0);
  for (const ev of events) {
    const i = Math.min(n - 1, Math.max(0, Math.floor((ev.ts - start) / span)));
    buckets[i]++;
  }
  const max = Math.max(...buckets, 1);
  const live = isLiveSession(meta);
  const bars = buckets.map((b, i) =>
    `<i${live && i >= n - 3 ? ' class="now"' : ''} style="height:${Math.max(4, Math.round(b / max * 30))}px"></i>`).join('');
  return `<div class="spark" title="events over the session">${bars}</div>`;
}

function renderTimeline(sid, meta, events) {
  const active = FILTERS.find(([key]) => key === S.filter);
  const kinds = active ? active[2] : null;
  const boardEvents = (S.state.boardEvents || [])
    .filter(be => be.file && be.file === meta.task)
    .map(be => ({ ...be, _board: true }));
  let items = events.filter(ev => !kinds || kinds.has(ev.kind));
  if (!kinds || kinds.has('move')) items = items.concat(boardEvents);
  // the run's own progress updates, interleaved by the time it made them
  // and labelled as its own — fetched with the session's agent
  const agent = agentFor(sid);
  if (agent && (!kinds || kinds.has('progress'))) {
    fetchProgress(agent.id);
    const p = progressOf(agent.id, meta.task);
    for (const h of (p && p.history) || []) {
      const said = [h.stage, h.doing || h.narrative].filter(Boolean).join(' — ') ||
                   (h.done || []).join('; ');
      const detail = [
        h.done && h.done.length ? 'Done:\n' + h.done.map(d => '  ✓ ' + d).join('\n') : '',
        h.remaining && h.remaining.length ? 'Remaining:\n' + h.remaining.map(d => '  ○ ' + d).join('\n') : '',
        h.blocked ? 'Blocked: ' + h.blocked : '',
        h.narrative && h.doing ? h.narrative : '',
      ].filter(Boolean).join('\n\n');
      items.push({ kind: 'progress', ts: h.at, _key: 'p' + h.id,
                   summary: 'agent-reported · ' + said, detail: detail || undefined,
                   ok: h.blocked ? false : null });
    }
  }
  items.sort((a, b) => (a.ts || 0) - (b.ts || 0));

  // collapse runs of consecutive reads/searches into one foldable row
  const grouped = [];
  for (const ev of items) {
    const prev = grouped[grouped.length - 1];
    if ((ev.kind === 'read' || ev.kind === 'search') && prev && prev._group) {
      prev.events.push(ev); prev.ts = ev.ts; continue;
    }
    if (ev.kind === 'read' || ev.kind === 'search') {
      grouped.push({ _group: true, ts: ev.ts, first: ev.ts, events: [ev] });
    } else grouped.push(ev);
  }

  const run = S.running[sid];
  const out = [];
  if (run) out.push(tlRow({ ...run, _key: 'running' }, 'run', true));
  for (let i = grouped.length - 1; i >= 0; i--) {
    const item = grouped[i];
    if (item._group) {
      if (item.events.length === 1) out.push(tlRow(item.events[0]));
      else {
        const key = `g${item.first}`;
        const list = item.events.map(e => e.file || e.summary.replace(/^searched /, '⌕ ')).join('\n');
        out.push(`<div class="tl-row"><time>${fmtClock(item.first)}</time>` +
          `<span class="glyph">${GLYPHS.read}</span><div class="tbody">` +
          `<div class="text">read and searched ${item.events.length} places</div>` +
          fold(key, 'show them', list) + `</div></div>`);
      }
    } else out.push(tlRow(item));
  }
  // keyed by session, so reading back through a long run survives the
  // events it is still producing — and picking a different session, being
  // a different key, opens at the top
  const tl = $('#ftl');
  markScroll('v:tl:' + sid, tl);
  tl.innerHTML = out.join('') ||
    '<div class="f-empty">Nothing matches this filter.</div>';
  restoreScroll('v:tl:' + sid, tl);
  document.querySelectorAll('#ftl details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open) S.openFolds.add(d.dataset.key); else S.openFolds.delete(d.dataset.key);
    });
  });
}

function fold(key, label, body) {
  const open = S.openFolds.has(key) ? ' open' : '';
  return `<details class="fold" data-key="${esc(key)}"${open}><summary>${esc(label)}</summary><pre>${esc(body)}</pre></details>`;
}

function tlRow(ev, forceCls, caret) {
  const cls = forceCls || (ev._board ? 'move' : ev.ok === false ? 'bad' : ev.ok === true ? 'ok' : '');
  const glyph = GLYPHS[ev.kind] || '·';
  const key = ev._key || `e${ev.ts}`;
  let text = esc(ev.summary);
  if (ev.kind === 'move') {
    text = `<strong>${esc(ev.file)}</strong> ${esc(ev.from)} <span class="arrow">→</span> ${esc(ev.to)}` +
      ` <span class="actor">· ${esc(ev.actor)}</span>`;
  }
  if (caret) text += '<span class="caret">▌</span>';
  let extra = '';
  if (ev.detail) extra = fold(key, ev.kind === 'plan' ? 'plan steps' : ev.kind === 'report' ? 'the report'
    : ev.kind === 'progress' ? 'the whole update' : 'output', ev.detail);
  else if (ev.cmd && ev.cmd.length > 90) extra = `<div class="text mono" style="font-size:11.5px;color:var(--dim)">${esc(ev.cmd)}</div>`;
  return `<div class="tl-row ${cls}"><time>${fmtClock(ev.ts)}</time>` +
    `<span class="glyph">${glyph}</span>` +
    `<div class="tbody"><div class="text">${text}</div>${extra}</div></div>`;
}

/* ── focus ────────────────────────────────────────────────────────────── */

function pickFocusSid() {
  if (S.focusSid && sessionMeta(S.focusSid)) return S.focusSid;
  const live = sessionsOf(isLiveSession);
  const agentLive = live.find(m => m.agentId);
  S.focusSid = (agentLive || live[0] || (S.state.sessions || [])[0] || {}).id || null;
  return S.focusSid;
}

/* The run's own policy, in the Focus view's side column.

   It is the *frozen* one, read back off the board rather than resolved
   again, and the panel says so when the settings have since moved — "this
   run rode that; the document now says this" is a distinction a reviewer
   needs and a second settings parser would quietly lose. The technical
   half (identities, hashes, precedence) folds, as it does in the sheet.

   A session with no agent behind it — a person's own — has no policy to
   show, because bench granted it nothing: the panel says that rather than
   drawing empty rows. */
function permissionsPanel(agent) {
  const head = (right) =>
    `<div class="panel"><div class="phead"><span class="label">Permissions & inputs</span>` +
    `<span class="r">${right}</span></div>`;
  if (!agent) {
    return head('—') +
      `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">your own session</span>` +
      `<span class="state">bench granted it nothing</span></div></div>`;
  }
  const cached = S.manifests[agent.id];
  const found = cached && cached.manifest;
  if (!found) {
    const summary = agent.profile;
    return head(esc(agent.mode || 'work')) +
      `<div class="check-row none"><span class="glyph">·</span>` +
      `<span class="name">${summary ? esc(summary.policyId) : 'reading the manifest'}</span>` +
      `<span class="state">${summary
        ? esc(`${summary.commands} grants · ${summary.readable}/${summary.inputs} inputs`)
        : 'loading'}</span></div></div>`;
  }
  const fresh = cached.freshness || { fresh: true, changed: [] };
  const moved = !fresh.fresh
    ? `<div class="check-row none"><span class="glyph">·</span>` +
      `<span class="name">settings have moved</span>` +
      `<span class="state">this run keeps what it rode</span></div>`
    : '';
  const pub = found.publication || {};
  const may = ['commit', 'push', 'publish'].filter(k => pub[k]);
  return head(esc(`${found.intent} · ${found.cwd.policy}`)) +
    reviewRows(found) +
    grantRows(found) +
    inputRows(found) +
    `<div class="check-row"><span class="glyph">↑</span>` +
    `<span class="name">may</span>` +
    `<span class="state">${esc(may.join(', ') || 'change nothing')}</span></div>` +
    `<div class="check-row ${isolated(found) ? 'pass' : 'none'}"><span class="glyph">·</span>` +
    `<span class="name">writes</span>` +
    `<span class="state">${esc(((found.writable || []).map(w => w.root).join(', ')
      || 'none') + ' intended · OS isolation: ' + isolationLine(found))}</span></div>` +
    `<div class="check-row fail"><span class="glyph">✕</span>` +
    `<span class="name">blocked</span>` +
    `<span class="state">${esc((found.denied || []).map(d => d.capability).join(', ') || 'nothing named')}</span></div>` +
    moved +
    `<details class="fold"><summary>what is actually enforced, and by whom</summary>` +
    `<pre>${esc(guaranteeLines(found).join('\n\n'))}</pre></details>` +
    `<details class="fold"><summary>this run's frozen revisions</summary>` +
    `<pre>${esc(profileDetail(found) +
      (fresh.changed || []).map(c => `\nsince:      ${c}`).join(''))}</pre></details>` +
    `</div>`;
}

/* Where a PR review ran, read off the same frozen manifest as the rest of
   this panel: the revision it was pinned to and the checkout bench owned
   for it. Nothing at all for every other kind — a work run has its card's
   own worktree and a relevance check is pinned nothing, and inventing a
   row for them would suggest a location neither has. */
function reviewRows(found) {
  const r = found.review;
  if (!r) return '';
  const head = (r.head || {}).commit || '';
  const base = (r.base || {}).ref || 'unknown';
  return `<div class="check-row"><span class="glyph">⌾</span>` +
    `<span class="name">reviewing</span>` +
    `<span class="state">${esc(head.slice(0, 12) || 'unknown')} → ${esc(base)}` +
    `${r.historical ? ' · historical' : ''}</span></div>` +
    `<div class="check-row"><span class="glyph">·</span>` +
    `<span class="name">pinned checkout</span>` +
    `<span class="state">${esc(r.path || '—')}</span></div>`;
}

function renderFocus() {
  const sid = pickFocusSid();
  if (sid) loadSession(sid);
  const meta = sessionMeta(sid);

  // the view itself scrolls, and so does the stage strip across the top
  const view = $('#view-focus'), strip = $('#cstrip');
  markScroll('v:focus', view);
  markScroll('v:cstrip', strip);
  const putBack = () => { restoreScroll('v:focus', view); restoreScroll('v:cstrip', strip); };

  const options = (S.state.sessions || []).map(m =>
    `<option value="${esc(m.id)}"${m.id === sid ? ' selected' : ''}>${esc(m.label || m.id.slice(0, 8))}${m.task ? ' — ' + esc(m.task) : ''}</option>`).join('');
  $('#focussel').innerHTML = options || '<option>no sessions yet</option>';

  const hot = meta && meta.task ? findTask(meta.task)?.stage : 'in-progress';
  $('#cstrip').innerHTML = S.state.board.stages.map(s =>
    `<div class="c-seg${s.slug === hot ? ' hot' : ''}"><span class="lbl">${s.label}</span><span class="n">${s.tasks.length}</span></div>`).join('');

  if (!meta) {
    $('#cgrid').innerHTML = `<div class="panel"><div class="phead"><span class="dot"></span>` +
      `<span class="label">Right now</span></div>` +
      `<p style="margin:0;color:var(--dim);font-size:12.5px">Nothing yet. Start an agent from a card, ` +
      `or open a claude session in this repo — it shows up here as it works.</p></div>`;
    $('#calso').innerHTML = '';
    putBack();
    return;
  }

  const events = S.events[sid] || [];
  const agent = agentFor(sid);
  const task = meta.task ? findTask(meta.task) : null;
  const run = S.running[sid];
  const live = isLiveSession(meta) && meta.status === 'active';

  const last = run || events[events.length - 1];
  const wellCls = last && last.ok === false ? ' bad' : '';
  const caret = (run || live) ? '<span class="caret">▌</span>' : '';
  let act;
  if (last && last.detail) {
    // › only when clicking does something: the well is the summary of a
    // fold, keyed into S.openFolds so it survives the SSE re-renders
    const wkey = `w${last.ts}`;
    act = `<details class="fold wellfold" data-key="${esc(wkey)}"${S.openFolds.has(wkey) ? ' open' : ''}>` +
      `<summary><div class="well${wellCls}"><span class="lead">›</span>` +
      `<span class="wbody">${esc(last.summary)}${caret}</span></div></summary>` +
      `<pre>${esc(last.detail)}</pre></details>`;
  } else if (last) {
    act = `<div class="well${wellCls}"><span class="lead">·</span><span class="wbody">${esc(last.summary)}${caret}</span></div>`;
  } else {
    act = '<div class="well"><span class="lead">·</span><span class="wbody">no activity yet</span></div>';
  }

  const plan = [...events].reverse().find(e => e.kind === 'plan' && e.detail);
  let steps = '';
  if (plan) {
    const lines = plan.detail.split('\n').filter(Boolean);
    steps = '<div class="steps">' + lines.map(l => {
      const cls = l.startsWith('[x]') ? 'done' : l.startsWith('[>]') ? 'doing' : 'todo';
      const glyph = cls === 'done' ? '✓' : cls === 'doing' ? '›' : '○';
      return `<div class="step ${cls}"><span class="glyph">${glyph}</span><span class="stext">${esc(l.replace(/^\[.\]\s*/, ''))}</span></div>`;
    }).join('') + '</div>';
  }

  const stopBtn = agent && agent.status === 'running'
    ? `<button id="cstop" class="stopbtn" data-aid="${esc(agent.id)}">Hold</button>` : '';
  const refBits = [];
  if (task) {
    refBits.push(task.number ? '#' + esc(task.number) : esc(task.file));
    refBits.push(`<span class="acc">${esc((meta.label || '').split(' · ')[0])}</span>` +
                 modelChip(agent));
    if (agent && agent.branch) refBits.push('worktree ' + esc(agent.branch));
    // the chip says which model; the line is left saying only what it can't
    if (agent && !agent.model) refBits.push('model inherited');
    refBits.push(esc(task.stage) + '/' + esc(task.file));
  } else {
    refBits.push(esc(sid.slice(0, 8)), 'no task attached');
  }

  const nowPanel =
    `<div class="panel"><div class="phead">` +
    `<span class="dot${live ? ' live' : ''}"></span><span class="label">Right now</span>` +
    `<span class="r" id="celapsed">${sessionElapsed(meta)} on this</span>${stopBtn}</div>` +
    `<div class="refline">${refBits.join('<span>·</span>')}</div>` +
    `<h1 class="focus-title">${esc(task ? task.title : 'Session')}</h1>` +
    progressSection(agent, meta, task) +
    steps + act + `</div>`;

  const rev = [...events].reverse();
  const checkRow = (name, ev) => {
    if (!ev) return `<div class="check-row none"><span class="glyph">—</span><span class="name">${esc(name)}</span><span class="state">not run</span></div>`;
    const cls = ev.ok === false ? 'fail' : ev.ok === true ? 'pass' : 'none';
    const glyph = ev.ok === false ? '✕' : ev.ok === true ? '✓' : '·';
    const text = ev.summary.startsWith(name + ' — ')
      ? ev.summary.slice(name.length + 3) : ev.summary.replace(/^ran: /, '');
    const state = esc(text) + ' · ' + fmtShort(ev.ts);
    return `<div class="check-row ${cls}"><span class="glyph">${glyph}</span><span class="name">${esc(name)}</span><span class="state">${state}</span></div>`;
  };
  // One row per project-defined check — labels and command patterns come
  // from the served checks definition (local/checks over core/checks),
  // the same file the adapter classifies against.
  const checkRows = (S.state?.checks || []).map(c => {
    let re = null;
    try { re = new RegExp(c.pattern); } catch { /* skip unparseable */ }
    const ev = re && rev.find(e => !e.running && e.cmd && re.test(e.cmd));
    return checkRow(c.label, ev);
  }).join('');
  const checksPanel = `<div class="panel"><div class="phead"><span class="label">Checks</span></div>` +
    (checkRows || `<div class="check-row none"><span class="glyph">—</span><span class="name">no checks defined</span><span class="state"></span></div>`) +
    `</div>`;

  let fileRows = '', fileHead = '';
  const diff = agent && S.diffCache[agent.id];
  if (agent) fetchDiff(agent.id);
  if (diff && diff.files && diff.files.length) {
    const tp = diff.files.reduce((n, f) => n + f.plus, 0);
    const tm = diff.files.reduce((n, f) => n + f.minus, 0);
    fileHead = `<span class="r">+${tp} −${tm}</span>`;
    fileRows = diff.files.slice(0, 12).map(f =>
      `<div class="file-row"><span class="fpath">&lrm;${esc(f.file)}&lrm;</span>` +
      `<span class="add">+${f.plus}</span><span class="del">−${f.minus}</span></div>`).join('');
    if (diff.files.length > 12) fileRows += `<div class="file-row" style="color:var(--dim);font-size:11.5px">… ${diff.files.length - 12} more</div>`;
  } else {
    const counts = {};
    for (const ev of events) if (ev.kind === 'edit' && ev.file) counts[ev.file] = (counts[ev.file] || 0) + 1;
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    fileRows = entries.slice(0, 12).map(([f, n]) =>
      `<div class="file-row"><span class="fpath">&lrm;${esc(f)}&lrm;</span>` +
      `<span class="add" style="color:var(--dim)">${n} edit${n > 1 ? 's' : ''}</span></div>`).join('')
      || '<div class="file-row" style="color:var(--dim);font-size:12px">nothing edited yet</div>';
  }
  const filesPanel = `<div class="panel"><div class="phead"><span class="label">Files it has touched</span>${fileHead}</div><div>${fileRows}</div></div>`;

  const recent = events.slice(-6).reverse().map(evRow).join('');
  const recentPanel = `<div class="panel"><div class="phead"><span class="label">Recent</span></div>` +
    `<div class="minifeed">${recent || '<span style="color:var(--dim);font-size:12px">nothing yet</span>'}</div></div>`;

  // What this run was allowed to do, frozen at its launch. The CHECKS panel
  // above says what the project's definition of done is; this one says
  // whether the run could even have run it, which file inputs it was
  // guaranteed, and where it could write.
  if (agent) fetchManifest(agent.id);
  const permsPanel = permissionsPanel(agent);

  // And what bench itself ran, which is a different fact again. CHECKS
  // above is classified from commands the *agent* ran — the run's own
  // account of itself. This panel is the runner's: every row is a
  // process this board launched and waited on, with preparation drawn
  // apart from the check it prepared. A finished agent with nothing
  // here reads `not run`, never `passed`.
  if (task) fetchEvidence(task.file, task.stage);
  const verifyPanel = verificationPanel(task, agent);

  // And the fact those two leave open, which is the one a person about
  // to merge actually wants: code produced is not work verified, and
  // work verified is not work accepted. Read from the state payload the
  // view already has, so drawing it costs nothing and runs nothing.
  const gatePanelHere = focusGatePanel(task, agent);

  // And the fourth fact, which is about the board rather than the run:
  // would a launch of this kind even start here, and what is not proved
  // about that. Read lazily and never on a timer — resolving every intent
  // is cheap but not free, and a reading is only ever shown as saying
  // what it said when it was taken.
  fetchReadiness();
  const readyPanel = S.doctor?.report
    ? readinessPanel(S.doctor.report, {
        intent: agent ? (agent.mode || 'work') : null,
        title: 'Configuration check' })
    : `<div class="panel"><div class="phead"><span class="label">Configuration check</span>` +
      `<span class="r">—</span></div>` +
      `<div class="check-row none"><span class="glyph">·</span>` +
      `<span class="name">checking the configuration</span>` +
      `<span class="state">not checked yet` +
      `</span></div></div>`;

  $('#cgrid').innerHTML = nowPanel +
    `<div class="c-side">${checksPanel}${verifyPanel}${gatePanelHere}` +
    `${permsPanel}${readyPanel}${filesPanel}${recentPanel}</div>`;
  document.querySelectorAll('#cgrid details.fold').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open) S.openFolds.add(d.dataset.key); else S.openFolds.delete(d.dataset.key);
    });
  });
  const cstop = $('#cstop');
  if (cstop) cstop.addEventListener('click', () => stopAgent(cstop.dataset.aid));

  const others = allTasks().filter(t =>
    ['in-progress', 'review'].includes(t.stage) && (!task || t.file !== task.file));
  $('#calso').innerHTML = others.map(t => {
    const pill = pillFor(t.stage, !!agentOnTask(t.file));
    return `<div class="card"><div class="toprow">` +
      `<span class="ref">${t.number ? '#' + esc(t.number) : ''}</span><span class="spacer"></span>` +
      `<span class="pill" style="background:${pill.bg};color:${pill.tint}">${pill.text}</span></div>` +
      `<div class="title">${esc(t.title)}</div></div>`;
  }).join('');
  putBack();
}

function findTask(file) { return allTasks().find(t => t.file === file) || null; }

/* ── agent-reported progress (task 73) ─────────────────────────────────

   What a run *said* about its work, kept apart from three other facts it
   is easy to confuse with: when its last tool event arrived, whether its
   process is still running, and what bench itself verified. Each is drawn
   with its own clock and its own words; silence is never filled in, and
   no percentage is computed from anything. */

// A progress update older than this, while tool events keep arriving, is
// "no recent progress update" — said as exactly that, never as "stuck".
const PROGRESS_QUIET = 600;

/* One run's progress: the compact reading the state payload carries for
   the card's most recent run, or the whole timeline once fetched. */
function progressOf(agentId, file) {
  if (!agentId) return null;
  const full = S.progressFull[agentId];
  if (full && full.data) return full.data;
  const onCard = file && (S.state?.progress || {})[file];
  return onCard && onCard.agent === agentId ? onCard : null;
}

async function fetchProgress(agentId) {
  if (!agentId) return;
  const cached = S.progressFull[agentId];
  if (cached && (cached.fetching || Date.now() - cached.at < 8000)) return;
  S.progressFull[agentId] = { ...(cached || {}), fetching: true };
  try {
    const res = await fetch('/api/progress?agent=' + encodeURIComponent(agentId));
    const data = res.ok ? (await res.json()).progress : null;
    S.progressFull[agentId] = { at: Date.now(), data };
    if (S.view === 'focus' || S.view === 'flight') scheduleRender();
  } catch {
    S.progressFull[agentId] = { at: Date.now(), data: cached ? cached.data : null };
  }
}

// The process state in words, from the board's own launch record — a
// different fact from anything the run reported.
const PROCESS_WORDS = { running: 'running', done: 'finished', failed: 'failed',
                        stopped: 'held', declined: 'declined' };
const ENDED_WORDS = { finished: 'finished', failed: 'failed', declined: 'declined',
                      held: 'was held', unobserved: 'ended unobserved — the board restarted' };

function processWord(agent, p) {
  if (agent && agent.status && !agent.replayed) return PROCESS_WORDS[agent.status] || agent.status;
  if (p && !p.active) return ENDED_WORDS[p.outcome] || 'ended';
  return 'not known to this board';
}

/* The one honest sentence about this run's reporting, from what is known
   and nothing else. `tool` is the time of the newest tool event. */
function progressSentence(p, agent, tool) {
  const now = Date.now() / 1000;
  if (!p) return { text: 'No progress was recorded for this run — it predates progress reporting, or another board launched it.' };
  if ((p.channel || {}).state !== 'available') {
    return { text: `Reporting unavailable: ${p.channel?.why || 'this run was given no progress channel'}. Its tool activity is all the board can show.` };
  }
  if (!p.active) {
    return { text: `The run ${ENDED_WORDS[p.outcome] || 'ended'} ${p.closed ? ago(p.closed) + ' ago' : ''}. ` +
      (p.current ? 'Its last update is history now, not what it is doing.' : 'It sent no progress update.') };
  }
  const toolRecent = tool && now - tool < PROGRESS_QUIET;
  if (!p.current) {
    return { text: toolRecent ? 'No progress update yet; tool activity continues.'
                              : 'No progress update yet.' };
  }
  if (p.current.blocked) return { text: 'The run reports that it is blocked.', warn: true };
  if (now - (p.lastReport || 0) > PROGRESS_QUIET && toolRecent && tool > (p.lastReport || 0)) {
    return { text: `No recent progress update (last ${ago(p.lastReport)} ago); tool activity continues.` };
  }
  return null;
}

/* The face of a card an agent is on: what the run last *said*, labelled as
   said, with its own age. Only while the run is alive and only for this
   run — a new launch never wears its predecessor's "doing now". */
function progressWell(task, agent) {
  if (!agent || agent.status !== 'running') return '';
  const p = (S.state?.progress || {})[task.file];
  if (!p || p.agent !== agent.id || !p.active || (p.channel || {}).state !== 'available') return '';
  const c = p.current;
  if (!c) {
    return `<div class="pwell quiet" aria-label="Progress">No progress update yet</div>`;
  }
  const said = c.doing || c.narrative || (c.remaining || [])[0] || '';
  const label = `Agent-reported progress, ${ago(p.lastReport)} ago`;
  return `<div class="pwell" aria-label="${esc(label)}" title="${esc(label)} — what the run said, not a verified result">` +
    `<div class="ptop"><span class="ptrust">agent-reported · ${esc(ago(p.lastReport))} ago</span>` +
    (c.stage ? `<span class="pstage">${esc(c.stage)}</span>` : '') + `</div>` +
    (said ? `<div>${esc(said.length > 160 ? said.slice(0, 160) + '…' : said)}</div>` : '') +
    (c.blocked ? `<div class="pblock">Blocked: ${esc(c.blocked.length > 160 ? c.blocked.slice(0, 160) + '…' : c.blocked)}</div>` : '') +
    `</div>`;
}

/* A reference the run attached, as the board can actually read it: a
   commit by its sha, or bench's own evidence record as it reads *now* —
   check, scope, commit and freshness from the runner, never from prose. */
function progressRef(ref) {
  if (ref.kind === 'commit') return `<span>commit ${esc(ref.id.slice(0, 12))} <span class="src">(named by the run)</span></span>`;
  if (!ref.found) return `<span class="bad">evidence ${esc(ref.id)} — not found on this board</span>`;
  const cls = ref.outcome === 'passed' ? 'ok' : (['failed', 'error', 'stale', 'prepare-failed', 'denied', 'cancelled'].includes(ref.outcome) ? 'bad' : '');
  const bits = [`${esc(ref.check)}${ref.scope ? ' · scope ' + esc(ref.scope) : ' · full run'}`,
    `<b class="${cls}">${esc(ref.outcome)}</b>`,
    ref.outcome !== ref.recorded ? `recorded ${esc(ref.recorded)}, now ${esc(ref.reason || ref.outcome)}` : '',
    ref.commit ? `at ${esc(ref.commit)}${ref.dirty ? ' + uncommitted' : ''}` : '',
    'recorded by bench'].filter(Boolean);
  return `<span>evidence ${esc(ref.id)}: ${bits.join(' · ')}</span>`;
}

/* The Focus view's progress section: done / doing now / remaining /
   blocked, the narrative, the milestone checklist, three separate clocks,
   the channel's health and the timeline — every claim labelled as the
   run's, every absence said as an absence. */
function progressSection(agent, meta, task) {
  if (!agent) return '';
  fetchProgress(agent.id);
  const p = progressOf(agent.id, task && task.file);
  const events = (meta && S.events[meta.id]) || [];
  const tool = (meta && meta.last) || (events.length ? events[events.length - 1].ts : null);
  const c = p && p.current;
  const ended = p && !p.active;
  const row = (dt, value, cls) =>
    `<dt>${dt}</dt><dd class="${value ? (cls || '') : 'unknown'}">${value || 'not reported'}</dd>`;
  const miles = p && (p.milestones || []).length
    ? `<ul class="miles">${p.milestones.map(m => `<li>${esc(m.text)}</li>`).join('')}</ul>` +
      (p.milestonesOmitted ? `<span class="unknown">and ${Number(p.milestonesOmitted)} later milestone${p.milestonesOmitted === 1 ? '' : 's'} not listed</span>` : '')
    : '';
  const honest = progressSentence(p, agent, tool);
  const clock =
    `<div class="pclock" role="group" aria-label="Three separate clocks">` +
    `<span><b>Last progress update</b> ${p && p.lastReport ? esc(ago(p.lastReport)) + ' ago · ' + fmtShort(p.lastReport) : 'none'}</span>` +
    `<span><b>Last tool activity</b> ${tool ? esc(ago(tool)) + ' ago · ' + fmtShort(tool) : 'none'}</span>` +
    `<span><b>Process</b> ${esc(processWord(agent, p))}</span></div>`;
  let body = '';
  if (p && (p.channel || {}).state === 'available') {
    body = `<dl>` +
      row('Stage', c && esc(c.stage)) +
      `<dt>Done</dt><dd class="${miles ? '' : 'unknown'}">${miles || 'none reported'}</dd>` +
      row(ended ? 'Last said' : 'Doing now', c && esc(c.doing), ended ? 'past' : '') +
      row('Remaining', c && (c.remaining || []).map(esc).join('\n')) +
      `<dt>Blocked</dt><dd class="${c && c.blocked ? 'blocked' : 'unknown'}">${c && c.blocked ? esc(c.blocked) : 'none reported'}</dd>` +
      `</dl>` +
      (c && c.narrative ? `<p class="pnarr">${esc(c.narrative)}</p>` : '');
    const refs = c && (c.refs || []);
    if (refs && refs.length) {
      body += `<div class="prefs" aria-label="References the run attached">${refs.map(progressRef).join('')}</div>`;
    }
  }
  const counts = (p && p.counts) || {};
  const health = p
    ? `Reporting channel: ${esc((p.channel || {}).state || 'unknown')}` +
      ` · ${counts.accepted || 0} update${counts.accepted === 1 ? '' : 's'} received` +
      (counts.coalesced ? ` · ${counts.coalesced} coalesced` : '') +
      (counts.duplicates ? ` · ${counts.duplicates} duplicate${counts.duplicates === 1 ? '' : 's'} ignored` : '') +
      (counts.rejected ? ` · ${counts.rejected} refused (last: ${esc((p.lastRejection || {}).why || '')})` : '')
    : '';
  const history = (p && p.history) || [];
  const verifies = task ? (S.state.boardEvents || []).filter(be =>
    be.kind === 'verify' && be.file === task.file && (!p || be.ts >= (p.opened || 0))) : [];
  const timeline = history.map(h => ({ ts: h.at, html:
      `<span class="src">agent-reported</span><span>${esc([h.stage, h.doing || h.narrative].filter(Boolean).join(' — ') || (h.done || []).join('; '))}` +
      (h.blocked ? ` <b style="color:var(--alarm)">blocked: ${esc(h.blocked)}</b>` : '') +
      (h.coalesced ? ` <span class="src">(${h.coalesced + 1} updates coalesced)</span>` : '') + `</span>` }))
    .concat(verifies.map(be => ({ ts: be.ts, html: `<span class="src">bench</span><span>${esc(be.summary)}</span>` })))
    .sort((a, b) => b.ts - a.ts)
    .map(item => `<div class="pti"><time>${fmtClock(item.ts)}</time>${item.html}</div>`).join('');
  const tkey = `ptl:${agent.id}`;
  const fold = timeline
    ? `<details class="fold" data-key="${esc(tkey)}"${S.openFolds.has(tkey) ? ' open' : ''}>` +
      `<summary>Progress timeline (${history.length} update${history.length === 1 ? '' : 's'}${verifies.length ? `, ${verifies.length} verification event${verifies.length === 1 ? '' : 's'}` : ''})</summary>` +
      `<div class="ptl">${timeline}</div></details>` : '';
  return `<section class="prog" aria-label="Progress">` +
    `<div class="prog-head"><span class="label">Progress</span>` +
    `<span class="ptrust" title="What the run says about its own work. Not verification evidence.">agent-reported</span>` +
    (c ? `<span class="pclock">update ${esc(ago(p.lastReport))} ago</span>` : '') + `</div>` +
    (honest ? `<div class="phonest${honest.warn ? ' warn' : ''}" role="status">${esc(honest.text)}</div>` : '') +
    body + clock +
    (health ? `<div class="pclock">${health}</div>` : '') + fold + `</section>`;
}

async function fetchDiff(agentId) {
  const cached = S.diffCache[agentId];
  if (cached && (cached.fetching || Date.now() - cached.at < 8000)) return;
  S.diffCache[agentId] = { ...(cached || {}), fetching: true };
  try {
    const res = await fetch('/api/diff?agent=' + encodeURIComponent(agentId));
    const data = await res.json();
    S.diffCache[agentId] = { at: Date.now(), files: data.files || [] };
    if (S.view === 'focus') scheduleRender();
  } catch {
    S.diffCache[agentId] = { at: Date.now(), files: cached ? cached.files : [] };
  }
}

/* What bench's own runner found for this card, and what it has not been
   asked to find. Fetched like the manifest and read back off disk: the
   panel is a view of stored records, so drawing it runs nothing — which
   is the rule a detail panel for test results has to follow. */
function verificationPanel(task, agent) {
  const head = (right) =>
    `<div class="panel"><div class="phead"><span class="label">Verification</span>` +
    `<span class="r">${right}</span></div>`;
  if (!task) {
    return head('—') +
      `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">no card attached</span>` +
      `<span class="state">bench verifies a card's work</span></div></div>`;
  }
  const cached = S.evidence[task.file];
  if (!cached || !cached.rollup) {
    return head('reading') +
      `<div class="check-row none"><span class="glyph">·</span>` +
      `<span class="name">reading the evidence</span>` +
      `<span class="state">loading</span></div></div>`;
  }
  const rollup = cached.rollup;
  const rows = rollup.rows || [];
  const live = rows.some(r => r.live);
  const unverified = agent && agent.status !== 'running'
    && rows.length && !rows.some(r => r.outcome === 'passed');
  return head(esc(live ? 'running now' : (rollup.location === 'local'
                                          ? 'local to this board' : 'synchronized'))) +
    verifyRows(rollup, { links: false }) +
    (unverified
      ? `<div class="check-row none"><span class="glyph">·</span>` +
        `<span class="name">the run has finished</span>` +
        `<span class="state">nothing here passed — a finished agent is not a ` +
        `verified card</span></div>`
      : '') +
    `<p class="why" style="margin:6px 0 0;color:var(--dim);font-size:11.5px">` +
    `Each row is a process bench launched and waited on. Open the card's ` +
    `◫ chip for the logs, the commits they ran against and a rerun.</p>` +
    `</div>`;
}

/* Code produced, work verified, work accepted — three states an exit code
   cannot tell apart, drawn apart here. The panel reads the gate the state
   payload already carries, so it costs nothing and starts nothing; the
   card's ⚖ chip is where the whole reading and the remedies live. */
function focusGatePanel(task, agent) {
  const head = (right) =>
    `<div class="panel"><div class="phead"><span class="label">Gate</span>` +
    `<span class="r">${right}</span></div>`;
  if (!task) {
    return head('—') +
      `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">no card attached</span>` +
      `<span class="state">a gate is about a card's own merge</span>` +
      `</div></div>`;
  }
  const g = (S.state.gates || {})[task.file];
  if (!g) {
    return head('ungated') +
      `<div class="check-row none"><span class="glyph">—</span>` +
      `<span class="name">no gate configured</span>` +
      `<span class="state">this board requires nothing before a merge, so ` +
      `nothing here is proved — not a pass</span></div></div>`;
  }
  const [cls, glyph, word] = gateState(g.decision);
  const finished = agent && agent.status && agent.status !== 'running';
  const row = (name, value, kls) =>
    `<div class="check-row ${kls || ''}"><span class="glyph">·</span>` +
    `<span class="name">${esc(name)}</span>` +
    `<span class="state">${esc(value)}</span></div>`;
  return head(esc(`${g.scope} · local to this board`)) +
    `<div class="check-row ${cls === 'ok' ? 'pass' : cls === 'bad' ? 'fail' : ''}">` +
    `<span class="glyph">${glyph}</span>` +
    `<span class="name">${esc(word)}</span>` +
    `<span class="state">${esc(g.summary)}</span></div>` +
    row('code produced',
        finished ? 'the run has ended and its commits are on the branch'
                 : 'the run is still working') +
    row('verified',
        g.decision === 'allowed'
          ? `${g.met} of ${g.required} requirements met against ` +
            `${String(g.head || '').slice(0, 12)}`
          : g.decision === 'overridden'
            ? 'no — an authorised person proceeded over an unmet gate'
            : `no — ${g.unmet.length} unmet`,
        g.decision === 'allowed' ? 'pass' : 'fail') +
    (g.unmet || []).map(u =>
      `<div class="check-row fail" style="padding-left:18px">` +
      `<span class="glyph">✕</span><span class="name">${esc(u.name)}</span>` +
      `<span class="state">${esc(u.reason)}</span></div>`).join('') +
    `<p class="why" style="margin:6px 0 0;color:var(--dim);font-size:11.5px">` +
    `A finished agent is not a verified card, and a verified card is not an ` +
    `accepted one. The card's ⚖ chip has the whole reading and what to do ` +
    `about each unmet requirement.</p></div>`;
}

async function fetchEvidence(file, stage) {
  const cached = S.evidence[file];
  if (cached && (cached.fetching || Date.now() - cached.at < 6000)) return;
  S.evidence[file] = { ...(cached || {}), fetching: true };
  try {
    const res = await fetch('/api/evidence?file=' + encodeURIComponent(file) +
                            '&stage=' + encodeURIComponent(stage || ''));
    const data = res.ok ? await res.json() : {};
    S.evidence[file] = { at: Date.now(), rollup: data.rollup || null,
                         evidence: data.evidence || [] };
    if (S.view === 'focus') scheduleRender();
  } catch {
    S.evidence[file] = { at: Date.now(),
                         rollup: cached ? cached.rollup : null,
                         evidence: cached ? cached.evidence : [] };
  }
}

/* The readiness reading. A GET, so this starts no process, pins nothing
   and spends nothing — but it does resolve every intent and hash every
   approved input, so it is held for a minute rather than taken on every
   SSE nudge. A reading older than that is still shown while a fresh one
   is on the way: the panel's own words are about when it was taken. */
async function fetchReadiness() {
  const cached = S.doctor;
  if (cached && (cached.fetching || Date.now() - cached.at < 60000)) return;
  S.doctor = { ...(cached || { at: 0 }), fetching: true };
  try {
    const res = await fetch('/api/doctor');
    const data = res.ok ? await res.json() : {};
    if (data.doctor) S.doctor = { at: Date.now(), report: data.doctor };
    else S.doctor = { at: Date.now(), report: cached ? cached.report : null };
    scheduleRender();
  } catch {
    S.doctor = { at: Date.now(), report: cached ? cached.report : null };
  }
}

/* The manifest one run was frozen with. Fetched rather than carried in the
   state payload, because it holds a capability table per run and the
   payload rides every SSE nudge — and read back off disk rather than
   resolved again, which is the whole guarantee: a profile edited mid-run
   retargets the next launch and never this record. */
async function fetchManifest(agentId) {
  const cached = S.manifests[agentId];
  if (cached && (cached.fetching || Date.now() - cached.at < 8000)) return;
  S.manifests[agentId] = { ...(cached || {}), fetching: true };
  try {
    const res = await fetch('/api/manifest?agent=' + encodeURIComponent(agentId));
    const data = res.ok ? await res.json() : {};
    S.manifests[agentId] = { at: Date.now(), manifest: data.manifest || null,
                             freshness: data.freshness || null };
    if (S.view === 'focus') scheduleRender();
  } catch {
    S.manifests[agentId] = { at: Date.now(),
                             manifest: cached ? cached.manifest : null,
                             freshness: cached ? cached.freshness : null };
  }
}

async function openExtra(dir, name) {
  const url = `/files/${encodeURIComponent(dir)}/${encodeURIComponent(name)}`;
  if (name.toLowerCase().endsWith('.md')) {
    try {
      const res = await fetch(url);
      if (!res.ok) { toast(`could not read ${name}`, true); return; }
      S.fileView = { dir, name, content: await res.text() };
      S.selected = null;
      renderDrawer();
      $('#drawerbody').scrollTop = 0;
    } catch { toast(`could not read ${name}`, true); }
  } else {
    window.open(url, '_blank');  // html renders, everything else the browser handles
  }
}

// Small markdown renderer — for these task files, which are hard-wrapped
// prose: a logical line spans several source lines. No dependencies.
function md(src) {
  const blocks = esc(src).split(/\n{2,}/);
  const inline = (t) => t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    // a link is a link only to somewhere a card may point: the web, mail,
    // an anchor or a relative path. A brief an agent proposed is rendered
    // here once applied, so `javascript:` and its kin stay plain text
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) =>
      /^(?:https?:|mailto:|#|[^:]*$)/i.test(href) ? `<a href="${href}">${label}</a>` : label);

  /* Lists: group physical lines into logical items before rendering. A new
     item begins only at a marker; a line without one is continuation text
     joined to the item above with a space — that is what stops a wrapped
     item from sprouting a second bullet. A marker indented past the level
     it sits in opens a nested list, and a shallower one closes back to the
     level that fits, so children indent under their parent instead of
     flattening beside it. */
  const MARKER = /^([ \t]*)(?:[-*]|\d+\.)[ \t]+(.*)$/;
  const ORDERED = /^[ \t]*\d+\./;
  const TICK = /^\[([ xX])\]\s*(.*)$/;   // - [ ] / - [x], read-only here

  const listTree = (lines) => {
    const root = { ordered: ORDERED.test(lines[0]), items: [] };
    const stack = [{ indent: null, list: root }];
    let last = null;
    for (const line of lines) {
      const m = line.match(MARKER);
      if (!m) {                                  // continuation of the item above
        if (last && line.trim()) last.text += ' ' + line.trim();
        continue;
      }
      const indent = m[1].replace(/\t/g, '    ').length;
      const top = () => stack[stack.length - 1];
      if (top().indent === null) top().indent = indent;
      while (stack.length > 1 && indent < top().indent) stack.pop();
      if (last && indent > top().indent) {
        last.sub = { ordered: ORDERED.test(line), items: [] };
        stack.push({ indent, list: last.sub });
      }
      last = { text: m[2], sub: null };
      top().list.items.push(last);
    }
    return root;
  };

  const listHtml = (list) => {
    const tag = list.ordered ? 'ol' : 'ul';
    return `<${tag}>` + list.items.map((it) => {
      const t = it.text.match(TICK);
      const body = inline(t ? t[2] : it.text) + (it.sub ? listHtml(it.sub) : '');
      if (!t) return `<li>${body}</li>`;
      // A glyph, never an input: the task file is the source of truth and
      // the drawer is not an editor. Done reads as settled, open is neutral.
      const done = t[1] !== ' ';
      return `<li class="tick${done ? ' on' : ''}">` +
        `<span class="box" role="img" aria-label="${done ? 'done' : 'not done'}">` +
        `${done ? '✓' : ''}</span>${body}</li>`;
    }).join('') + `</${tag}>`;
  };

  let inFence = false, fenced = [];
  const out = [];
  for (const block of blocks) {
    if (inFence || block.startsWith('```')) {
      fenced.push(block);
      const ticks = (block.match(/```/g) || []).length;
      inFence = inFence ? ticks % 2 === 0 : ticks % 2 === 1;
      if (!inFence) {
        const body = fenced.join('\n\n').replace(/^```[^\n]*\n?/, '').replace(/```\s*$/, '');
        out.push(`<pre><code>${body}</code></pre>`);
        fenced = [];
      }
      continue;
    }
    const text = block.replace(/\s+$/, '');   // the split leaves the last block a trailing newline
    const lines = text.split('\n');
    if (lines.length >= 2 && /^\s*\|.*\|\s*$/.test(lines[0]) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[1])) {
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = cells(lines[0]);
      const rows = lines.slice(2).filter(l => /\|/.test(l)).map(cells);
      out.push('<div class="tablewrap"><table><thead><tr>' +
        head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>');
    } else if (/^#{1,6}\s/.test(text)) {
      out.push(lines.map(l => {
        const m = l.match(/^(#{1,6})\s+(.*)$/);
        return m ? `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>` : `<p>${inline(l)}</p>`;
      }).join(''));
    } else if (MARKER.test(lines[0])) {
      out.push(listHtml(listTree(lines)));
    } else if (/^&gt;/.test(text)) {
      // reflow, don't preserve the author's wrap column
      out.push('<blockquote>' + inline(text.replace(/^&gt;\s?/gm, '')).replace(/\n/g, ' ') + '</blockquote>');
    } else if (/^-{3,}$/.test(text.trim())) {
      out.push('<hr>');
    } else {
      out.push(`<p>${inline(text).replace(/\n/g, ' ')}</p>`);
    }
  }
  if (fenced.length) out.push(`<pre><code>${fenced.join('\n\n')}</code></pre>`);
  return out.join('');
}
