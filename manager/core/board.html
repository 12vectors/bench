        inspectRows.map(stage).join('') + `<p>${esc(d.unknownIsNotPassed)}</p>`)) +
    spanel('Execution diagnostics', 'separate from the check above',
      `<p>Each runs real processes. It arms on the first click and runs on ` +
      `the second.</p>` +
      (execRows.length ? execRows.map(stage).join('')
        : `<p>No execution stage is offered from this page.</p>`)) +
    (handRows.length
      ? spanel('Run from a terminal', 'not offered here',
          `<p>These stages have no control on this page. An operator runs ` +
          `them deliberately, with the command and the authorisation shown.</p>` +
          handRows.map(stage).join(''))
      : '') +
    sref('What inspection is, and what it cannot do',
      `<p>${esc(d.inspectIs)}</p>` +
      `<p>Read-only inspection cannot: ${esc(d.cannot.join(', '))}.</p>`) +
    sref('Every diagnostic bench can produce, and its remedy',
      `<pre>${esc(Object.entries(d.diagnosticCodes)
        .map(([code, x]) => `${code}\n  ${x.title}\n  ${x.remedy}`)
        .join('\n\n'))}</pre>`) +
    sref('What a diagnosis withholds',
      `<pre>${esc(Object.entries(d.redaction)
        .map(([k, why]) => `${k}: ${why}`).join('\n\n'))}</pre>`);
}

function wireDiagnostics() {
  const body = $('#sbody');
  body.querySelectorAll('[data-spurpose]').forEach(btn =>
    btn.addEventListener('click', () => {
      S.settingsPurpose = btn.dataset.spurpose || null;
      renderSettings();
      const again = $('#sbody').querySelector(
        `[data-spurpose="${CSS.escape(btn.dataset.spurpose)}"]`);
      if (again) again.focus();
    }));
  body.querySelectorAll('[data-sdoctor]').forEach(btn => {
    const mode = btn.dataset.sdoctor;
    const spec = (S.settings.page.diagnostics.modes || {})[mode] || {};
    wireAction(btn, `${BOARD_ACT}settings-doctor::${mode}`, {
      label: spec.label || mode, confirm: 'run it?', busy: 'running…',
      run: () => settingsDoctorRun(mode),
    });
  });
}

/* The read-only action, under its decided name. It is a GET of the
   doctor's own report with no mode named, which is inspection: the policy
   resolved for every intent, the approved inputs read, bench's own broken
   fixtures through the same resolver. No project program, no adapter hook,
   no model, nothing pinned. */
async function inspectConfiguration() {
  S.settingsSection = 'diagnostics';
  S.doctorReading = true;
  renderSettings();
  try {
    const res = await fetch('/api/doctor');
    const data = await res.json();
    if (res.ok && data.doctor) {
      S.doctor = { at: Date.now(), report: data.doctor };
      S.doctorError = null;
      renderDoctor();
    } else {
      S.doctor = null;
      S.doctorError = data.error || 'the configuration could not be inspected';
      toast(S.doctorError, true);
    }
  } catch (e) {
    S.doctor = null;
    S.doctorError = e.message || 'the board could not be asked';
    toast(S.doctorError, true);
  } finally {
    S.doctorReading = false;
    renderSettings();
  }
}

/* The executing stages, which are a different thing and say so. Each one
   is armed, names its side effects beside it, and goes through the board's
   existing `/api/doctor/run` — this page invents no run endpoint. */
async function settingsDoctorRun(mode) {
  try {
    const res = await fetch('/api/doctor/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ modes: [mode] }),
    });
    const data = await res.json();
    if (!res.ok || !data.doctor) {
      toast(data.error || 'the stage could not be run', true);
      return false;
    }
    S.doctor = { at: Date.now(), report: data.doctor };
    renderDoctor();
    renderSettings();
    return true;
  } catch (e) {
    toast(e.message || 'the board could not be asked', true);
    return false;
  }
}

/* ── one draft: the contextual editors and the advanced one ────────────── */

/* The draft every editor on this page writes into. There is one, so an
   edit started in Checks, carried on in Merge rules and finished in the
   advanced editor is one change — validated, previewed and applied once,
   through the same four steps, of which only the last one writes. */
function ensureDraft(page) {
  const d = page.editing.draft;
  if (!S.draft) {
    S.draft = { document: JSON.parse(JSON.stringify(d.document)),
                revision: d.revision, checked: null, preview: null,
                dirty: false, raw: null };
  }
  return S.draft;
}

/* Opening a contextual editor. A check is edited at its index in the
   document as written; one that is not there (an invalid document, or a
   check resolved from a command grant) goes to the advanced editor rather
   than being edited somewhere it does not live. */
function openEditor(page, kind, name) {
  const draft = ensureDraft(page);
  if (kind === 'check') {
    const index = (draft.document.checks || []).findIndex(c => c && c.name === name);
    if (index < 0) {
      toast(`${name} is not declared as a check in the document — edit it in ` +
            `the advanced editor`, true);
      S.settingsSection = 'policy';
      renderSettings();
      return;
    }
    S.sedit = { kind, index, anchor: name };
  } else if (kind === 'new-check') {
    const list = draft.document.checks = draft.document.checks || [];
    list.push({ name: '', run: '', root: 'worktree' });
    if (!draft.document.v) draft.document.v = page.editing.draft.schemaVersion;
    draft.dirty = true;
    draft.checked = null;
    draft.preview = null;
    S.sedit = { kind: 'check', index: list.length - 1, anchor: null };
  } else if (kind === 'overrides') {
    S.sedit = { kind };
  } else {
    S.sedit = { kind, scope: name };
  }
  renderSettings();
  requestAnimationFrame(() => {
    const first = document.querySelector('#s-editor [data-field]');
    if (first) first.focus();
  });
}

function errorLines(errs) {
  return errs.map(e =>
    `<p class="ferr"><span class="fld">${esc(e.code || '')}</span> ` +
    `${esc(e.why || '')}${e.remedy ? ` <i>${esc(e.remedy)}</i>` : ''}</p>`)
    .join('');
}

function draftErrors(keep) {
  return ((S.draft.checked && S.draft.checked.errors) || []).filter(keep);
}

/* The four steps, wherever the draft is being edited. `here` is the
   caller's own share of the field errors, drawn at its fields; the bar
   draws every other one, so an error is never hidden because it belongs
   to a part of the document that is not on screen. */
function draftBar(page, here) {
  const draft = S.draft;
  const errs = (draft.checked && draft.checked.errors) || [];
  const ok = !!(draft.checked && draft.checked.ok);
  const elsewhere = errs.filter(e => !here(e));
  // Apply is the one primary action, and it stays disabled — not merely
  // grey — until a validation of this exact draft came back clean
  return `<div class="acts" id="s-steps">` +
    `<button class="sb" id="s-validate" aria-label="validate the draft">` +
    `Validate</button>` +
    `<button class="sb" id="s-preview" aria-label="preview the change">` +
    `Preview</button>` +
    `<button class="sb ${ok ? 'primary' : ''}" id="s-apply" ` +
    `aria-label="apply the change"${ok ? '' : ' disabled'}>` +
    `${actLabel('Apply', 'write it?', 'writing…')}</button>` +
    `<button class="sb danger" id="s-discard" aria-label="discard the draft">` +
    `Discard draft</button>` +
    (S.sedit && S.settingsSection !== 'policy'
      ? `<button class="sb link" id="s-close" aria-label="close the editor and ` +
        `keep the draft">Close</button>` : '') +
    `<span class="s-rev">revision ` +
    `${esc((draft.revision || 'none').slice(0, 12))}` +
    `${draft.dirty ? ' · edited' : ''}</span></div>` +
    (draft.checked
      ? (ok
          ? `<p>The draft validates. Nothing has been written.</p>`
          : `<p class="bad">${errs.length} thing` +
            `${errs.length === 1 ? '' : 's'} would be refused. Nothing has ` +
            `been written.</p>`)
      : `<p>Not validated yet. Apply stays unavailable until a validation ` +
        `of this draft comes back clean.</p>`) +
    errorLines(elsewhere) + draftConsequences();
}

/* What applying would change: two resolutions compared by the server,
   never a prediction made here. */
function draftConsequences() {
  const draft = S.draft;
  if (!draft.preview) {
    return `<p>Nothing has been previewed. <b>Preview</b> compares the draft ` +
      `with what is in force and writes nothing.</p>`;
  }
  return `<div class="s-conseq"><div class="phead">` +
    `<span class="label">If you apply</span>` +
    `<span class="r">${draft.preview.changes.length} change` +
    `${draft.preview.changes.length === 1 ? '' : 's'}</span></div>` +
    (draft.preview.changes.length
      ? `<div class="s-diff">` + draft.preview.changes.map(c =>
          `<div class="d"><span class="k">${esc(c.kind)}</span>` +
          `<span>${esc(c.what)} — ${esc(c.detail)}` +
          (c.before !== undefined
            ? `<br><span class="s-rev">` +
              `before ${esc(JSON.stringify(c.before))} → after ` +
              `${esc(JSON.stringify(c.after))}</span>` : '') +
          `</span></div>`).join('') + `</div>`
      : `<p>Nothing would change.</p>`) +
    `<p>${esc(draft.preview.evidence.why)}` +
    (draft.preview.evidence.invalidated.length
      ? ` (${draft.preview.evidence.count} recorded pass` +
        `${draft.preview.evidence.count === 1 ? '' : 'es'} affected)` : '') +
    `</p>` +
    (draft.preview.pending.length
      ? `<p class="bad">Cards waiting in review/ whose merge decision ` +
        `would change: ` + esc(draft.preview.pending.map(p =>
          p.file + ' (' + p.before + ' → ' + p.after + ')').join('; ')) +
        `</p>`
      : `<p>No card waiting in review/ changes its merge decision.</p>`) +
    `<ul>${draft.preview.sideEffects.map(e =>
      `<li>${esc(e)}</li>`).join('')}</ul></div>`;
}

/* The review requirement for one gate scope, with the policies this board
   cannot enforce offered disabled and saying why. */
function reviewSelect(page, scope, chosen) {
  return `<div class="frow"><label for="f-gates:${esc(scope)}:review">review` +
    `</label><select id="f-gates:${esc(scope)}:review" ` +
    `data-field="gates:${scope}:review" aria-label="${esc(scope)} review ` +
    `requirement">` + page.acceptance.reviewModes.map(m => {
      const word = m.name;
      return `<option value="${esc(word)}"` +
        `${chosen === word ? ' selected' : ''}` +
        `${m.available ? '' : ' disabled'}>${esc(word)}` +
        `${m.available ? '' : ' — not available on this board'}</option>`;
    }).join('') + `</select></div>`;
}

function draftCheckNames() {
  return (S.draft.document.checks || [])
    .map(c => String((c || {}).name || '')).filter(Boolean);
}

/* Editing one check where it is listed: its own fields, which launch
   intents may ask for it, the refusals about it at the fields, and the
   shared step bar. */
function checkEditor(page, n) {
  const c = (S.draft.document.checks || [])[n] || {};
  const name = String(c.name || '');
  const mine = (e) => ['checks', 'profiles', 'prepare'].includes(e.field || '-')
    && (!name || String(e.why || '').includes(`'${name}'`));
  return `<div class="item s-edit s-inline" id="s-editor" role="group" ` +
    `aria-label="${esc(name ? `edit the check ${name}` : 'a new check')}">` +
    `<div class="ihead"><span class="label">` +
    `${esc(name ? `Editing ${name}` : 'New check')}</span>` +
    `<button class="sb danger" data-drop="checks:${n}" ` +
    `aria-label="remove this check from the draft">Remove</button></div>` +
    errorLines(draftErrors(mine)) +
    `<div class="fgrid">` +
    field(`checks:${n}:name`, 'name', c.name || '') +
    field(`checks:${n}:run`, 'command', c.run || '') +
    select(`checks:${n}:root`, 'runs in', c.root || 'worktree',
           Object.keys(page.verification.roots)) +
    field(`checks:${n}:timeout`, 'timeout (s)',
          c.timeout === undefined ? '' : String(c.timeout), 'number') +
    field(`checks:${n}:prepare`, 'preparation steps (comma separated)',
          (c.prepare || []).join(', ')) +
    field(`checks:${n}:scopes`, 'scopes (one per line: name = arg arg)',
          Object.entries(c.scopes || {})
            .map(([w, a]) => `${w} = ${(a || []).join(' ')}`).join('\n'), 'area') +
    `</div>` +
    (name
      ? `<p>Which launches may ask bench to run it:</p>` +
        ['work', 'act-pr', 'review'].map(intent => {
          const want = ((((S.draft.document.profiles || {})[intent]) || {})
            .verify || []).map(String);
          return checkbox(`profiles:${intent}:verify:${name}`, intent,
                          want.includes(name));
        }).join('')
      : `<p>Name the check, then choose which launches may ask for it.</p>`) +
    draftBar(page, mine) + `</div>`;
}

/* Editing one merge rule where it is listed. A requirement on a declared
   scope is kept as written — see writeField — and labelled with it. */
function gateEditor(page, scope) {
  const gate = ((S.draft.document.gates || {})[scope]) || {};
  const entries = gate.checks || [];
  const want = entries.map(c => typeof c === 'string' ? c : String((c || {}).check || ''));
  const names = draftCheckNames();
  const mine = (e) => (e.field || '-') === 'gates';
  return `<div class="item s-edit s-inline" id="s-editor" role="group" ` +
    `aria-label="${esc(`edit the ${scope} merge rule`)}">` +
    `<div class="ihead"><span class="label">` +
    `${esc(`Editing ${SCOPE_LABEL[scope] || scope}`)}</span></div>` +
    errorLines(draftErrors(mine)) +
    (names.length
      ? names.map(name => {
          const entry = entries[want.indexOf(name)];
          // plain text: checkbox() escapes its label
          const coverage = entry && typeof entry === 'object' && entry.scope
            ? ' (scope ' + entry.scope + ')' : want.includes(name) ? ' (full run)' : '';
          return checkbox(`gates:${scope}:checks:${name}`,
                          'require ' + name + coverage, want.includes(name));
        }).join('')
      : `<p>No check is declared, so this rule can require none. Add one in ` +
        `Checks first.</p>`) +
    reviewSelect(page, scope, gate.review || 'none') +
    draftBar(page, mine) + `</div>`;
}

function overridesEditor(page) {
  const over = ((S.draft.document.gates || {}).overrides) || {};
  const mine = (e) => (e.field || '-') === 'gates';
  return `<div class="item s-edit s-inline" id="s-editor" role="group" ` +
    `aria-label="edit the override policy">` +
    `<div class="ihead"><span class="label">Editing overrides</span></div>` +
    errorLines(draftErrors(mine)) +
    checkbox('gates:overrides:allow', 'allow an unmet merge rule to be ' +
             'proceeded over, on the record', over.allow === true) +
    field('gates:overrides:actors', 'restricted to these git identities ' +
          '(comma separated; empty means any)', (over.actors || []).join(', ')) +
    draftBar(page, mine) + `</div>`;
}

/* ── the advanced editor: the whole document ───────────────────────────── */

function settingsPolicy(page) {
  const d = page.editing.draft;
  const draft = ensureDraft(page);
  const errs = (draft.checked && draft.checked.errors) || [];
  const byField = (field) => errs.filter(e => (e.field || '') === field);
  const fieldErrors = (field) => errorLines(byField(field));
  const names = draftCheckNames();
  // the panels below draw these at their fields; the bar draws the rest
  const shown = (e) => ['checks', 'prepare', 'profiles', 'gates'].includes(e.field || '');

  const checkItems = (draft.document.checks || []).map((c, n) =>
    `<div class="item"><div class="ihead"><span class="label">Check ${n + 1}` +
    `</span><button class="sb danger" data-drop="checks:${n}" ` +
    `aria-label="remove check ${n + 1}">Remove</button></div>` +
    `<div class="fgrid">` +
    field(`checks:${n}:name`, 'name', (c || {}).name || '') +
    field(`checks:${n}:run`, 'command', (c || {}).run || '') +
    select(`checks:${n}:root`, 'runs in', (c || {}).root || 'worktree',
           Object.keys(page.verification.roots)) +
    field(`checks:${n}:timeout`, 'timeout (s)',
          (c || {}).timeout === undefined ? '' : String(c.timeout), 'number') +
    field(`checks:${n}:prepare`, 'preparation steps (comma separated)',
          ((c || {}).prepare || []).join(', ')) +
    field(`checks:${n}:scopes`, 'scopes (one per line: name = arg arg)',
          Object.entries((c || {}).scopes || {})
            .map(([w, a]) => `${w} = ${(a || []).join(' ')}`).join('\n'),
          'area') +
    `</div></div>`).join('');

  const stepItems = (draft.document.prepare || []).map((p, n) =>
    `<div class="item"><div class="ihead"><span class="label">Step ${n + 1}` +
    `</span><button class="sb danger" data-drop="prepare:${n}" ` +
    `aria-label="remove preparation step ${n + 1}">Remove</button></div>` +
    `<div class="fgrid">` +
    field(`prepare:${n}:name`, 'name', (p || {}).name || '') +
    field(`prepare:${n}:run`, 'command', (p || {}).run || '') +
    checkbox(`prepare:${n}:network`, 'needs the network',
             (p || {}).network === true) +
    `</div></div>`).join('');

  const intentItems = page.overview.policy.kind !== null
    ? ['work', 'act-pr', 'review'].map(intent => {
        const prof = ((draft.document.profiles || {})[intent]) || {};
        const want = (prof.verify || []).map(String);
        return `<div class="item"><div class="ihead">` +
          `<span class="label"><code>${esc(intent)}</code></span></div>` +
          (names.length
            ? names.map(name => checkbox(
                `profiles:${intent}:verify:${name}`,
                `may ask bench to run ${name}`, want.includes(name))).join('')
            : `<p>No check is declared yet, so there is nothing for this ` +
              `intent to ask for.</p>`) + `</div>`;
      }).join('') +
      // the fourth intent asks for nothing, and says so rather than
      // offering boxes the policy would refuse (intent-restricted)
      `<div class="item"><div class="ihead"><span class="label">` +
      `<code>${esc('refine')}</code></span></div><p>A card refinement runs ` +
      `no command and asks for no check: it reads and proposes a brief, and ` +
      `bench writes it.</p></div>`
    : '';

  const gateItems = Object.keys(page.acceptance.scopes).map(scope => {
    const gate = ((draft.document.gates || {})[scope]) || {};
    const want = (gate.checks || []).map(c =>
      typeof c === 'string' ? c : String((c || {}).check || ''));
    return `<div class="item"><div class="ihead">` +
      `<span class="label">${esc(SCOPE_LABEL[scope] || scope)}</span>` +
      `<code>${esc(scope)}</code></div>` +
      (names.length
        ? names.map(name => checkbox(`gates:${scope}:checks:${name}`,
            `require ${name}`, want.includes(name))).join('')
        : `<p>No check is declared yet, so this gate can require none.</p>`) +
      reviewSelect(page, scope, gate.review || 'none') + `</div>`;
  }).join('');

  const over = ((draft.document.gates || {}).overrides) || {};

  // every panel a heading of its own; the field labels are sentences, and
  // the step bar is the same one the contextual editors draw
  const head = (title, meta) => `<div class="phead"><h2 class="s-ptitle">` +
    `${esc(title)}</h2><span class="r">${meta}</span></div>`;
  return `<section class="panel">` +
    head('The whole execution policy', `<code>${esc(d.identity || d.path)}</code>`) +
    `<p>Checks and Merge rules edit parts of this same draft; ` +
    `${esc(d.appliesWhy)}.</p>` +
    (d.parseError ? `<p class="bad">${esc(d.parseError)} — the structured ` +
      `fields below start from an empty document; applying would replace ` +
      `the file.</p>` : '') +
    (d.unknownKeys.length
      ? `<p>Keys this editor does not understand are preserved exactly: ` +
        `<code>${esc(d.unknownKeys.join(', '))}</code>.</p>` : '') +
    draftBar(page, shown) +
    sref('The four steps, and secrets',
      `<div class="skv">` + page.editing.steps.map(s =>
        `<dt>${esc(s.step)}</dt><dd>${esc(s.what)}</dd>`).join('') + `</div>` +
      `<p>${esc(page.editing.secrets)}</p>`) +
    `</section>` +
    `<section class="panel s-edit">` + head('Checks', `${names.length} in the draft`) +
    fieldErrors('checks') + checkItems +
    `<div class="acts"><button class="sb" data-add="checks" ` +
    `aria-label="add a check">Add a check</button></div></section>` +
    `<section class="panel s-edit">` +
    head('Preparation steps', `${(draft.document.prepare || []).length} in the draft`) +
    fieldErrors('prepare') + stepItems +
    `<div class="acts"><button class="sb" data-add="prepare" ` +
    `aria-label="add a preparation step">Add a step</button></div></section>` +
    `<section class="panel s-edit">` +
    head('What each launch intent may ask for', '<code>profiles</code>') +
    fieldErrors('profiles') + intentItems + `</section>` +
    `<section class="panel s-edit">` + head('Merge rules', 'per guarded mutation') +
    fieldErrors('gates') + gateItems +
    `<div class="item"><div class="ihead"><span class="label">Overrides` +
    `</span></div>` +
    checkbox('gates:overrides:allow', 'allow an unmet gate to be proceeded ' +
             'over, on the record', over.allow === true) +
    field('gates:overrides:actors', 'restricted to these git identities ' +
          '(comma separated; empty means any)',
          (over.actors || []).join(', ')) + `</div></section>` +
    `<section class="panel"><details class="fold" id="s-rawfold"><summary>The whole ` +
    `document as JSON — for anything these fields do not cover</summary>` +
    `<div class="s-edit" style="padding-top:8px">` +
    `<div class="frow"><label for="s-raw">Document</label>` +
    `<textarea id="s-raw" spellcheck="false" aria-label="the whole execution ` +
    `policy document as JSON">${esc(draft.raw !== null ? draft.raw
      : JSON.stringify(draft.document, null, 2))}</textarea></div>` +
    `<div class="acts"><button class="sb" id="s-useraw" ` +
    `aria-label="use this JSON as the draft">Use this JSON</button></div>` +
    `</div></details></section>`;
}

/* The three field primitives. Ids are `f-<path>` and the path is what the
   change handler writes into the draft, so a field cannot be wired to one
   place and read from another. */
function field(path, label, value, kind) {
  const id = 'f-' + path;
  if (kind === 'area') {
    return `<div class="frow"><label for="${esc(id)}">${esc(label)}</label>` +
      `<textarea id="${esc(id)}" data-field="${esc(path)}" spellcheck="false" ` +
      `style="min-height:58px" aria-label="${esc(label)}">${esc(value)}` +
      `</textarea></div>`;
  }
  return `<div class="frow"><label for="${esc(id)}">${esc(label)}</label>` +
    `<input id="${esc(id)}" type="${kind === 'number' ? 'number' : 'text'}" ` +
    `data-field="${esc(path)}" value="${esc(value)}" spellcheck="false" ` +
    `aria-label="${esc(label)}"></div>`;
}

function select(path, label, value, options) {
  const id = 'f-' + path;
  return `<div class="frow"><label for="${esc(id)}">${esc(label)}</label>` +
    `<select id="${esc(id)}" data-field="${esc(path)}" ` +
    `aria-label="${esc(label)}">` + options.map(o =>
      `<option value="${esc(o)}"${o === value ? ' selected' : ''}>` +
      `${esc(o)}</option>`).join('') + `</select></div>`;
}

function checkbox(path, label, on) {
  const id = 'f-' + path;
  return `<div class="frow"><label class="cb" for="${esc(id)}">` +
    `<input id="${esc(id)}" type="checkbox" data-field="${esc(path)}" ` +
    `${on ? 'checked' : ''} aria-label="${esc(label)}">${esc(label)}` +
    `</label></div>`;
}

/* Writing one field into the draft. The path says where: `checks:2:name`,
   `gates:member:checks:unit`, `profiles:review:verify:proposed`. Nothing
   here validates — that is the server's answer, one request later, from
   the parser a launch rides. */
function writeField(path, el) {
  const parts = path.split(':');
  const doc = S.draft.document;
  const value = el.type === 'checkbox' ? el.checked : el.value;
  if (parts[0] === 'checks' || parts[0] === 'prepare') {
    const list = doc[parts[0]] = doc[parts[0]] || [];
    const item = list[Number(parts[1])] = list[Number(parts[1])] || {};
    const key = parts[2];
    if (key === 'network') item.network = value === true;
    else if (key === 'timeout') {
      if (String(value).trim() === '') delete item.timeout;
      else item.timeout = Number(value);
    } else if (key === 'prepare') {
      const names = String(value).split(',').map(s => s.trim()).filter(Boolean);
      if (names.length) item.prepare = names; else delete item.prepare;
    } else if (key === 'scopes') {
      const scopes = {};
      for (const line of String(value).split('\n')) {
        if (!line.trim()) continue;
        const [name, rest] = line.split('=');
        const args = String(rest || '').trim().split(/\s+/).filter(Boolean);
        if (name.trim()) scopes[name.trim()] = args;
      }
      if (Object.keys(scopes).length) item.scopes = scopes;
      else delete item.scopes;
    } else item[key] = value;
  } else if (parts[0] === 'profiles') {
    const profiles = doc.profiles = doc.profiles || {};
    const prof = profiles[parts[1]] = profiles[parts[1]] || {};
    const want = new Set((prof.verify || []).map(String));
    if (value) want.add(parts[3]); else want.delete(parts[3]);
    if (want.size) prof.verify = [...want]; else delete prof.verify;
  } else if (parts[0] === 'gates') {
    const gates = doc.gates = doc.gates || {};
    if (parts[1] === 'overrides') {
      const over = gates.overrides = gates.overrides || {};
      if (parts[2] === 'allow') over.allow = value === true;
      else {
        const actors = String(value).split(',').map(s => s.trim())
          .filter(Boolean);
        if (actors.length) over.actors = actors; else delete over.actors;
      }
    } else {
      const gate = gates[parts[1]] = gates[parts[1]] || {};
      if (parts[2] === 'review') {
        if (value === 'none') delete gate.review; else gate.review = value;
      } else {
        // entries are kept as written: ticking a check adds its full run,
        // unticking removes every requirement on it, and a scoped
        // `{"check": …, "scope": …}` someone else wrote is never flattened
        const nameOf = (c) => typeof c === 'string' ? c : String((c || {}).check || '');
        let list = (gate.checks || []).slice();
        if (value && !list.some(c => nameOf(c) === parts[3])) list.push(parts[3]);
        if (!value) list = list.filter(c => nameOf(c) !== parts[3]);
        if (list.length) gate.checks = list; else delete gate.checks;
      }
    }
  }
  if (!doc.v) doc.v = S.settings.page.editing.draft.schemaVersion;
  S.draft.dirty = true;
  // an edited draft is no longer the one that validated, so Apply goes
  // back behind a fresh validation rather than firing on a stale pass
  S.draft.checked = null;
  S.draft.preview = null;
  S.draft.raw = null;
}

function wirePolicyEditor(page) {
  const body = $('#sbody');
  body.querySelectorAll('[data-field]').forEach(el => {
    const handler = () => {
      writeField(el.dataset.field, el);
      renderSettings();
      const again = document.getElementById(el.id);
      if (again && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
        again.focus();
        try { again.setSelectionRange(again.value.length, again.value.length); }
        catch (e) { /* number inputs refuse a selection range */ }
      } else if (again) again.focus();
    };
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT'
      ? 'change' : 'change', handler);
  });
  body.querySelectorAll('[data-add]').forEach(btn =>
    btn.addEventListener('click', () => {
      const key = btn.dataset.add;
      const doc = S.draft.document;
      doc[key] = doc[key] || [];
      doc[key].push(key === 'checks'
        ? { name: '', run: '', root: 'worktree' } : { name: '', run: '' });
      if (!doc.v) doc.v = page.editing.draft.schemaVersion;
      S.draft.dirty = true;
      S.draft.checked = null;
      S.draft.preview = null;
      renderSettings();
    }));
  body.querySelectorAll('[data-drop]').forEach(btn =>
    btn.addEventListener('click', () => {
      const [key, n] = btn.dataset.drop.split(':');
      (S.draft.document[key] || []).splice(Number(n), 1);
      // the contextual editor was about the item that has just gone
      if (S.sedit && S.sedit.kind === 'check') S.sedit = null;
      S.draft.dirty = true;
      S.draft.checked = null;
      S.draft.preview = null;
      renderSettings();
    }));
  const raw = body.querySelector('#s-raw');
  if (raw) raw.addEventListener('input', () => { S.draft.raw = raw.value; });
  const useRaw = body.querySelector('#s-useraw');
  if (useRaw) useRaw.addEventListener('click', () => {
    try {
      const parsed = JSON.parse(S.draft.raw !== null ? S.draft.raw : raw.value);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        toast('a policy document is a JSON object', true);
        return;
      }
      S.draft.document = parsed;
      S.draft.dirty = true;
      S.draft.checked = null;
      S.draft.preview = null;
      S.draft.raw = null;
      renderSettings();
    } catch (e) {
      toast('that is not valid JSON: ' + e.message, true);
    }
  });
  // Discard is a discard: the draft goes, nothing is written, and the
  // settings as they stand are read again.
  body.querySelector('#s-discard').addEventListener('click', () => {
    S.draft = null; S.sedit = null;
    fetchSettings(true);
    toast('draft discarded — nothing was written');
  });
  // Close puts the contextual editor away and keeps the draft: the notice
  // at the top of every section says it is there, and focus goes back to
  // the Edit button it was opened from
  const close = body.querySelector('#s-close');
  if (close) close.addEventListener('click', () => {
    const was = S.sedit || {};
    S.sedit = null;
    renderSettings();
    const back = [...$('#sbody').querySelectorAll('[data-sedit]')].find(b =>
      b.dataset.sedit === (was.kind === 'check' ? 'check' : was.kind) &&
      b.dataset.sname === (was.kind === 'check' ? (was.anchor || '') : (was.scope || '')));
    if (back) back.focus();
  });
  body.querySelector('#s-validate').addEventListener('click',
    () => settingsPost('validate'));
  body.querySelector('#s-preview').addEventListener('click',
    () => settingsPost('preview'));
  const apply = body.querySelector('#s-apply');
  wireAction(apply, `${BOARD_ACT}settings-apply`, {
    label: 'Apply', confirm: 'write it?', busy: 'writing…',
    run: () => settingsApply(),
  });
}

/* The one header a cross-origin form cannot set, and a cross-origin fetch
   cannot send without a preflight this board does not answer. The server
   refuses a policy change without it — see `httpd.origin_problem`. */
const SETTINGS_HEADERS = { 'Content-Type': 'application/json',
                           'X-Bench-Settings': '1' };

async function settingsPost(step) {
  try {
    const res = await fetch(`/api/settings/${step}`, {
      method: 'POST', headers: SETTINGS_HEADERS,
      body: JSON.stringify({ document: S.draft.document }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast(data.error || `the draft could not be ${step}d`, true);
      return;
    }
    if (step === 'validate') {
      S.draft.checked = data.validation;
      toast(data.validation.ok
        ? 'the draft validates — nothing was written'
        : `${data.validation.errors.length} would be refused — nothing was written`,
        !data.validation.ok);
    } else {
      S.draft.preview = data.preview;
      S.draft.checked = { ok: data.preview.ok, errors: data.preview.errors,
                          revision: data.preview.revision };
      toast('previewed — nothing was written');
    }
    renderSettings();
  } catch (e) {
    toast(e.message || 'the board could not be asked', true);
  }
}

async function settingsApply() {
  try {
    const res = await fetch('/api/settings/apply', {
      method: 'POST', headers: SETTINGS_HEADERS,
      body: JSON.stringify({ document: S.draft.document,
                             revision: S.draft.revision }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast(data.error || 'the settings were not written', true);
      // a conflict is not a bad document: re-read, so the next apply is
      // made against the revision that is actually current
      if (data.conflict) { S.sedit = null; S.draft = null; fetchSettings(true); }
      return false;
    }
    // what was written is read back from the server, not kept from the
    // draft: a refresh shows the same thing this does
    S.draft = null;
    S.sedit = null;
    await fetchSettings(true);
    toast(`written — ${data.applied.appliesWhy}`);
    return true;
  } catch (e) {
    toast(e.message || 'the board could not be asked', true);
    return false;
  }
}

/* What the drawer is showing, as a key its scroll position can be filed
   under. Per document, deliberately: a different card is different
   content, so it has no mark of its own and opens at the top — which is
   the behaviour showDetail() asks for outright and this must not fight. */
function drawerKey() {
  if (S.fileView) return 'v:drawer:file:' + S.fileView.dir + '/' + S.fileView.name;
  // per section too: each of a card's sections keeps its own reading place
  return S.selected ? 'v:drawer:task:' + S.selected.file + ':' + drawerTab(S.selected) : null;
}

function renderDrawer() {
  const panel = $('#drawer');
  const body = $('#drawerbody');
  if (S.drawerKey) markScroll(S.drawerKey, body);   // the document leaving
  const key = S.drawerKey = drawerKey();
  if (S.fileView) {
    const f = S.fileView;
    body.innerHTML =
      `<div class="dhead"><span class="mono" style="font-size:12px;color:var(--dim)">${esc(f.dir)}/${esc(f.name)}</span>` +
      `<span class="spacer"></span><button id="closeDrawer">Close</button></div>` +
      `<div class="dbody">${md(f.content)}</div>`;
    panel.classList.add('open');
    restoreScroll(key, body);
    $('#closeDrawer').addEventListener('click', () => { S.fileView = null; renderDrawer(); });
    return;
  }
  if (!S.selected) { panel.classList.remove('open'); body.innerHTML = ''; return; }
  const t = S.selected;
  const agent = agentOnTask(t.file);
  const failure = failedRun(t);
  const pill = (S.state.completing || {})[t.file]
    ? { text: 'completing', tint: 'var(--accent)', bg: mix('var(--accent)', 16) }
    : failure
    ? { text: 'run failed', tint: 'var(--alarm)', bg: mix('var(--alarm)', 16) }
    : agent && (agent.mode === 'review' || agent.mode === 'refine')
    ? { text: agent.mode === 'refine' ? 'refining' : 'reviewing',
        tint: 'var(--accent)', bg: mix('var(--accent)', 16) }
    : pillFor(t.stage, agent && agent.mode !== 'review');
  const when = new Date(t.mtime * 1000).toLocaleString();
  // the whole excerpt, not just the line the card shows — the sheet is
  // where you read what killed the run without opening files on disk
  const failBlock = failure
    ? `<div class="well bad"><span class="lead">·</span><div class="wbody">` +
      `<b>run failed</b> · rc=${esc(failure.rc)} · ${esc(ago(failure.ended))} ago` +
      `<pre>${esc(failure.excerpt)}</pre>` +
      `<span style="color:var(--dim)">${esc(failure.log || '')}</span></div></div>`
    : '';
  // every text field survives the redraw every state load makes: its text
  // (kept in S as it is typed), and — when someone is typing in it — its
  // focus and caret. The same for a focused tab or button, so a live
  // update never drops a keyboard user to the top of the page.
  const active = document.activeElement;
  const typing = active && active.id && body.contains(active)
    ? { id: active.id,
        sel: typeof active.selectionStart === 'number'
          ? [active.selectionStart, active.selectionEnd] : null }
    : null;
  const tab = drawerTab(t);
  // what the reader is looking at, so a live redraw that adds a record
  // above it (Activity is newest first) moves the page, not the reader
  const anchor = S.drawerAnchorKey === key ? drawerAnchor(body) : null;
  S.drawerAnchorKey = key;
  loadAcc(t);
  const acc = (S.acc[t.file] || {}).data;
  panel.classList.toggle('wide', !!S.dwide);
  // Identity, lifecycle and the way out stay in view while reading (the
  // head is sticky); then five destinations, of which one is drawn. Every
  // section is in the document, so a keyboard, a find-in-page and the
  // existing tools all reach it — the others are `hidden`, not absent.
  body.innerHTML =
    `<div class="dhead dsticky">` +
    `<span class="mono" style="font-size:12px;color:var(--dim)">${t.number ? '#' + esc(t.number) : ''}</span>` +
    `<h2 class="dtitle" id="dtitle">${esc(cardTitle(t))}</h2>` +
    `<span class="pill" style="background:${pill.bg};color:${pill.tint}">${pill.text}</span>` +
    `<button id="dwide" aria-pressed="${S.dwide ? 'true' : 'false'}" ` +
    `title="A wider reading view for long briefs and reports">${S.dwide ? 'Narrow' : 'Expand'}</button>` +
    `<button id="closeDrawer">Close</button>` +
    dtabsHtml(t, tab, acc) + `</div>` +
    dsec('overview', tab, overviewHtml(t, acc, failBlock, signalsBlock(t), planBlock(t), phaseMembers(t))) +
    // the discussion is drawn by its own panel, as text — never through
    // the Markdown renderer, and never as part of the brief
    dsec('brief', tab, briefHtml(t) + discussionPanel(t)) +
    dsec('acceptance', tab, acceptanceHtml(t, acc)) +
    dsec('reviews', tab, reviewsHtml(t, acc)) +
    dsec('activity', tab, activityHtml(t, acc)) +
    `<div class="dmeta">${esc(t.stage)}/${esc(t.file)} · ${t.words} words · edited ${esc(when)}</div>`;
  wireDiscussion(t);
  wireDetail(t);
  if (typing) {
    const again = document.getElementById(typing.id);
    if (again && !again.closest('[hidden]')) {
      again.focus({ preventScroll: true });
      if (typing.sel && again.setSelectionRange) again.setSelectionRange(typing.sel[0], typing.sel[1]);
    }
  }
  // every tool and action the card has, built by the card's own builder
  // and wired by it — so the detail view cannot offer a tool the card
  // would not, or wire one differently
  const tools = cardFor(t).querySelector('.cardtools');
  if (tools && tools.querySelectorAll('button, a').length) {
    tools.classList.add('open', 'dtools');
    $('#drawertools').replaceWith(tools);
  }
  panel.classList.add('open');
  restoreScroll(key, body);
  if (anchor) {
    const same = [...body.querySelectorAll('.dsec:not([hidden]) [data-keep]')]
      .find(el => el.dataset.keep === anchor.keep);
    if (same) body.scrollTop += same.getBoundingClientRect().top - anchor.top;
  }
  body.querySelectorAll('[data-member]').forEach(row =>
    row.addEventListener('click', () => {
      const member = findTask(row.dataset.member);
      if (member) showDetail(member);
    }));
  $('#closeDrawer').addEventListener('click', () => {
    S.selected = null;
    renderCards();
    // back to the card the detail view was opened from
    focusCard(t.file);
  });
}

/* ── the detail view's sections (task 81) ──────────────────────────────

   Overview leads with what the card is, where it stands and the next
   decision; Brief is the requirement; Acceptance, Reviews and Activity
   are the records. What a card's acceptance and findings *are* is
   computed by the server (`acceptance.py`) from the card's own records,
   bench's evidence and the runs' claims — this draws it and never infers
   a result from a lane, a clean exit or a green suite. Every word a
   person or an agent wrote is drawn through esc(). */
const DTABS = [['overview', 'Overview'], ['brief', 'Brief'], ['acceptance', 'Acceptance'],
               ['reviews', 'Reviews'], ['activity', 'Activity']];
const ACC_GLYPH = { accepted: '✓', 'needs-work': '✕', recheck: '↻', reported: '·', pending: '' };
const STAGE_WORDS = { backlog: 'Backlog', 'to-do': 'To do', 'in-progress': 'In progress',
                      review: 'Review', done: 'Done' };

function drawerTab(t) {
  const want = S.dtab[t.file];
  return DTABS.some(([k]) => k === want) ? want : 'overview';
}

/* The first keyed block the reader can see in the open section, with
   where it sits — read before a redraw, matched after it. */
function drawerAnchor(body) {
  if (!body || !body.scrollTop) return null;
  const head = body.querySelector('.dsticky');
  const floor = body.getBoundingClientRect().top + (head ? head.offsetHeight : 0);
  for (const el of body.querySelectorAll('.dsec:not([hidden]) [data-keep]')) {
    const box = el.getBoundingClientRect();
    if (box.bottom > floor) return { keep: el.dataset.keep, top: box.top };
  }
  return null;
}

function dsec(key, tab, html) {
  return `<section class="dsec" id="dsec-${key}" role="tabpanel" aria-labelledby="dtab-${key}"` +
    ` tabindex="-1"${key === tab ? '' : ' hidden'}>${html}</section>`;
}

function dtabsHtml(t, tab, acc) {
  const count = {
    acceptance: acc && acc.tracked ? `${acc.counts.accepted}/${acc.counts.total}` : '',
    reviews: acc && (acc.findingCounts.open + acc.findingCounts['fix-reported'])
      ? String(acc.findingCounts.open + acc.findingCounts['fix-reported']) : '',
  };
  return `<nav class="dtabs" role="tablist" aria-label="Sections of this card">` +
    DTABS.map(([k, word]) => `<button role="tab" id="dtab-${k}" data-tab="${k}" ` +
      `aria-controls="dsec-${k}" aria-selected="${k === tab}" tabindex="${k === tab ? 0 : -1}">` +
      `${word}${count[k] ? `<span class="n">${esc(count[k])}</span>` : ''}</button>`).join('') +
    `</nav>`;
}

/* The card split as the server splits it (`taskfiles.card_parts`): the
   head (title and `**Field:**` lines), the brief, and the history from
   the first dated report or history heading — a ``` fence hides both. */
function cardSplit(body) {
  const lines = String(body || '').split(/(?<=\n)/);
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length && /^#\s/.test(lines[i])) i++;
  while (i < lines.length && (!lines[i].trim() || /^\*\*[A-Za-z][A-Za-z ]{0,40}:\*\*/.test(lines[i]))) i++;
  const start = i;
  let end = lines.length, fenced = false;
  for (let k = start; k < lines.length; k++) {
    const line = lines[k];
    if (line.trimStart().startsWith('```')) { fenced = !fenced; continue; }
    if (fenced) continue;
    if (/^##\s+(?:Discussion|Phase log|Acceptance record|Review findings)\s*$/.test(line)
        || /^##\s+.+\s[—–-]\s\d{4}-\d{2}-\d{2}\b/.test(line)) {
      end = k;
      let above = k - 1;
      while (above >= start && !lines[above].trim()) above--;
      if (above >= start && lines[above].trim() === '---') end = above;
      break;
    }
  }
  return { head: lines.slice(0, start).join(''), brief: lines.slice(start, end).join(''),
           history: lines.slice(end).join('') };
}

function whenOf(value) {
  if (value == null || value === '') return 0;
  if (typeof value === 'number') return value * 1000;
  const iso = String(value);
  const parsed = Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso.replace(' ', 'T'));
  return Number.isFinite(parsed) ? parsed : 0;
}

function stampOf(value) {
  const ms = whenOf(value);
  return ms ? new Date(ms).toLocaleString() : 'time not recorded';
}

function accStamp(t) {
  const p = (S.state.progress || {})[t.file];
  const a = (S.state.acceptance || {})[t.file];
  return `${t.stage}:${t.mtime}:${p ? p.agent + ':' + (p.lastReport || '') + ':' + p.active : '-'}:` +
    `${a ? JSON.stringify(a) : '-'}`;
}

function loadAcc(t, force) {
  const cur = S.acc[t.file] || {};
  const stamp = accStamp(t);
  if (cur.loading || (!force && cur.stamp === stamp)) return;
  S.acc[t.file] = { ...cur, loading: true };
  fetch(`/api/card/acceptance?file=${encodeURIComponent(t.file)}&stage=${encodeURIComponent(t.stage)}`)
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => ok ? { data, stamp } : { data: cur.data, error: data.error, stamp })
    .catch(() => ({ data: cur.data, stamp, error: 'the board could not be asked' }))
    .then(next => {
      S.acc[t.file] = next;
      if (S.selected && S.selected.file === t.file && !S.fileView) renderDrawer();
    });
}

/* What the person looking at this card should do next, and who holds the
   move — read from facts the board has, in order of what changes the
   decision most. Never "done" from a lane: Done says delivered, nothing
   about acceptance. */
function nextStep(t, acc) {
  const agent = agentOnTask(t.file);
  const failure = failedRun(t);
  const gate = (S.state.gates || {})[t.file];
  const pr = (S.state.prs || {})[t.file];
  const counts = acc ? acc.counts : null;
  const fc = acc ? acc.findingCounts : null;
  if ((S.state.completing || {})[t.file]) {
    return { who: 'board', cls: '', what: 'Being merged and cleaned up — wait for it to finish.' };
  }
  if (failure) {
    return { who: 'you', cls: 'bad', what: `The last run failed (rc=${failure.rc}). Read the excerpt below, then start it again or walk the card back.` };
  }
  if (agent && agent.status === 'running') {
    const doing = { review: 'reviewing it', refine: 'refining the brief', 'act-pr': 'acting on the PR' }[agent.mode] || 'working on it';
    return { who: agent.name || 'agent', cls: '', what: `${agent.name || 'An agent'} is ${doing}. ‖ hold in the tools stops it.` };
  }
  if (fc && fc.open) {
    return { who: 'you or an agent', cls: 'bad', link: 'reviews',
      what: `${fc.open} open review finding${fc.open === 1 ? '' : 's'} — fix ${fc.open === 1 ? 'it' : 'them'} (↻ act on PR, or by hand) and record the fix.` };
  }
  if (fc && fc['fix-reported']) {
    return { who: 'you', cls: '', link: 'reviews',
      what: `${fc['fix-reported']} fix${fc['fix-reported'] === 1 ? '' : 'es'} reported — recheck and resolve, or reopen.` };
  }
  if (counts && (counts['needs-work'] || counts.recheck)) {
    return { who: 'you', cls: 'bad', link: 'acceptance',
      what: `${counts['needs-work'] + counts.recheck} criteri${counts['needs-work'] + counts.recheck === 1 ? 'on needs' : 'a need'} work or a recheck.` };
  }
  if (gate && gate.decision === 'blocked') {
    return { who: 'you', cls: 'bad', what: `The merge gate is not met: ${gate.summary}` };
  }
  switch (t.stage) {
    case 'backlog': return { who: 'you', cls: '', what: 'Not started. Move it to to-do when it is next.' };
    case 'to-do': return { who: 'you', cls: '', what: 'Queued. Move it to in-progress to commit to it, then ▸ start work.' };
    case 'in-progress': return { who: 'you', cls: '', what: t.isPhase ? 'Run the phase (▸ run phase in the tools).' : 'Nobody is on it: ▸ start work, or work it by hand.' };
    case 'review':
      if (pr && prVerdict(t) === 'red') return { who: 'you or an agent', cls: 'bad', what: 'Changes were requested on the PR — ↻ act on PR, then review again.' };
      if (counts && counts.reported) return { who: 'you', cls: '', link: 'acceptance', what: `${counts.reported} criteri${counts.reported === 1 ? 'on is' : 'a are'} reported done — confirm or send back.` };
      if (!t.pr) return { who: 'you', cls: '', what: 'No pull request yet — ↑ open PR in the tools.' };
      return { who: 'you', cls: '', what: 'Review it: ◔ review PR, confirm acceptance, then drag to done to merge & clean up.' };
    case 'done': return { who: 'nobody', cls: 'calm', what: acc && acc.tracked && counts.accepted < counts.total
      ? `Delivered. ${counts.total - counts.accepted} criteri${counts.total - counts.accepted === 1 ? 'on was' : 'a were'} never accepted on record — Done is not acceptance.`
      : 'Delivered — nothing is waiting on anyone.' };
    default: return { who: 'you', cls: '', what: '' };
  }
}

function progressFact(t) {
  const p = (S.state.progress || {})[t.file];
  const agent = agentOnTask(t.file);
  if (!p) return agent ? 'No progress was recorded for this run.' : 'No run on this card has reported progress.';
  if ((p.channel || {}).state !== 'available') {
    return `Reporting unavailable for the latest run: ${(p.channel || {}).why || 'it was given no progress channel'}.`;
  }
  const c = p.current;
  const said = c ? (c.doing || c.narrative || (c.done || [])[0] || '') : '';
  if (p.active) {
    if (!c) return 'The run is working and has sent no progress update yet.';
    return `agent-reported, ${ago(p.lastReport)} ago — ${said}${c.blocked ? ` · Blocked: ${c.blocked}` : ''}`;
  }
  // a finished run is history: its last words are never "doing now"
  return `The latest run ${ENDED_WORDS[p.outcome] || 'ended'}${p.closed ? ' ' + ago(p.closed) + ' ago' : ''}.` +
    (said ? ` It last said (history, not current): ${said}` : ' It sent no progress update.');
}

function roundLine(r) {
  const word = { APPROVE: 'approved', 'REQUEST CHANGES': 'asked for changes' }[r.verdict] || 'gave no verdict';
  return `${r.reviewer || 'A reviewer'} ${word}${r.commit ? ' at ' + r.commit.slice(0, 12) : ''}, ${r.at}` +
    (r.label !== 'current-at-the-time' ? ` (${r.label})` : '');
}

/* What has happened since a review round: the PR updates filed after it
   and the findings opened against it, by state. An earlier request for
   changes is explained, never silently turned into approval. */
function sinceRound(r, acc) {
  const later = (acc.reports || []).filter(x => /^PR update/.test(x.kind) && whenOf(x.at) > whenOf(r.at));
  const mine = (acc.findings || []).filter(f => f.round === r.id);
  const bits = [];
  if (later.length) bits.push(`${later.length} PR update${later.length === 1 ? '' : 's'} since`);
  for (const [state, word] of [['open', 'open'], ['fix-reported', 'fix reported'], ['resolved', 'resolved']]) {
    const n = mine.filter(f => f.state === state).length;
    if (n) bits.push(`${n} finding${n === 1 ? '' : 's'} ${word}`);
  }
  return bits.join(' · ');
}

function overviewHtml(t, acc, failBlock, signals, plan, members) {
  const step = nextStep(t, acc);
  const counts = acc ? acc.counts : null;
  const last = acc && acc.rounds.length ? acc.rounds[acc.rounds.length - 1] : null;
  const link = (tab, text) => `<button class="dlink" data-goto="${tab}">${esc(text)}</button>`;
  const accFact = !acc ? 'reading…'
    : !acc.tracked ? `${link('acceptance', 'Acceptance results not recorded')}`
    : `${link('acceptance', `${counts.accepted} of ${counts.total} accepted`)}` +
      ['reported', 'pending', 'needs-work', 'recheck'].filter(k => counts[k])
        .map(k => ` · ${counts[k]} ${esc(acc.states[k])}`).join('');
  const fc = acc ? acc.findingCounts : null;
  const findFact = !acc ? 'reading…'
    : !acc.findings.length ? (acc.rounds.length ? 'No findings recorded against the reviews.' : '')
    : `${link('reviews', `${fc.open} open`)} · ${fc['fix-reported']} fix reported · ${fc.resolved} resolved`;
  const fact = (dt, dd) => dd ? `<dt>${dt}</dt><dd>${dd}</dd>` : '';
  return failBlock +
    `<div class="dnext ${step.cls}" aria-label="Next step"><span class="who">next · ${esc(step.who)}</span>` +
    `${esc(step.what)}${step.link ? ' ' + link(step.link, 'Go there') : ''}</div>` +
    `<dl class="dfacts">` +
    fact('Stage', esc(STAGE_WORDS[t.stage] || t.stage) + (t.assignee ? ` · held by ${esc(t.assignee)}` : '')) +
    fact('Progress', esc(progressFact(t))) +
    fact('Acceptance', accFact) +
    fact('Findings', findFact) +
    fact('Last review', last ? esc(roundLine(last)) +
      (sinceRound(last, acc) ? ` — ${esc(sinceRound(last, acc))}` : '') +
      ` · ${link('reviews', 'rounds')}` : '') +
    `</dl>` +
    (last ? `<p class="dnote">A reviewer's verdict is about the revision it names. GitHub's formal approval and Bench's own verdict are separate facts, in Signals below.</p>` : '') +
    signals + members +
    `<h3>Tools</h3><div id="drawertools"><p class="dnote">This card has no tools in its current stage.</p></div>` +
    (plan ? `<details class="rpt"${S.accOpen[t.file + ':plan'] ? ' open' : ''} data-keep="plan">` +
            `<summary>Branch and plan</summary><div style="padding:6px 10px">${plan}</div></details>` : '');
}

function briefHtml(t) {
  const parts = cardSplit(t.body);
  const head = parts.head.replace(/^\s*#\s[^\n]*\n?/, '');
  return `<div class="dbody">${md(head + '\n' + withoutDiscussion(parts.brief))}</div>` +
    `<p class="dnote">The brief is the requirement. Earlier wordings are in the card's history: ` +
    `each applied refinement is a decision in the discussion below, and the card's git history ` +
    `holds every previous text.</p>`;
}

function evidenceOptions(t, draft) {
  const e = S.evidence[t.file];
  if (!e) { fetchEvidence(t.file, t.stage).then(() => { if (S.selected && S.selected.file === t.file) renderDrawer(); }); }
  const passed = ((e && e.evidence) || []).filter(r => r.outcome === 'passed');
  const chosen = S.accDraft[draft] || '';
  return `<option value="">none — a person's confirmation, with a note</option>` +
    passed.map(r => `<option value="${esc(r.id)}"${chosen === r.id ? ' selected' : ''}>` +
      `${esc(r.check)}${r.scope ? ' · ' + esc(r.scope) : ' · full run'} · passed` +
      `${(r.source || {}).commit ? ' at ' + esc(r.source.commit.slice(0, 12)) : ''} · ${esc(r.id)}</option>`).join('');
}

function recordHtml(r) {
  const word = { accepted: 'accepted', 'needs-work': 'needs work', recheck: 'recheck requested',
                 pending: 'reset to pending', reported: 'reported' }[r.state] || r.state;
  const src = { manual: 'confirmed by a person', evidence: 'mapped to bench evidence',
                tracked: 'tracking started', 'legacy-tick': 'ticked by hand before tracking' }[r.source] || r.source;
  return `<div class="arec"><b>${esc(word)}</b> · ${esc(src)} · ${esc(r.actor || 'unattributed')}` +
    `${r.actorSource === 'os-user' ? ' (OS user)' : ''} · ${esc(stampOf(r.at))}` +
    (r.evidence ? `<br>evidence ${esc(r.evidence)} — ${esc(r.check || '')}${r.scope ? ' · ' + esc(r.scope) : ''}` : '') +
    (r.commit ? `<br><span class="ameta">at ${esc(r.commit)} · criterion revision ${esc(r.rev || '')}</span>` : `<br><span class="ameta">criterion revision ${esc(r.rev || '')}</span>`) +
    (r.note ? `<br>${esc(r.note)}` : '') +
    (r.ref ? `<br>reference: ${/^(https?:\/\/|\/files\/)/.test(r.ref)
      ? `<a href="${esc(r.ref)}" target="_blank" rel="noopener">${esc(r.ref)}</a>` : esc(r.ref)}` : '') +
    (r.recheck ? `<br><span class="bad">marked for recheck: ${esc(r.recheckReason || '')}</span>` : '') +
    `</div>`;
}

function criterionHtml(t, c) {
  const key = `${t.file}:${c.id}`;
  const open = S.accOpen[key] ?? false;
  const v = (id) => esc(S.accDraft[id] || '');
  const ev = c.evidence;
  const claim = c.claim;
  return `<details class="arow ${esc(c.state)}" data-keep="${esc(c.id)}"${open ? ' open' : ''}>` +
    `<summary><span class="abox" aria-hidden="true">${ACC_GLYPH[c.state] || ''}</span>` +
    `<span class="alabel" title="${esc(c.text)}">${esc(c.label)}</span>` +
    `<span class="aword">${esc(c.word)}</span></summary>` +
    `<div class="abody"><p class="afull">${esc(c.text)}</p>` +
    `<span class="ameta">id ${esc(c.id)} · revision ${esc(c.rev)}${c.legacyTick ? ' · ticked by hand in the brief' : ''}</span>` +
    (c.reason ? `<p class="dnote${['recheck', 'needs-work'].includes(c.state) ? ' bad' : ''}">${esc(c.reason)}</p>` : '') +
    (ev ? `<div class="arec">supporting evidence ${esc(ev.id)}: ${esc(ev.check || '')} · <b>${esc(ev.outcome)}</b>` +
          `${ev.commit ? ' at ' + esc(ev.commit) : ''} · read from bench's record now</div>` : '') +
    (claim ? `<div class="arec">${esc(claim.agent)} reported it implemented, ${esc(ago(claim.at))} ago` +
             ` — agent-reported, not a result${(claim.evidence || []).length ? ` · proposed evidence ${esc(claim.evidence.join(', '))}` : ''}</div>` : '') +
    (c.history.length ? `<h3>Record</h3>` + c.history.map(recordHtml).join('') : '<p class="dnote">Nothing recorded about it yet.</p>') +
    `<div class="aform" data-crit="${esc(c.id)}" data-rev="${esc(c.rev)}" data-basis="${esc(c.basis || '')}">` +
    `<label>Decision<select id="acc-state-${esc(c.id)}">` +
    [['accepted', 'Accept'], ['needs-work', 'Needs work'], ['recheck', 'Needs recheck'], ['pending', 'Back to pending']]
      .map(([k, w]) => `<option value="${k}"${(S.accDraft[`acc-state-${c.id}`] || 'accepted') === k ? ' selected' : ''}>${w}</option>`).join('') +
    `</select></label>` +
    `<label>Note — what you checked and how<textarea id="acc-note-${esc(c.id)}" rows="2">${v(`acc-note-${c.id}`)}</textarea></label>` +
    `<label>Reference (optional) — a screenshot, URL or file<input id="acc-ref-${esc(c.id)}" value="${v(`acc-ref-${c.id}`)}"></label>` +
    `<label>Supporting evidence (optional, for Accept)<select id="acc-ev-${esc(c.id)}">${evidenceOptions(t, `acc-ev-${c.id}`)}</select></label>` +
    `<div class="racts"><button class="dact" data-decide="${esc(c.id)}">Record decision</button></div>` +
    `<p class="dnote">Recorded as ${esc(accActor(t) || 'this board')}, against revision ${esc(c.rev)} of this criterion.</p>` +
    `</div></div></details>`;
}

function accActor(t) {
  const a = (S.acc[t.file] || {}).data;
  return a && a.actor ? a.actor.name : '';
}

function acceptanceHtml(t, acc) {
  if (!acc) {
    const c = S.acc[t.file];
    return c && c.error ? `<p class="dnote bad">${esc(c.error)}</p>` : `<p class="dnote">reading acceptance…</p>`;
  }
  const counts = acc.counts;
  const legacy = acc.untracked.map(c => `<li>${c.legacyTick ? '<b>[x]</b> ' : '[ ] '}${esc(c.text)}` +
    `${c.legacyTick ? ' <span class="ameta">ticked by hand — a legacy claim, not an acceptance</span>' : ''}</li>`).join('');
  const trackBtn = (word) => `<div class="racts"><button class="dact" id="accTrack">` +
    `${actLabel(word, 'click again — adds ids to the brief', 'tracking…')}</button></div>`;
  if (!acc.tracked) {
    return `<h3>Acceptance results not recorded</h3>` +
      (acc.untracked.length
        ? `<p class="dnote">Nothing on record says whether these criteria were met. The card's stage says nothing about it either, and nothing here is inferred from it.</p>` +
          `<ul class="chain" style="list-style:none">${legacy}</ul>` +
          trackBtn('Track acceptance') +
          `<p class="dnote">Tracking gives each criterion a stable id on its own line in the brief and records it as pending — hand-written ticks are kept, and recorded as legacy claims awaiting confirmation. It changes no wording, and it is the only thing that assigns ids; opening this view never does.</p>`
        : `<p class="dnote">This brief has no checklist criteria (lines like <code>- [ ] …</code>) to track.</p>`);
  }
  const breakdown = ['reported', 'pending', 'needs-work', 'recheck']
    .filter(k => counts[k]).map(k => `${counts[k]} ${esc(acc.states[k])}`).join(' · ');
  return `<p class="acount"><b>${counts.accepted} of ${counts.total}</b> criteria accepted` +
    `${breakdown ? ` · ${breakdown}` : ''}</p>` +
    `<p class="dnote">Accepted means a named person confirmed it, or mapped one of bench's own current passing records to it. It is not a measure of how complete the work is, and an agent's report never ticks one.</p>` +
    acc.criteria.map(c => criterionHtml(t, c)).join('') +
    (acc.untracked.length ? `<h3>New criteria, not yet tracked</h3><ul class="chain">${legacy}</ul>` +
      `<p class="dnote">They count as pending.</p>` + trackBtn('Track new criteria') : '') +
    (acc.removed.length ? `<details class="rpt"><summary>Removed from the brief (${acc.removed.length}) — history, not counted</summary>` +
      `<div style="padding:6px 10px">` + acc.removed.map(r => `<p class="afull">${esc(r.text || r.id)}</p>` +
        r.history.map(recordHtml).join('')).join('') + `</div></details>` : '');
}

function findingHtml(t, f, acc) {
  const key = `${t.file}:${f.id}`;
  const open = S.accOpen[key] ?? (f.state !== 'resolved');
  const round = acc.rounds.find(r => r.id === f.round);
  const crit = acc.criteria.find(c => c.id === f.criterion);
  const eventWord = { opened: 'found', 'fix-reported': 'fix reported', resolved: 'resolved', reopened: 'reopened' };
  const acts = { open: [['fix-reported', 'Report fix'], ['resolved', 'Resolve']],
                 'fix-reported': [['resolved', 'Resolve after recheck'], ['reopened', 'Reopen']],
                 resolved: [['reopened', 'Reopen']] }[f.state];
  return `<details class="arow ${esc(f.state)}" data-keep="${esc(f.id)}"${open ? ' open' : ''}>` +
    `<summary><span class="abox" aria-hidden="true">${f.state === 'resolved' ? '✓' : f.state === 'open' ? '!' : '·'}</span>` +
    `<span class="alabel">${esc(f.text)}</span><span class="aword">${esc(f.word)}</span></summary>` +
    `<div class="abody">` +
    `<span class="ameta">${esc(f.id)}${round ? ' · from ' + esc(roundLine(round)) : ''}</span>` +
    (crit ? `<span>About: <button class="dlink" data-goto="acceptance">${esc(crit.label)}</button> (${esc(crit.word)})</span>` : '') +
    (f.criterionRemoved ? `<span class="dnote">The criterion it was about has since been removed from the brief.</span>` : '') +
    `<ol class="chain">` + f.events.map(e => `<li class="${esc(e.event)}"><b>${esc(eventWord[e.event] || e.event)}</b>` +
      ` · ${esc(e.actor || 'unattributed')} · ${esc(stampOf(e.at))}` +
      (e.commit ? ` · at ${esc(e.commit)}` : '') +
      (e.event === 'opened' ? '' : e.note ? `<br>${esc(e.note)}` : '') +
      (e.evidenceNow ? `<br>evidence ${esc(e.evidenceNow.id)}: ${esc(e.evidenceNow.check || '')} · <b>${esc(e.evidenceNow.outcome)}</b> (read now)` : '') +
      `</li>`).join('') + `</ol>` +
    `<div class="aform" data-finding="${esc(f.id)}" data-basis="${esc(f.basis || '')}">` +
    `<label>Note — the fix, or on what authority it is resolved<textarea id="fnd-note-${esc(f.id)}" rows="2">${esc(S.accDraft[`fnd-note-${f.id}`] || '')}</textarea></label>` +
    (f.state !== 'resolved' ? `<label>Supporting evidence (optional)<select id="fnd-ev-${esc(f.id)}">${evidenceOptions(t, `fnd-ev-${f.id}`)}</select></label>` : '') +
    `<div class="racts">` + acts.map(([ev, w]) => `<button class="dact" data-event="${ev}">${esc(w)}</button>`).join('') + `</div>` +
    `<p class="dnote">A reported fix keeps the finding open until somebody rechecks it. An agent's later update never resolves it, and resolving it here is not formal PR approval.</p>` +
    `</div></div></details>`;
}

function reviewsHtml(t, acc) {
  if (!acc) return `<p class="dnote">reading reviews…</p>`;
  const live = acc.findings.filter(f => f.state !== 'resolved');
  const done = acc.findings.filter(f => f.state === 'resolved');
  const rounds = [...acc.rounds].reverse();
  const roundHtml = (r, open) => `<details class="rpt" data-keep="${esc(r.id)}"${(S.accOpen[`${t.file}:${r.id}`] ?? open) ? ' open' : ''}>` +
    `<summary><b>${esc(roundLine(r))}</b>${sinceRound(r, acc) ? `<span class="dnote">${esc(sinceRound(r, acc))}</span>` : ''}` +
    `<span class="ameta">${esc(r.id)}</span></summary><pre class="rtext">${esc(r.report)}</pre></details>`;
  const fc = acc.findingCounts;
  return `<p class="acount"><b>${fc.open}</b> open · <b>${fc['fix-reported']}</b> fix reported · <b>${fc.resolved}</b> resolved</p>` +
    (live.length ? live.map(f => findingHtml(t, f, acc)).join('')
                 : `<p class="dnote">No open findings on record.</p>`) +
    `<details class="rpt" data-keep="newfinding"${S.accOpen[`${t.file}:newfinding`] ? ' open' : ''}><summary>Record a finding</summary>` +
    `<div class="aform" style="padding:0 10px 10px" data-newfinding="1">` +
    `<label>What was found<textarea id="fnd-text" rows="2">${esc(S.accDraft['fnd-text'] || '')}</textarea></label>` +
    `<label>From review round<select id="fnd-round"><option value="">none</option>` +
    rounds.map(r => `<option value="${esc(r.id)}"${S.accDraft['fnd-round'] === r.id ? ' selected' : ''}>${esc(roundLine(r))}</option>`).join('') + `</select></label>` +
    `<label>About criterion (optional)<select id="fnd-crit"><option value="">none — not every concern is a criterion</option>` +
    acc.criteria.map(c => `<option value="${esc(c.id)}"${S.accDraft['fnd-crit'] === c.id ? ' selected' : ''}>${esc(c.label)}</option>`).join('') + `</select></label>` +
    `<div class="racts"><button class="dact" id="fndOpen">Record finding</button></div></div></details>` +
    (done.length ? `<details class="rpt" data-keep="resolved"${S.accOpen[`${t.file}:resolved`] ? ' open' : ''}><summary>Resolved findings (${done.length})</summary>` +
      `<div style="padding:6px 10px;display:flex;flex-direction:column;gap:6px">${done.map(f => findingHtml(t, f, acc)).join('')}</div></details>` : '') +
    `<h3>Review rounds</h3>` +
    (rounds.length ? roundHtml(rounds[0], true) +
      (rounds.length > 1 ? `<details class="rpt" data-keep="oldrounds"${S.accOpen[`${t.file}:oldrounds`] ? ' open' : ''}><summary>Earlier rounds (${rounds.length - 1})</summary>` +
        `<div style="padding:6px 10px;display:flex;flex-direction:column;gap:6px">${rounds.slice(1).map(r => roundHtml(r, false)).join('')}</div></details>` : '')
      : `<p class="dnote">No PR review has been filed on this card.</p>`) +
    `<p class="dnote">A round's verdict is about the revision it names. A request for changes stays what it was; what happened after it is the fixes and resolutions above, and formal GitHub approval is a separate fact in Overview's Signals.</p>`;
}

function activityHtml(t, acc) {
  const items = [];
  const p = (S.state.progress || {})[t.file];
  if (p) {
    fetchProgress(p.agent);
    const full = progressOf(p.agent, t.file);
    for (const e of ((full && full.history) || (p.current ? [p.current] : []))) {
      const said = [e.stage, e.doing, ...(e.done || []).map(d => 'done: ' + d), e.blocked ? 'blocked: ' + e.blocked : '',
                    (e.criteria || []).length ? 'reports criteria ' + e.criteria.join(', ') : ''].filter(Boolean).join(' · ');
      items.push({ at: whenOf(e.at), src: 'agent-reported', text: said || e.narrative || '' });
    }
  }
  if (acc) {
    for (const r of acc.reports) items.push({ at: whenOf(r.at), src: `${r.kind}${r.by ? ' · ' + r.by : ''}`,
      report: r.text, key: `rep:${r.kind}|${r.at}|${r.by}` });
    for (const c of [...acc.criteria, ...acc.removed]) {
      for (const r of c.history) items.push({ at: whenOf(r.at), src: `acceptance · ${r.actor || ''}`,
        text: `${r.state} — ${(c.label || r.text || c.id)}${r.note ? ': ' + r.note : ''}` });
    }
    for (const f of acc.findings) {
      for (const e of f.events) items.push({ at: whenOf(e.at), src: `finding · ${e.actor || ''}`,
        text: `${e.event} — ${f.text}${e.event !== 'opened' && e.note ? ': ' + e.note : ''}` });
    }
  }
  const disc = ((S.disc[t.file] || {}).data || {}).entries || [];
  for (const e of disc) items.push({ at: whenOf(e.at), src: `${e.kind === 'decision' ? 'decision ' + (e.outcome || '') : 'comment'} · ${e.author || ''}`, text: e.body || '' });
  items.sort((a, b) => b.at - a.at);
  // a report's key is what it is, never where it sits: a record arriving
  // above it must not open, close or move a different one
  const row = (it) => it.report
    ? `<details class="rpt" data-keep="${esc(it.key)}"${S.accOpen[`${t.file}:${it.key}`] ? ' open' : ''}><summary><b>${esc(it.src)}</b>` +
      `<span class="ameta">${esc(it.at ? new Date(it.at).toLocaleString() : '')}</span></summary>` +
      `<pre class="rtext">${esc(it.report)}</pre></details>`
    : `<div class="tl"><time>${esc(it.at ? new Date(it.at).toLocaleString() : '—')}</time>` +
      `<span><span class="src">${esc(it.src)}</span><div class="tx">${esc(it.text)}</div></span></div>`;
  return `<p class="dnote">Newest first: progress the runs reported (labelled as theirs), work reports and reviews, comments and decisions, and acceptance and finding records. Raw reads, edits and commands are technical detail, in the Sessions view.</p>` +
    (items.length ? `<div class="tline">${items.map(row).join('')}</div>` : `<p class="dnote">Nothing has happened on this card yet.</p>`);
}

async function postAcc(t, url, payload) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify(payload) });
  let data = {};
  try { data = await res.json(); } catch { /* an empty reply is a refusal too */ }
  if (!res.ok) {
    toast(data.error || 'the board refused that', true);
    if (data.stale) loadAcc(t, true);
    return null;
  }
  loadAcc(t, true);
  loadState();
  return data;
}

function wireDetail(t) {
  const body = $('#drawerbody');
  const tabs = [...body.querySelectorAll('.dtabs [role="tab"]')];
  const go = (key, focus) => {
    S.dtab[t.file] = key;
    renderDrawer();
    if (focus) requestAnimationFrame(() => { const b = document.getElementById('dtab-' + key); if (b) b.focus(); });
  };
  tabs.forEach((btn, i) => {
    btn.addEventListener('click', () => go(btn.dataset.tab, true));
    btn.addEventListener('keydown', (e) => {
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      go(tabs[(to + tabs.length) % tabs.length].dataset.tab, true);
    });
  });
  body.querySelectorAll('[data-goto]').forEach(btn => btn.addEventListener('click', () => go(btn.dataset.goto, true)));
  $('#dwide').addEventListener('click', () => { S.dwide = !S.dwide; renderDrawer(); $('#dwide').focus(); });
  // open/closed folds and unsent text survive a live redraw
  body.querySelectorAll('details[data-keep]').forEach(d => d.addEventListener('toggle', () => {
    S.accOpen[`${t.file}:${d.dataset.keep}`] = d.open;
  }));
  body.querySelectorAll('.dsec textarea[id], .dsec input[id], .dsec select[id]').forEach(el => {
    if (el.id === 'commentbox') return;
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { S.accDraft[el.id] = el.value; });
  });
  const acc = (S.acc[t.file] || {}).data;
  body.querySelectorAll('#accTrack').forEach(btn => wireAction(btn, `${t.file}::acc-track`, {
    label: 'Track acceptance', confirm: true,
    run: async () => {
      if (!acc) return false;
      const data = await postAcc(t, '/api/card/acceptance/track',
        { file: t.file, stage: t.stage, briefSha: acc.briefSha, request: newRequestKey() });
      if (!data) return false;
      toast(`tracking ${data.tracked.length} criteria` + (data.committed ? '' : ' — written to the card, not committed'));
      return true;
    },
  }));
  body.querySelectorAll('[data-decide]').forEach(btn => btn.addEventListener('click', async () => {
    const form = btn.closest('.aform');
    const cid = form.dataset.crit;
    const payload = { file: t.file, stage: t.stage, criterion: cid, rev: form.dataset.rev,
      basis: form.dataset.basis || null, state: $(`#acc-state-${cid}`).value,
      note: $(`#acc-note-${cid}`).value, ref: $(`#acc-ref-${cid}`).value,
      evidence: $(`#acc-ev-${cid}`).value || null, request: newRequestKey() };
    btn.disabled = true;
    const data = await postAcc(t, '/api/card/acceptance/decide', payload);
    btn.disabled = false;
    if (!data) return;
    for (const k of ['state', 'note', 'ref', 'ev']) delete S.accDraft[`acc-${k}-${cid}`];
    toast(data.duplicate ? 'that decision was already recorded' : `recorded: ${payload.state}`);
  }));
  body.querySelectorAll('[data-finding] [data-event]').forEach(btn => btn.addEventListener('click', async () => {
    const form = btn.closest('.aform');
    const fid = form.dataset.finding;
    const ev = form.querySelector('select');
    const payload = { file: t.file, stage: t.stage, event: btn.dataset.event, finding: fid,
      basis: form.dataset.basis || null, note: $(`#fnd-note-${fid}`).value,
      evidence: (ev && ev.value) || null, request: newRequestKey() };
    btn.disabled = true;
    const data = await postAcc(t, '/api/card/finding', payload);
    btn.disabled = false;
    if (!data) return;
    delete S.accDraft[`fnd-note-${fid}`];
    toast(`finding ${fid}: ${payload.event}`);
  }));
  const open = $('#fndOpen');
  if (open) open.addEventListener('click', async () => {
    const payload = { file: t.file, stage: t.stage, event: 'opened', text: $('#fnd-text').value,
      round: $('#fnd-round').value || null, criterion: $('#fnd-crit').value || null,
      request: newRequestKey() };
    open.disabled = true;
    const data = await postAcc(t, '/api/card/finding', payload);
    open.disabled = false;
    if (!data) return;
    for (const k of ['fnd-text', 'fnd-round', 'fnd-crit']) delete S.accDraft[k];
    toast('finding recorded');
  });
}

/* The card face's acceptance and findings chips: a count of criteria a
   named person accepted (never a completion ratio) and the findings still
   open. Each opens its section of the detail view. */
function acceptanceChips(task) {
  const a = ((S.state || {}).acceptance || {})[task.file];
  if (!a) return [];
  const out = [];
  if (a.tracked) {
    const behind = a.needsWork + a.recheck;
    const parts = [['reported', a.reported], ['pending', a.pending], ['needing work', a.needsWork],
                   ['needing recheck', a.recheck]].filter(([, n]) => n).map(([w, n]) => `${n} ${w}`);
    out.push({ label: `${a.accepted}/${a.total} accepted`, pre: '☑', cls: behind ? 'bad' : '',
      section: 'acceptance', face: true,
      title: `${a.accepted} of ${a.total} criteria accepted on record${parts.length ? ' — ' + parts.join(', ') : ''}. Not a measure of completion.` });
  }
  if (a.openFindings || a.fixReported) {
    out.push({ label: a.openFindings ? `${a.openFindings} open finding${a.openFindings === 1 ? '' : 's'}`
                                     : `${a.fixReported} fix${a.fixReported === 1 ? '' : 'es'} to recheck`,
      pre: '◇', cls: a.openFindings ? 'bad' : 'accent', section: 'reviews', face: true,
      title: 'Review findings on record — open the Reviews section' });
  }
  return out;
}

/* ── a card's discussion, and refining its brief (task 65) ─────────────

   Three actions, deliberately three. **Add comment** saves text to the
   card and starts nothing. **✎ Update card with agent** saves the text (or
   picks a comment already there) and asks for one refinement — armed,
   because it costs tokens. A proposal is a diff and an explanation, and
   the brief changes only on **Apply**; **Discard** records the decision
   and changes nothing. Every word a person or an agent wrote is drawn as
   text through esc(), never as markup. The panel reads
   /api/card/discussion — a GET that starts nothing — and re-reads it
   whenever the card file or its refinement state changes. */
const DISCUSSION_SECTION = /^## Discussion[ \t]*$[\s\S]*?(?=^## |(?![\s\S]))/m;
function withoutDiscussion(body) {
  return String(body || '').replace(DISCUSSION_SECTION, '');
}

const JOB_WORD = {
  queued: ['queued', ''], running: ['refining…', ''],
  proposed: ['proposal — not applied', ''], failed: ['failed', 'bad'],
  cancelled: ['cancelled', ''], applied: ['applied', 'good'],
  discarded: ['discarded', ''], superseded: ['superseded by a newer attempt', ''],
};

function newRequestKey() {
  return (crypto.randomUUID ? crypto.randomUUID()
                            : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
}

function discStamp(t) {
  const r = (S.state.refinements || {})[t.file];
  return `${t.stage}:${t.mtime}:${r ? r.id + r.status : '-'}:` +
    `${agentOnTask(t.file) ? agentOnTask(t.file).id : '-'}`;
}

function loadDiscussion(t, force) {
  const cur = S.disc[t.file] || {};
  // a read already in flight may have read the card before the write that
  // asked for this one, so the request is kept and made when it ends —
  // dropping it is how a saved comment never appeared
  if (cur.loading) {
    if (force || cur.loadingStamp !== discStamp(t)) S.disc[t.file] = { ...cur, again: t };
    return;
  }
  if (!force && cur.stamp === discStamp(t)) return;
  const stamp = discStamp(t);
  S.disc[t.file] = { ...cur, loading: true, loadingStamp: stamp, again: null };
  fetch(`/api/card/discussion?file=${encodeURIComponent(t.file)}` +
        `&stage=${encodeURIComponent(t.stage)}`)
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => ok ? { data, stamp } : { data: cur.data, error: data.error, stamp })
    .catch(() => ({ data: cur.data, stamp, error: 'the board could not be asked' }))
    .then(next => {
      const again = (S.disc[t.file] || {}).again;
      S.disc[t.file] = next;
      if (again) loadDiscussion(again, true);
      if (S.selected && S.selected.file === t.file) renderDiscussion(S.selected);
    });
}

function diffHtml(diff) {
  const mark = { '+': '+', '-': '−', ' ': ' ', '…': '⋯' };
  return `<pre class="rdiff" aria-label="proposed change to the brief">` +
    (diff || []).map(d => `<span class="d d${{ '+': 'add', '-': 'del', ' ': 'eq', '…': 'gap' }[d.op] || 'eq'}">` +
      `${mark[d.op] || ' '} ${esc(d.text)}</span>`).join('\n') + `</pre>`;
}

function jobHtml(job, t) {
  const [word, cls] = JOB_WORD[job.status] || [job.status, ''];
  const who = job.name ? `${esc(job.name)} · ` : '';
  let out = `<div class="rjob ${cls}" data-job="${esc(job.id)}">` +
    `<div class="rhead"><span class="rstate">${esc(word)}</span>` +
    `<span class="mono">${who}${esc(job.id)}${job.attempt > 1 ? ` · attempt ${job.attempt}` : ''}</span></div>`;
  if (job.status === 'queued' || job.status === 'running') {
    out += `<p>Reading the card and the code. It proposes; nothing changes until you apply it.</p>` +
      `<div class="racts"><button class="dact" data-act="cancel">Cancel</button></div>`;
  } else if (job.status === 'proposed') {
    const fresh = job.fresh || { fresh: true };
    out += `<p class="rexpl">${esc(job.explanation)}</p>` +
      (job.noChange ? `<p class="dnote">It proposes no change to the brief.</p>` : '') +
      (job.sections && job.sections.length
        ? `<p class="dnote">Touches: ${esc(job.sections.join(', '))}` +
          (job.affected && job.affected.length
            ? ` · acceptance records to recheck: ${esc(job.affected.join(', '))}` : '') + `</p>`
        : '') +
      diffHtml(job.diff) +
      (fresh.fresh
        ? `<div class="racts"><button class="dact" data-act="apply">` +
          `${actLabel('Apply to the brief', 'click again — rewrites the brief', 'applying…')}</button>` +
          `<button class="dact" data-act="discard">Discard</button></div>` +
          `<p class="dnote">Kept on this board until you decide; the brief is unchanged.</p>`
        : `<div class="well bad"><span class="lead">·</span><div class="wbody">` +
          `<b>stale</b> — ${esc(fresh.why)}. It cannot be applied.</div></div>` +
          `<div class="racts"><button class="dact" data-act="retry">` +
          `${actLabel('↻ Regenerate', 'click again — asks an agent', 'asking…')}</button>` +
          `<button class="dact" data-act="discard">Discard</button></div>`);
  } else if (job.status === 'failed' || job.status === 'cancelled') {
    out += `<p>${esc(job.error || '')}</p>` +
      (job.refused && job.refused.length > 1
        ? `<ul class="dnote">${job.refused.slice(1).map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '') +
      `<p class="dnote">Nothing was applied.</p>` +
      `<div class="racts"><button class="dact" data-act="retry">` +
      `${actLabel('↻ Retry', 'click again — asks an agent', 'asking…')}</button></div>`;
  } else if (job.decidedBy) {
    out += `<p class="dnote">by ${esc(job.decidedBy)} · ${esc(job.decidedAt || '')}` +
      `${job.committed === false ? ' · written, not committed' : ''}</p>`;
  }
  return out + `</div>`;
}

function discussionLive(t) {
  const c = S.disc[t.file];
  if (!c || !c.data) {
