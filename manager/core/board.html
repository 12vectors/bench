    ? `Ticket sync publishes this card's move to the separate ticket repository only; it does ` +
      `not merge or push application code.` : '';
  return { ship, tickets };
}

async function completeSheet(task, from) {
  // read before anything is drawn: the sheet describes the completion that
  // would run, and a sheet that guessed would be the bug this replaced
  let facts = null, factsError = '';
  try {
    const res = await fetch(`/api/task/completion?file=${encodeURIComponent(task.file)}` +
                            `&stage=${encodeURIComponent(from)}`);
    const data = await res.json();
    if (res.ok) facts = data; else factsError = data.error || 'it could not be read';
  } catch (e) { factsError = 'the board did not answer'; }
  const d = S.state.drive;
  const driving = d && d.task === task.file && ['starting', 'up'].includes(d.status);
  // A phase card stands for cards the Board does not draw, so the sheet
  // has to say what merging it does to them: the ones it merged go to
  // done/ with it and their workspaces go too. Counted the way the lane
  // counts them, from the runner's reading and the phase's own log.
  const swept = task.isPhase ? mergedIn(task).size : 0;
  // And what this board's acceptance gate says, before the button that
  // the server will refuse. One reading, so the sheet and the refusal
  // give one reason — and said here rather than only in the toast
  // afterwards, because "merge" is the click a person should not have to
  // make to find out.
  const gate = (S.state.gates || {})[task.file];
  const blocked = gate && gate.decision === 'blocked' ? gate : null;
  const words = facts ? completionWords(facts, task, driving, swept) : null;
  const pending = facts && facts.recovery;
  // a refusal the server will make anyway is said instead of a merge button:
  // a stacked card, a target that has gone, no PR to merge on origin
  const refusal = facts && facts.refusal
    ? `<div class="panel bad"><div class="phead"><span class="label">Merge &amp; clean up ` +
      `is refused here</span></div><div class="check-row fail"><span class="glyph">✕</span>` +
      `<span class="state">${esc(facts.refusal)}</span></div></div>` : '';
  const unfinished = pending
    ? `<div class="panel bad"><div class="phead"><span class="label">Merged, ` +
      `publication ${pending.publication === 'failed' ? 'failed' : 'unconfirmed'}</span></div>` +
      `<div class="check-row fail"><span class="glyph">✕</span><span class="name">what happened</span>` +
      `<span class="state">${esc(pending.branch)} was merged into ${esc(pending.target)} ` +
      `${pending.mode === 'origin' ? 'on GitHub' : 'in this checkout'} at ` +
      `${esc(String(pending.commit).slice(0, 12))}, and ${esc(pending.remote || 'the remote')}/` +
      `${esc(pending.target)} does not hold it: ${esc(pending.detail || pending.publication)}. ` +
      `Nothing was rolled back, nothing was cleaned up, and the card stayed in review/.</span></div>` +
      `<div class="check-row"><span class="glyph">·</span><span class="name">what to do</span>` +
      `<span class="state">${pending.diverged
        ? `${esc(pending.remote)}/${esc(pending.target)} has commits this checkout does not — ` +
          `bring them into ${esc(pending.target)} (pull, then merge; never force), then retry. `
        : 'Resolve what the remote refused (a protection rule, access, the network), then retry. '}` +
      `The retry checks the remote first and does not merge twice.</span></div>` +
      `<div class="check-row"><span class="glyph">·</span><span class="name">settled by hand?</span>` +
      `<span class="state"><button id="sh-forget" class="linkish">Discard this record</button> ` +
      `— changes nothing in git; use it once you have decided what the unfinished merge means.` +
      `</span></div></div>` : '';
  const wrap = $('#sheetwrap');
  wrap.innerHTML =
    `<div class="sheet">` +
    `<div class="stitle"><span>${esc(task.title)}</span>` +
    `<span class="mono">${task.number ? '#' + esc(task.number) + ' · ' : ''}→ done</span></div>` +
    (blocked
      ? `<div class="panel bad"><div class="phead"><span class="label">` +
        `Its ${esc(blocked.scope)} gate is unmet</span></div>` +
        `<div class="check-row fail"><span class="glyph">✕</span>` +
        `<span class="name">${esc(blocked.unmet.map(u => u.name).join(', '))}` +
        `</span><span class="state">${esc(blocked.summary)}</span></div>` +
        `<div class="check-row"><span class="glyph">·</span>` +
        `<span class="name">what happens</span><span class="state">Merge &amp; ` +
        `clean up is refused for this reason — the card, its branch and its ` +
        `worktree are left exactly as they are. The ⚖ chip has the remedy.` +
        `</span></div></div>`
      : '') +
    unfinished + refusal +
    (factsError
      ? `<p>Bench could not say beforehand how this card would be completed (${esc(factsError)}). ` +
        `The server still decides, and refuses rather than guesses.</p>` : '') +
    `<p>This task has ${task.pr ? 'a PR and ' : ''}a branch with work on it. What should happen?</p>` +
    `<div class="sbtns">` +
    `<button id="sh-keep">Keep it where it is<small>Nothing moves, nothing changes.</small></button>` +
    `<button id="sh-move">Just move the card<small>Only the ticket moves: no merge, no push, no ` +
    `cleanup. The branch${task.pr ? ', PR' : ''} and worktree stay as they are` +
    `${task.isPhase ? ", and so does every card in the phase" : ''} — ` +
    `and done/ here is not a record that the code was published.</small></button>` +
    (facts && facts.refusal ? '' :
      `<button id="sh-ship" class="shipit">${pending ? 'Retry publication &amp; clean up' : 'Merge &amp; clean up'}` +
      `<small>${words ? words.ship : 'Merge, publish, clean up and move the card, as this board is configured to.'}` +
      `${words && words.tickets ? ' ' + words.tickets : ''}</small></button>`) +
    `</div></div>`;
  wrap.classList.add('open');
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
  $('#sh-keep').addEventListener('click', closeSheet);
  $('#sh-move').addEventListener('click', () => { closeSheet(); rawMove(task.file, from, 'done'); });
  const forget = $('#sh-forget');
  if (forget) forget.addEventListener('click', async () => {
    // armed: the first click says what it does, the second does it
    if (!forget.dataset.armed) { forget.dataset.armed = '1'; forget.textContent = 'Discard it — click again'; return; }
    closeSheet();
    const res = await fetch('/api/task/complete/forget', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: task.file }),
    });
    const data = await res.json();
    toast(res.ok ? `${task.file}: record discarded — nothing in git changed` : (data.error || 'could not discard it'), !res.ok);
    await loadState();
  });
  const ship = $('#sh-ship');
  if (ship) ship.addEventListener('click', async () => {
    closeSheet();
    toast(`Completing ${task.file} — the card shows each step`);
    const res = await fetch('/api/task/complete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: task.file, from }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'completion failed — the card stays', true); }
    else if (data.published === false && data.publication &&
             data.publication.state !== 'local-only') {
      /* merged, not delivered: say what already happened and what did not,
         and never call it done — the card is still in review/ */
      const p = data.publication;
      toast(`${task.file} merged into ${p.target} at ${String(p.commit).slice(0, 12)}, but ` +
            `publication failed or is unconfirmed — ${p.remote || 'the remote'}/${p.target} does not ` +
            `hold it (${p.detail}). Nothing was cleaned up; the card stays in review/. ` +
            `Resolve it, then drag to done/ to retry.`, true);
    } else {
      const went = (data.swept || []).length;
      const kept = (data.kept || []).length;
      /* `merged` says a commit landed, not that the card is accepted: a
         branch that moved past the gated commit leaves the card where it
         was, and the toast must not say done/ about it. */
      if (data.partial) {
        toast(`${task.file} partly completed — ${String(data.unmerged.merged).slice(0, 12)} ` +
              `merged, but ${data.unmerged.branch} has moved on and is not merged; ` +
              `the card stays in ${data.stage}/`, true);
      } else {
        const local = data.publication && data.publication.state === 'local-only';
        const notes = (data.cleanup && data.cleanup.notes) || [];
        toast((data.merged ? `${task.file} merged${local ? ' locally (no remote — nothing published)' : ' and published'}` +
                (notes.length ? `; kept — ${notes.join('; ')}` : ', cleaned up') +
                (went ? ` — ${went} card${went === 1 ? '' : 's'} went to done/ with it` : '')
              : `${task.file} moved to done`) +
              (kept ? ` · ${kept} card${kept === 1 ? '' : 's'} moved on since the phase ` +
                      `merged ${kept === 1 ? 'it' : 'them'} and stay${kept === 1 ? 's' : ''} put` : ''),
              kept > 0 || notes.length > 0);
      }
    }
    await loadState();
  });
}

/* Joining a phase is a choice between a few named options, so it is put in
   front of you the way finishing a card with work on it is — a short list
   of phases, each saying what it already holds, rather than a guess. What
   it writes is one line at the end of that phase's `## Cards`; the card
   itself does not move, and says nothing about the phase it joined. */
function phaseSheet(task) {
  const phases = joinablePhases(task);
  if (!phases.length) { toast('no phase is waiting in to-do/', true); return; }
  const wrap = $('#sheetwrap');
  wrap.innerHTML =
    `<div class="sheet">` +
    `<div class="stitle"><span>${esc(task.title)}</span>` +
    `<span class="mono">${task.number ? '#' + esc(task.number) + ' · ' : ''}⟶ phase</span></div>` +
    `<p>Which phase runs this card? It goes at the end of that phase's list. ` +
    `The card stays in ${esc(task.stage)}/ — joining a phase is not a commitment to start it.</p>` +
    `<div class="sbtns">` +
    phases.map((p, index) => {
      const held = (p.cards || []).length;
      return `<button data-pick="${index}">${esc(p.title)}` +
        `<small>${held ? `holds ${held} card${held === 1 ? '' : 's'} — this one runs after them`
                       : 'empty so far — this one would be its first card'}</small></button>`;
    }).join('') +
    `<button id="sh-nophase">Not now<small>Nothing is written.</small></button>` +
    `</div></div>`;
  wrap.classList.add('open');
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
  $('#sh-nophase').addEventListener('click', closeSheet);
  wrap.querySelectorAll('[data-pick]').forEach(btn =>
    btn.addEventListener('click', () => {
      closeSheet();
      addToPhase(task, phases[+btn.dataset.pick]);
    }));
}

async function addToPhase(task, phase) {
  const res = await fetch('/api/phase/add', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: task.file, stage: task.stage, phase: phase.file }),
  });
  const data = await res.json();
  toast(res.ok ? `${task.file} added to ${data.phaseName}`
               : (data.error || 'that card did not join'), !res.ok);
  await loadState();
  return res.ok;
}

function showDetail(task) {
  const changed = !S.selected || S.selected.file !== task.file;
  S.selected = task;
  renderCards();
  if (changed) $('#drawerbody').scrollTop = 0;
}

/* The runner's word for a member, in the vocabulary the rest of the board
   uses. `pending` is the phase simply not having reached it, which the
   stage beside it already says — so it says nothing. */
const MEMBER_STATE = { merged: 'merged in', running: 'working',
  waiting: 'checking', ready: 'ready to merge', halt: 'stopped here' };

/* A phase card answers "where is this up to" on its own face: its members
   in run order, each with the stage it is in, so the question costs no
   hunt across five columns. The runner's reading (merged in, working,
   stopped here) is added only while a phase is in flight, because only
   then is there one — and only it can tell a card that has run from one
   the phase has not reached. Each row opens that card. */
/* The card's execution plan in the drawer: where its work starts, what
   its PR targets, and what said so. Drawn only for a card that has
   something to say — a card on the application default has nothing here,
   which is also what keeps the drawer unchanged for every board that has
   never named a base. Drift is drawn in `--alarm` and says the whole
   thing, because a launch is going to refuse until it is settled. */
function planBlock(t) {
  const p = (S.state.plans || {})[t.file];
  if (!p) return '';
  const drift = (p.drift || []).length;
  const rows = drift
    ? p.drift.map(d => ['does not resolve', d, ''])
    : [['starts from', p.startBranch + (p.startCommit ? ` · ${p.startCommit.slice(0, 9)}` : ''),
        p.source],
       ['PR targets', p.prBase, p.prSource]];
  return `<div class="pmembers"><div class="phead">Execution plan` +
    `<span class="mono">${p.recorded ? (p.provenance === 'adopted'
      ? 'recorded with the run · adopted' : 'recorded with the run')
      : 'not recorded yet'}</span></div>` +
    rows.map(([k, v, why]) => `<div class="prow flat${drift ? ' bad' : ''}">` +
      `<span class="pstage">${esc(k)}</span>` +
      `<span class="ptitle mono">${esc(v)}</span>` +
      `<span class="pstage">${esc(why)}</span></div>`).join('') +
    `</div>`;
}

function phaseMembers(t) {
  if (!t.isPhase) return '';
  if (!(t.members || []).length) {
    return `<div class="pmembers"><div class="phead">Cards</div>` +
      `<div class="pempty">This phase lists no cards yet — a <code>## Cards</code> ` +
      `section, one task number per line, in the order they run.</div></div>`;
  }
  const snap = (S.state.phases || {})[t.file];
  const read = {};
  for (const m of ((snap && snap.members) || [])) read[m.file] = m;
  const rows = t.members.map((m, i) => {
    const seen = read[m.file];
    const note = seen ? MEMBER_STATE[seen.state] || '' : '';
    const tint = seen && seen.state === 'halt' ? 'var(--alarm)'
      : seen && ['running', 'waiting'].includes(seen.state) ? 'var(--accent)'
      : seen && seen.state === 'merged' ? 'var(--calm)' : '';
    return `<button class="prow" data-member="${esc(m.file)}">` +
      `<span class="pn mono">${i + 1}</span>` +
      `<span class="pref mono">#${esc(m.number || '')}</span>` +
      `<span class="ptitle">${esc(m.title)}</span>` +
      `<span class="pstage mono">${esc(m.stage)}</span>` +
      (note ? `<span class="pstate mono"${tint ? ` style="color:${tint}"` : ''}` +
              `${seen.why ? ` title="${esc(seen.why)}"` : ''}>${esc(note)}</span>` : '') +
      `</button>`;
  }).join('');
  const halt = snap && snap.halted
    ? `<div class="pempty" style="color:var(--alarm)">halted` +
      `${snap.haltedAt ? ` at #${esc(snap.haltedAt)}` : ''} — ` +
      `${esc(snap.haltedWhy || snap.halted)}</div>` : '';
  return `<div class="pmembers"><div class="phead">Cards` +
    `<span class="mono">${t.members.length} in run order</span></div>` +
    rows + halt + `</div>`;
}

/* ── settings ─────────────────────────────────────────────────────────── */

/* How this board is configured, what has actually been verified, and what
   to configure next.

   Everything drawn here is resolved by the server from the authority that
   already answers for it — `profiles.resolve()` for what a run may do,
   `profiles.gate_policy()` for what a merge must have, `verify`'s records
   for what the checks found, `gates.evaluate()` for whether a merge may
   happen. This page compiles no grant, parses no settings file and decides
   no outcome: a second reader of the same document could disagree with the
   launch, which is the one defect this view must not introduce.

   Opening it is a GET. It starts no process, runs no project command,
   launches no model, pins nothing and writes nothing. */

/* Each section: its key, its label, the sidebar group it sits in, and the
   one sentence its page leads with. Order is the sidebar's order. */
const SETTINGS_SECTIONS = [
  ['overview', 'Overview', 'Configure',
   'How this board is configured, and what to configure next.'],
  ['verification', 'Checks', 'Configure',
   'The programs your team provides to check the work. Bench runs them and records what they found.'],
  ['acceptance', 'Merge rules', 'Configure',
   'What must be true before work merges, and who may proceed over a rule.'],
  ['agents', 'Agents', 'Configure',
   'Which coding-agent harness and model each kind of run uses, and the prompt each is given.'],
  ['access', 'Agent access', 'Configure',
   'What each kind of agent run may do, and what is actually enforced.'],
  ['diagnostics', 'Diagnostics', 'Inspect',
   'Inspect the configuration without running anything, or run the execution diagnostics deliberately.'],
  ['installation', 'Installation', 'Inspect',
   'Where this board lives, how it is wired, and where each setting comes from.'],
  ['policy', 'Advanced policy', 'Advanced',
   'The whole execution policy document, field by field and as JSON.'],
];

/* The three guarded mutations, named for what merges. The scope word
   stays beside the label, because it is the key the document uses. */
const SCOPE_LABEL = {
  member: 'Phase member merge',
  integration: 'Phase acceptance',
  acceptance: 'Card merge',
};

/* The state word, always as a word. Colour carries no meaning on its own
   here: a test failure, a permission denial and an unconfigured gate must
   not collapse into "red", and "not configured" must never be able to read
   as a pass. */
function stateWord(word, states) {
  const why = (states || {})[word] || '';
  return `<span class="sw ${esc(word)}" title="${esc(why)}">${esc(word)}</span>`;
}

/* The sections that hold an editor on the one shared draft: the advanced
   policy editor, and the contextual editors in Checks and Merge rules. A
   stream repaint is held while one of them has unsaved edits in it. */
const EDITING_SECTIONS = ['policy', 'verification', 'acceptance'];

function settingsEditing() {
  if (EDITING_SECTIONS.includes(S.settingsSection) && !!(S.draft && S.draft.dirty)) return true;
  // Settings → Agents keeps a draft of its own (task 77)
  if (S.settingsSection === 'agents' && S.agentsDraft && S.agentsDraft.dirty) return true;
  // a field being typed in is an edit in progress even before it reaches
  // the draft — the JSON field only does on "use this JSON" — so a
  // background repaint must not take focus or the half-typed text from it
  const el = document.activeElement;
  return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) &&
            $('#sbody').contains(el));
}

/* Which folds in the section are open. Explanations live in folds now
   (card 76), and every repaint rebuilds them closed — so one the person
   opened would snap shut on the next SSE frame or the 30s refetch. A fold
   is known by its id, else by its summary's words, which is what a person
   recognises it by too. */
function settingsFoldKey(d) {
  const s = d.querySelector(':scope > summary');
  return d.id || (s ? s.textContent.trim() : '');
}

function openSettingsFolds(body) {
  return new Set([...body.querySelectorAll('details[open]')]
    .map(settingsFoldKey).filter(Boolean));
}

/* Whether the section being drawn carries the draft's step bar, so the
   unsaved-draft notice is shown everywhere else and never twice. */
function draftBarShown(section) {
  if (section === 'policy') return true;
  const ed = S.sedit;
  if (!ed) return false;
  return ed.kind === 'check' ? section === 'verification' : section === 'acceptance';
}

/* Which control in Settings has keyboard focus, as a selector a repaint
   can find again. Every SSE frame rebuilds the section, and a rebuilt
   button is a new element: without this a keyboard user tabbing through
   the sidebar or the rows is thrown back to the top of the document. */
function settingsFocusKey() {
  const el = document.activeElement;
  if (!el || el === document.body || !$('#view-settings').contains(el)) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  for (const a of ['ssection', 'sedit', 'sinspect', 'sdoctor', 'sdraft', 'drop', 'add',
                   'agtpl', 'agstep', 'agrender', 'agdiff', 'agreset', 'agcancel',
                   'agrestore']) {
    if (el.dataset[a] === undefined) continue;
    const name = el.dataset.sname !== undefined
      ? `[data-sname="${CSS.escape(el.dataset.sname)}"]` : '';
    return (el.closest('#snav') ? '#snav ' : '#sbody ') +
      `[data-${a}="${CSS.escape(el.dataset[a])}"]${name}`;
  }
  return null;
}

function renderSettings() {
  const focusKey = settingsFocusKey();
  renderSettingsNow();
  if (!focusKey) return;
  const again = document.querySelector(focusKey);
  if (again && document.activeElement !== again) again.focus({ preventScroll: true });
}

function renderSettingsNow() {
  if (!S.settings && !S.settingsFetching) fetchSettings();
  const head = $('#shead'), nav = $('#snav'), body = $('#sbody');
  const page = S.settings && S.settings.page;
  if (!page) {
    head.innerHTML = `<div class="s-titles"><h1>Settings</h1>` +
      `<p class="s-sub">Reading this board's configuration…</p></div>`;
    nav.innerHTML = '';
    body.innerHTML = S.settingsError
      ? `<div class="panel"><p class="bad">${esc(S.settingsError)}</p></div>`
      : `<div class="panel"><p>Resolving this board's configuration. ` +
        `Nothing is being run.</p></div>`;
    return;
  }
  const section = SETTINGS_SECTIONS.some(([k]) => k === S.settingsSection)
    ? S.settingsSection : 'overview';
  const [, title, , subtitle] = SETTINGS_SECTIONS.find(([k]) => k === section);
  head.innerHTML =
    `<div class="s-titles"><h1 id="s-title" tabindex="-1">${esc(title)}</h1>` +
    `<p class="s-sub">${esc(subtitle)}</p>` +
    `<p class="s-ident">Execution policy: ` +
    (page.overview.policy.identity
      ? `<code>${esc(page.overview.policy.identity)}</code>`
      : 'no execution policy document') + `</p></div>` +
    `<div class="s-headacts">` +
    // Diagnostics carries Check configuration as its own primary action,
    // so the page head offers it everywhere else
    (section === 'diagnostics' ? '' :
      `<button class="sb" id="s-inspect" aria-label="check configuration">` +
      `Check configuration</button>`) +
    `<button class="sb link" id="s-reread" aria-label="re-read the settings">` +
    `Re-read</button></div>`;
  // grouped as the sidebar reads, in SETTINGS_SECTIONS order; the current
  // section is marked by aria-current, its bar and its weight together
  const groups = [];
  for (const [key, label, group] of SETTINGS_SECTIONS) {
    if (!groups.length || groups[groups.length - 1].name !== group)
      groups.push({ name: group, items: [] });
    groups[groups.length - 1].items.push([key, label]);
  }
  nav.innerHTML = groups.map((g, n) =>
    `<div class="s-navgroup" role="group" aria-labelledby="snavg-${n}">` +
    `<span class="s-navhead" id="snavg-${n}">${esc(g.name)}</span>` +
    g.items.map(([key, label]) =>
      `<button data-ssection="${esc(key)}" ` +
      `aria-current="${key === section ? 'page' : 'false'}" ` +
      `aria-label="${esc(label)} settings">${esc(label)}</button>`).join('') +
    `</div>`).join('');
  nav.classList.toggle('open', !!S.settingsNavOpen);
  const toggle = $('#snavtoggle');
  toggle.setAttribute('aria-expanded', String(!!S.settingsNavOpen));
  $('#snavnow').textContent = title;
  if (!toggle.dataset.wired) {
    toggle.dataset.wired = '1';
    toggle.addEventListener('click', () => {
      S.settingsNavOpen = !S.settingsNavOpen;
      $('#snav').classList.toggle('open', S.settingsNavOpen);
      toggle.setAttribute('aria-expanded', String(S.settingsNavOpen));
    });
  }
  markScroll('v:settings', $('#view-settings'));
  // A draft is one thing however it was started, so wherever the page is
  // it says there is one — and offers the way back to it and the way out.
  const notice = S.draft && S.draft.dirty && !draftBarShown(section)
    ? `<div class="panel sdraft" role="status"><p class="lead"><b>Unsaved draft.</b> ` +
      `Nothing has been written; leaving the page discards it.</p>` +
      `<div class="acts"><button class="sb primary" data-sdraft="open" ` +
      `aria-label="return to the unsaved draft">Return to the draft</button>` +
      `<button class="sb danger" data-sdraft="discard" aria-label="discard the ` +
      `unsaved draft">Discard draft</button></div></div>`
    : '';
  // folds stay as the person left them across a repaint of the same
  // section; a different section starts with its own folds closed
  const keepOpen = body.dataset.ssection === section ? openSettingsFolds(body)
    : new Set();
  body.innerHTML = notice + settingsSection(section, page);
  body.dataset.ssection = section;
  body.querySelectorAll('details').forEach(d => {
    if (keepOpen.has(settingsFoldKey(d))) d.open = true;
  });
  restoreScroll('v:settings', $('#view-settings'));

  $('#s-reread').addEventListener('click', () => fetchSettings(true));
  // The read-only action, named for what it is. It reuses the doctor's own
  // GET — the same resolver, read at the one distance that costs nothing —
  // and renders its findings in the Diagnostics section. It runs no project
  // program and invokes no adapter hook.
  const inspect = $('#s-inspect');
  if (inspect) inspect.addEventListener('click', () => {
    S.settingsSection = 'diagnostics';
    inspectConfiguration();
    // the head's button is not drawn on Diagnostics; its heading takes focus
    $('#shead h1').focus({ preventScroll: true });
  });
  body.querySelectorAll('[data-sinspect]').forEach(btn =>
    btn.addEventListener('click', () => inspectConfiguration()));
  // a link in the content goes to another section, and focus goes with it
  // to that section's heading, so the next Tab reads on from there
  body.querySelectorAll('[data-ssection]').forEach(btn =>
    btn.addEventListener('click', () => {
      S.settingsSection = btn.dataset.ssection;
      renderSettings();
      $('#view-settings').scrollTop = 0;
      $('#shead h1').focus({ preventScroll: true });
    }));
  // Choosing from the sidebar keeps focus where the person is: on the
  // section they chose, or — below 760px, where the list closes — on the
  // button that opens it again
  nav.querySelectorAll('[data-ssection]').forEach(btn =>
    btn.addEventListener('click', () => {
      S.settingsSection = btn.dataset.ssection;
      S.settingsNavOpen = false;
      renderSettings();
      $('#view-settings').scrollTop = 0;
      const toggle = $('#snavtoggle');
      if (toggle.offsetParent !== null) toggle.focus();
      else {
        const here = $('#snav').querySelector(
          `[data-ssection="${S.settingsSection}"]`);
        if (here) here.focus();
      }
    }));
  body.querySelectorAll('[data-sedit]').forEach(btn =>
    btn.addEventListener('click', () =>
      openEditor(page, btn.dataset.sedit, btn.dataset.sname)));
  body.querySelectorAll('[data-sdraft]').forEach(btn =>
    btn.addEventListener('click', () => {
      if (btn.dataset.sdraft === 'discard') {
        S.draft = null; S.sedit = null;
        fetchSettings(true);
        toast('draft discarded — nothing was written');
        return;
      }
      S.settingsSection = S.sedit
        ? (S.sedit.kind === 'check' ? 'verification' : 'acceptance') : 'policy';
      renderSettings();
    }));
  if (body.querySelector('#s-steps')) wirePolicyEditor(page);
  if (section === 'diagnostics') wireDiagnostics();
  if (section === 'agents') wireAgents(page);
}

async function fetchSettings(force) {
  if (S.settingsFetching) return;
  if (!force && S.settings) return;
  S.settingsFetching = true;
  S.settingsError = null;
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    if (res.ok && data.settings) {
      S.settings = { at: Date.now(), page: data.settings };
      // the draft is re-read with the page: an apply that landed elsewhere
      // moved the revision, and editing on top of a stale one would be the
      // conflict the server exists to refuse
      if (!S.draft || !S.draft.dirty) S.draft = null;
    } else {
      S.settingsError = data.error || 'the settings could not be read';
    }
  } catch (e) {
    S.settingsError = e.message || 'the board could not be asked';
  } finally {
    S.settingsFetching = false;
    if (S.view === 'settings') renderSettings();
  }
}

function settingsSection(key, page) {
  if (key === 'verification') return settingsVerification(page);
  if (key === 'acceptance') return settingsAcceptance(page);
  if (key === 'access') return settingsAccess(page);
  if (key === 'agents') return settingsAgents(page);
  if (key === 'diagnostics') return settingsDiagnostics(page);
  if (key === 'installation') return settingsInstallation(page);
  if (key === 'policy') return settingsPolicy(page);
  return settingsOverview(page);
}

/* ── overview ─────────────────────────────────────────────────────────── */

/* One row of the page's common layout: what the setting is, its effective
   value with at most one short helper sentence, its state word, and the
   one action that goes somewhere specific. Problems are drawn under the
   row they are about, never collected somewhere else. */
function sline(o) {
  // an action in its register: doing something is an outlined button, and
  // going somewhere (a section) is a text link
  const action = o.inspect
    ? `<button class="sb" data-sinspect="1" aria-label="${esc(o.act)}">` +
      `${esc(o.act)}</button>`
    : o.edit
      ? `<button class="sb" data-sedit="${esc(o.edit)}" ` +
        `data-sname="${esc(o.name || '')}" aria-label="${esc(o.aria || o.act)}">` +
        `${esc(o.act)}</button>`
      : o.section
        ? `<button class="sb link" data-ssection="${esc(o.section)}" ` +
          `aria-label="${esc(o.aria || `${o.act}: ${o.label}`)}">${esc(o.act)}</button>`
        : '';
  // a value that is itself a state — Optional, Not inspected, No merge
  // requirements — is drawn as a badge in its tone, its words unchanged
  const tag = o.tag ? `<span class="sbadge ${esc(o.tag[0])}">${esc(o.tag[1])}</span>` : '';
  return `<div class="srow sline"><span class="sname${o.labelCode ? ' code' : ''}">` +
    `${esc(o.label)}` +
    (o.sub ? `<span class="shelp mono">${esc(o.sub)}</span>` : '') + `</span>` +
    `<span class="sval"${o.title ? ` title="${esc(o.title)}"` : ''}>` +
    (o.code ? `<code>${esc(o.value)}</code>` : esc(o.value || '')) +
    (o.value && tag ? ' ' : '') + tag +
    (o.help ? `<span class="shelp">${esc(o.help)}</span>` : '') + `</span>` +
    `<span class="sright">${o.chips || ''}` +
    `${o.state ? stateWord(o.state, o.states) : ''}${action}</span></div>` +
    (o.problems || []).map(p => `<p class="bad sprob">${esc(p)}</p>`).join('') +
    (o.after || '');
}

/* Reference material: closed by default, one click away, and never the
   thing a section leads with. */
function sref(summary, inner) {
  return `<details class="fold sref"><summary>${esc(summary)}</summary>` +
    `<div class="srefbody">${inner}</div></details>`;
}

/* One white panel: a heading a screen reader can jump to, an optional
   short fact on the right (already markup — escape it at the call), and
   the panel's rows. */
function spanel(title, meta, inner, cls) {
  return `<section class="panel${cls ? ' ' + cls : ''}"><div class="phead">` +
    `<h2 class="s-ptitle">${esc(title)}</h2>` +
    (meta ? `<span class="r">${meta}</span>` : '') + `</div>${inner}</section>`;
}

function settingsOverview(page) {
  const o = page.overview, v = page.verification, a = page.acceptance;
  const acc = page.access, i = page.installation, states = o.states;
  const row = {};
  for (const r of o.rows) row[r.id] = r;
  const scopes = Object.entries(a.policy.scopes);
  const gated = scopes.filter(([, e]) => e.gated);
  const reviews = scopes.filter(([, e]) => e.review !== 'none');
  const required = v.checks.filter(c => c.requiredBy.length).length;
  const intents = Object.entries(acc.intents);
  const blocked = intents.filter(([, f]) => f.error || (f.blockers || []).length);
  const report = S.doctor && S.doctor.report;
  const lines = [
    { label: 'Checks', section: 'verification', act: 'Edit checks',
      state: row.checks.state, title: row.checks.detail,
      value: v.checks.length
        ? `${v.checks.length} registered` +
          (required ? ` · ${required} required by a merge rule` : '')
        : 'None registered',
      tag: v.checks.length && !required ? ['dim', 'Optional'] : null,
      help: !v.checks.length ? row.checks.detail
        : !required ? 'Registered is not passed, and no merge requires one.' : '',
      // plain text throughout, not markup: sline escapes every field
      problems: v.problems.map(p => p.code + ' — ' + p.why) },
    { label: 'Merge rules', section: 'acceptance', act: 'Edit merge rules',
      state: row.acceptance.state, title: row.acceptance.detail,
      value: a.policy.blockers.length ? ''
        : gated.length
          ? gated.map(([s, e]) => `${SCOPE_LABEL[s] || s}: ` +
              (e.checks.map(c => c.requirement).join(', ') || 'review only')).join(' · ')
          : '',
      // the absence that changes what a merge means wears amber, in words
      tag: a.policy.blockers.length ? ['bad', 'Invalid']
        : gated.length ? null : ['warn', 'No merge requirements'],
      help: !gated.length && !a.policy.blockers.length
        ? 'Nothing is required before a merge, so a merge proves nothing.' : '',
      problems: a.policy.blockers },
    { label: 'Reviews', section: 'acceptance', act: 'Edit merge rules',
      aria: 'edit the review requirements', state: row.review.state,
      value: reviews.length
        ? reviews.map(([s, e]) => (SCOPE_LABEL[s] || s) + ': ' + e.review).join(' · ')
        : 'Not required' },
    { label: 'Overrides', section: 'acceptance', act: 'View',
      aria: 'view the override policy', state: row.overrides.state,
      value: a.overrides.allowed
        ? (a.overrides.actors.length
            ? `Allowed for ${a.overrides.actors.join(', ')}` : 'Allowed for anyone')
        : 'Off' },
    { label: 'Agent access', section: 'access', act: 'View access',
      state: row.access.state, title: row.access.detail,
      value: `${intents.length} profile${intents.length === 1 ? '' : 's'}: ` +
        intents.map(([n]) => n).join(', ') +
        (blocked.length ? ` · ${blocked.length} will not start` : ''),
      problems: blocked.map(([n, f]) =>
        n + ': ' + (f.error || (f.blockers || [])[0] || 'blocked')) },
    { label: 'Agents', section: 'agents', act: 'Edit agents',
      aria: 'edit the agent harnesses, models and prompts',
      value: agentsSummary(page.agents),
      help: 'Harness, model and prompt per kind of run. A change reaches the next launch.',
      problems: agentsProblems(page.agents) },
    { label: 'OS isolation', section: 'access', act: 'Details',
      aria: 'details of OS isolation', state: row.isolation.state,
      title: row.isolation.detail,
      value: row.isolation.state === 'unsupported' ? '' : 'Declared by the adapter',
      tag: row.isolation.state === 'unsupported' ? ['warn', 'Unavailable'] : null,
      help: row.isolation.state === 'unsupported'
        ? 'Write locations are intended, not enforced: nothing confines a run to them.'
        : '' },
    { label: 'Diagnostics', inspect: true, act: 'Check configuration',
      state: report && (report.summary.issues || []).length ? 'failed' : row.diagnostics.state,
      value: report ? report.summary.headline : '',
      tag: report ? (configStale(report) ? ['bad', 'Stale'] : null) : ['dim', 'Not inspected'],
      help: report ? report.summary.scope
        : 'Read-only: no project program runs and nothing is spent.' },
    { label: 'Installation', section: 'installation', act: 'View installation',
      value: i.mode + ' · ' + i.version, problems: i.problems },
    { label: 'Policy document', section: 'policy', act: 'Advanced editor',
      aria: 'open the advanced policy editor',
      value: o.policy.identity || 'None — the legacy settings apply',
      help: o.legacy
        ? 'Agents run; no named check or merge rule exists until a document declares one.'
        : '',
      problems: o.policy.problem ? [o.policy.problem] : [] },
  ];
  const recs = page.recommendations;
  const urgent = recs.some(r => r.priority === 'high');
  const sectionLabel = (key) =>
    (SETTINGS_SECTIONS.find(([k]) => k === key) || [])[1] || 'the setting';
  const recList = recs.map(r =>
    `<div class="srec ${esc(r.priority)}">` +
    `<div class="st"><span class="sbadge ${r.priority === 'high' ? 'warn' : 'dim'}">` +
    `${esc(r.priority)} priority</span>` +
    `<strong>${esc(r.title)}</strong>${stateWord(r.state, states)}</div>` +
    `<p>${esc(r.why)}</p>` +
    `<p class="supply"><b>You supply:</b> ${esc(r.supply)}</p>` +
    (r.prerequisites.length
      ? `<p><b>First:</b> ${esc(r.prerequisites.join('; '))}</p>` : '') +
    `<div class="acts">` +
    `<button class="sb link" data-ssection="${esc(r.section)}" ` +
    `aria-label="open the setting for ${esc(r.title)}">` +
    `Open ${esc(sectionLabel(r.section))}</button>` +
    (r.setting ? `<code>${esc(r.setting)}</code>` : '') + `</div></div>`).join('');
  // the current setup in three groups, as a reader asks about it: what
  // work must pass, what an agent may do, and this board itself
  const byLabel = {};
  for (const l of lines) byLabel[l.label] = l;
  const group = (labels) => labels.map(n => sline({ ...byLabel[n], states })).join('');
  return spanel('Verification and merging', esc(page.location),
      group(['Checks', 'Merge rules', 'Reviews', 'Overrides'])) +
    spanel('Agent runs', '', group(['Agents', 'Agent access', 'OS isolation'])) +
    spanel('This board', '', group(['Diagnostics', 'Installation', 'Policy document'])) +
    (recs.length
      ? `<section class="panel"><details class="fold sref srecs"${urgent ? ' open' : ''}>` +
        `<summary>Suggested next steps (${recs.length})</summary>` +
        `<div class="srefbody">${recList}</div></details></section>`
      : '') +
    sref('What each state word means',
      `<div class="skv">` + Object.entries(o.states).map(([w, why]) =>
        `<dt>${esc(w)}</dt><dd>${esc(why)}</dd>`).join('') + `</div>`);
}

/* ── verification ─────────────────────────────────────────────────────── */

/* One registered check, as configured — never as a result. Name and
   purpose first, then the facts that decide where and for how long it
   runs, its action, and the command itself, which stays readable in full
   in the disclosure's own line. */
function checkBlock(page, c, editor) {
  const v = page.verification;
  const scopes = Object.keys(c.scopes || {});
  const fact = (k, val, help) => `<div><dt>${esc(k)}</dt><dd>${val}` +
    (help ? `<span class="shelp">${esc(help)}</span>` : '') + `</dd></div>`;
  return `<article class="scard" aria-label="${esc('check ' + c.name)}">` +
    `<div class="shd"><h3>${esc(c.name)}</h3>` +
    // registered is not required, and neither is a pass: the badge says
    // which, and the definition rides on its title
    (c.requiredBy.length
      ? `<span class="sbadge ok" title="a merge rule requires this check">` +
        `required: ${esc(c.requirement.join(', '))}</span>`
      : `<span class="sbadge dim" title="${esc(v.registrationIsNotRequirement)}">` +
        `Optional</span>`) +
    stateWord(c.state, page.states) +
    `<button class="sb" data-sedit="check" data-sname="${esc(c.name)}" ` +
    `aria-label="${esc('edit the check ' + c.name)}">Edit</button></div>` +
    (c.help ? `<p class="lead">${esc(c.help)}</p>`
      : `<p>No description is recorded for this check in the policy.</p>`) +
    `<dl class="sfacts">` +
    fact('Runs in', `the <code>${esc(c.root)}</code> checkout`, c.rootWhy || '') +
    fact('Preparation', c.prepare.length
      ? c.prepare.map(p => `<code>${esc(p)}</code>`).join(', ') : 'None') +
    fact('Time limit', `${esc(String(c.timeout))} seconds`) +
    fact('May be asked for by', c.intents.length
      ? esc(c.intents.join(', ')) : 'No launch intent') +
    (scopes.length ? fact('Scopes', scopes.map(s => `<code>${esc(s)}</code>`).join(', ')) : '') +
    `</dl>` +
    `<details class="fold scmd"><summary>Command <code>${esc(c.run)}</code></summary>` +
    `<div class="srefbody"><div class="skv">` +
    `<dt>executable</dt><dd><code>${esc(c.executable || '')}</code></dd>` +
    `<dt>arguments</dt><dd><code>${esc(JSON.stringify(c.argv))}</code></dd>` +
    scopes.map(s => `<dt>scope ${esc(s)}</dt><dd><code>` +
      `${esc(JSON.stringify(c.scopes[s]))}</code></dd>`).join('') +
    `<dt>check identity</dt><dd><code>${esc(String(c.checkId))}</code></dd>` +
    `</div></div></details>` + editor + `</article>`;
}

function settingsVerification(page) {
  const v = page.verification, states = page.states;
  const ed = S.sedit && S.sedit.kind === 'check' ? (ensureDraft(page), S.sedit) : null;
  const rows = v.checks.map(c => checkBlock(page, c,
    ed && ed.anchor === c.name ? checkEditor(page, ed.index) : '')).join('');
  const orphan = ed && !v.checks.some(c => c.name === ed.anchor)
    ? checkEditor(page, ed.index) : '';
  const steps = v.prepare.map(s => sline({
    label: s.name, value: s.run, code: true, states,
    help: (s.usedBy.length ? `prepares ${s.usedBy.join(', ')}`
      : 'prepares nothing — no check references it') +
      (s.network ? ' · uses the network, unbounded' : ''),
    tag: s.network ? ['warn', 'Network: not bounded'] : null,
  })).join('');
  return spanel('Registered checks', `${v.checks.length} registered`,
      `<p>This is configuration, not results. What a check found is ` +
      `recorded per card — open a card's ◫ evidence to read it.</p>` +
      (v.problems.length ? v.problems.map(p =>
        `<p class="bad">${esc(p.code)}${p.field ? ` (${esc(p.field)})` : ''} — ` +
        `${esc(p.why)}</p>`).join('') : '') +
      (v.checks.length ? rows
        : `<p class="lead">No check is registered, so bench runs none of its ` +
          `own. An agent saying the tests pass is then its own word, not ` +
          `evidence.</p>`) +
      orphan +
      `<div class="acts"><button class="sb primary" data-sedit="new-check" ` +
      `aria-label="add a check">Add a check</button>` +
      `<button class="sb link" data-ssection="policy" aria-label="edit checks in ` +
      `the advanced policy editor">Advanced editor</button></div>`) +
    spanel('Preparation steps', `${v.prepare.length} declared`,
      `<p>${esc(v.preparationIsNotVerification)}</p>` +
      (v.prepare.length ? steps
        : `<p>No preparation step is declared. Add one in the advanced editor ` +
          `when a check needs dependencies installed first.</p>`)) +
    sref(v.ownership,
      `<p>${esc(v.ownershipDetail)}</p>` +
      `<div class="skv">` + v.responsibilities.map(r =>
        `<dt>${esc(r.who)}</dt><dd>${esc(r.what)}</dd>`).join('') + `</div>` +
      `<p>${esc(v.registrationIsNotRequirement)}</p>` +
      `<p>${esc(v.evidenceScope)}</p>`) +
    sref('Where a check runs — a location, not a sandbox',
      `<div class="skv">` + Object.entries(v.roots).map(([w, why]) =>
        `<dt>${esc(w)}</dt><dd>${esc(why)}</dd>`).join('') + `</div>` +
      `<p>${esc(v.rootsNote)}</p>` +
      `<ul>${v.trustLimits.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` +
      `<p>The environment a check is not given:</p>` +
      `<pre>${esc(v.envDenied.join('\n'))}</pre>`) +
    sref('A worked example, and what to ask a developer for',
      `<p>${esc(v.example.why)}</p>` +
      `<pre>${esc(JSON.stringify(v.example.document, null, 2))}</pre>` +
      `<p>${esc(v.example.then)}</p>` +
      `<ul>${v.checklist.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`);
}

/* ── acceptance, reviews and overrides ────────────────────────────────── */

function settingsAcceptance(page) {
  const a = page.acceptance, states = page.states;
  const ed = S.sedit && S.sedit.kind !== 'check' ? (ensureDraft(page), S.sedit) : null;
  const anyGated = Object.values(a.policy.scopes).some(e => e.gated);
  const scopes = Object.entries(a.policy.scopes).map(([scope, entry]) => sline({
    label: SCOPE_LABEL[scope] || scope, sub: scope, states,
    value: (entry.checks.length
      ? entry.checks.map(c => c.requirement).join(', ') : 'No check required') +
      ' · review: ' + entry.review,
    help: a.scopes[scope] || entry.why,
    title: entry.reviewWhy || '',
    state: entry.gated ? 'configured-untested' : 'not-configured',
    // ungated is a consequential absence: amber, in words, with the
    // definition on its title — never the colour of a pass
    chips: `<span class="sbadge ${entry.gated ? 'ok' : 'warn'}" ` +
      `title="${esc(entry.gated ? 'this mutation is gated' : a.ungatedIsNotAPass)}">` +
      `${entry.gated ? 'gated' : 'ungated'}</span>`,
    edit: 'gate', name: scope, act: 'Edit', aria: `edit the ${scope} merge rule`,
    after: ed && ed.kind === 'gate' && ed.scope === scope ? gateEditor(page, scope) : '',
  })).join('');
  const over = a.overrides;
  return spanel('Merge rules', esc(a.state),
      (a.policy.blockers.length
        ? a.policy.blockers.map(b => `<p class="bad">${esc(b)}</p>`).join('')
        : '') +
      // the one limitation that changes what a merge means, kept in view
      (!anyGated ? `<p class="snote">${esc(a.ungatedIsNotAPass)}</p>` : '') +
      scopes +
      sline({ label: 'Overrides', states,
        value: over.allowed
          ? (over.actors.length ? `Allowed for ${over.actors.join(', ')}` : 'Allowed for anyone')
          : 'Off',
        help: over.allowed ? 'Recorded against one commit; never a pass.'
          : 'An unmet merge rule stays unmet.',
        edit: 'overrides', act: 'Edit', aria: 'edit the override policy',
        after: ed && ed.kind === 'overrides' ? overridesEditor(page) : '' })) +
    settingsCi(page) +
    sref('Review policies, and which this board can read',
      a.reviewModes.map(m => sline({ label: m.name,
        value: m.available ? 'Offered' : 'Unavailable here',
        help: m.unavailableWhy || m.why })).join('') +
      `<p>${esc(a.sameAccount)}</p>` +
      `<p>${esc(a.outstandingChanges)}</p>` +
      `<p>${esc(a.notBranchProtection)}</p>`) +
    sref('How evidence is bound to the commit that merges',
      `<p>${esc(a.headBinding)}</p><p>${esc(a.coverage)}</p>` +
      `<p>${esc(a.supersede)}</p>` +
      `<pre>${esc(Object.entries(a.reasons)
        .map(([k, why]) => `${k}\n  ${why}\n  remedy: ${a.remedies[k] || '—'}`)
        .join('\n\n'))}</pre>` +
      `<pre>${esc(Object.entries(a.decisions)
        .map(([k, why]) => `${k}\n  ${why}`).join('\n\n'))}</pre>`) +
    sref('What an override records',
      `<p>${esc(over.why)}</p><p>${esc(a.overrideLaw)}</p>`);
}

/* Bench-run checks, external CI and review — three things one green tick
   would collapse. The same project test program can feed the first two,
   which is exactly why each keeps a row of its own. */
function settingsCi(page) {
  const c = page.ci;
  return spanel('Three separate signals', 'green CI is not a Bench check',
    Object.values(c.kinds).map(k => sline({ label: k.label, value: k.who,
      help: k.what, title: 'authority: ' + k.authority,
      chips: `<span class="sbadge ${k.gateable ? '' : 'dim'}" ` +
        `title="${esc(k.gateable ? 'a merge rule can require this'
                                 : 'a merge rule cannot require this')}">` +
        `${k.gateable ? 'can gate' : 'cannot gate'}</span>` })).join('') +
    `<p>External CI is polled every ${esc(String(c.ci.interval))}s; ` +
    `gh ${c.ci.ghAvailable ? 'is available' : 'is not available here'}.</p>` +
    sref('What these signals cannot stand in for',
      `<p>${esc(c.ci.why)}</p>` +
      `<ul>${c.limits.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` +
      `<p>${esc(c.noDeployment)}</p>` +
      `<pre>${esc(c.followUp.join('\n\n'))}</pre>`));
}

/* ── agent access ─────────────────────────────────────────────────────── */

function settingsAccess(page) {
  const a = page.access, states = page.states;
  const intents = Object.entries(a.intents).map(([intent, found]) => {
    if (found.error) {
      return `<div class="srow"><span class="sname">${esc(intent)}</span>` +
        `<span class="sdetail bad">${esc(found.error)}</span></div>`;
    }
    const s = found.summary || {};
    const iso = found.isolation || {};
    return `<div class="srow sline"><span class="sname">${esc(intent)}</span>` +
      `<span class="sval" title="${esc(`grants: ${(found.commands || []).length
        ? found.commands.map(g => g.name).join(', ') : 'none'} · denied: ` +
        `${(found.denied || []).length
          ? found.denied.map(d => d.capability).join(', ') : 'nothing'}`)}">` +
      `works in <b>${esc((found.cwd || {}).policy || '—')}</b> · ` +
      `${(found.commands || []).length} grant` +
      `${(found.commands || []).length === 1 ? '' : 's'} · ` +
      `checks: ${(s.checks || []).length ? esc(s.checks.join(', ')) : 'none'} · ` +
      `inputs: ${(found.context || []).length
        ? esc(found.context.map(i => `${i.name} (${i.status})`).join(', '))
        : 'none'}` +
      // the headline and the retraction in one line, never a headline
      // that reads as a boundary with the caveat folded away below it
      `<span class="shelp">intended writes: ${(found.writable || []).length
        ? esc(found.writable.map(w => w.root || w.path || '').join(', '))
        : 'nothing'} · OS isolation: ${esc(iso.enforced
        ? 'enforced by ' + (iso.by || 'the backend')
        : 'none enforced')}</span></span>` +
      `<span class="sright">${stateWord(found.state, states)}` +
      (found.blockers && found.blockers.length
        ? `<span class="sbadge bad" title="${esc(found.blockers[0])}">` +
          `will not start</span>` : '') + `</span></div>` +
      ((found.fields || []).filter(f => f.why).length
        ? (found.fields || []).filter(f => f.why).map(f =>
            `<p class="bad sprob">${esc(f.code)}` +
            `${f.field ? ` (${esc(f.field)})` : ''} — ${esc(f.why)}` +
            `${f.remedy ? ` <i>${esc(f.remedy)}</i>` : ''}</p>`).join('')
        : '');
  }).join('');
  const frozen = a.frozen.length ? a.frozen.map(f =>
    `<div class="srow"><span class="sname">${esc(f.name || f.agent)}</span>` +
    `<span class="sdetail">${esc(f.mode || '')} on ${esc(f.task || '—')} · ` +
    `policy <code>${esc(String(f.policyId).slice(0, 14))}</code>` +
    (f.freshness && f.freshness.fresh === false
      ? `<br><b>the settings have moved since it launched; this run keeps ` +
        `what it rode</b> — ${esc((f.freshness.changed || []).join('; '))}`
      : '') + `</span></div>`).join('')
    : `<p>No run is in flight.</p>`;
  // said once for the section rather than once per profile: it is the
  // same adapter, and the same answer, for all three
  const isoWhy = Object.values(a.intents).map(f => (f.isolation || {}).why)
    .find(Boolean);
  return spanel('Profiles',
      `${esc(a.adapter.name)} ${esc(a.adapter.version || '')}`,
      (isoWhy ? `<p class="snote">${esc(isoWhy)}</p>` : '') + intents +
      `<div class="acts"><button class="sb link" data-ssection="policy" ` +
      `aria-label="edit what a run may do">Edit what a run may do</button>` +
      `</div>`) +
    spanel('Runs in flight', 'frozen, not current', frozen) +
    sref('Four different facts: configured is not enforced',
      `<div class="skv">` + Object.entries(a.facts).map(([k, why]) =>
        `<dt>${esc(k)}</dt><dd>${esc(why)}</dd>`).join('') + `</div>`) +
    // Four words and never a fifth: `enforced`, `prefix-allowlist`,
    // `prompt-only`, `pending`. The server's own table, named party
    // included — the page does not decide how strongly anything holds.
    sref(`What is actually enforced, and by whom ` +
      `(${Object.keys(a.capabilities).length} capabilities)`,
      `<div class="skv">` + Object.entries(a.capabilities).map(([name, cap]) =>
        `<dt>${esc(name)}</dt><dd>${esc(cap.enforcement)} — by ` +
        `${esc(cap.by || 'nothing')}<span class="why">${esc(cap.why || '')}` +
        `</span></dd>`).join('') + `</div>` +
      ((a.adapter.unsupported || []).length
        ? `<p>The installed adapter declares these unsupported, in those ` +
          `words: <code>${esc(a.adapter.unsupported.join(', '))}</code>. A ` +
          `profile that <i>requires</i> one is refused rather than reported ` +
          `as honoured — there is no pretend switch for it here.</p>` : '')) +
    sref(`The board's own $ commands (${a.uiCommands.length})`,
      a.uiCommands.length
        ? a.uiCommands.map(c => sline({ label: c.name, value: c.help || '',
            chips: `<span class="sbadge dim" ` +
              `title="${esc(a.facts['ui-registration'])}">no agent grant</span>` }))
            .join('')
        : `<p>None registered.</p>`);
}

/* ── check configuration and diagnostics ──────────────────────────────── */

/* ── agents (task 77) ─────────────────────────────────────────────────

   Which harness and model each purpose rides, and the four prompt
   templates. Every value shown is the server's resolution — the one
   `config.agent_choice()` a launch reads — and every write goes through
   /api/settings/agents/*, which names agent keys and template names from
   fixed lists. Its draft is its own (S.agentsDraft), with the same four
   steps as the policy editor: edit, validate, preview, apply. */

const AGENT_ROWS = ['default', 'work', 'act-pr', 'review'];

function agentsSummary(a) {
  if (!a) return '';
  const d = a.rows.default;
  const own = ['work', 'act-pr', 'review'].filter(p =>
    a.rows[p].harness.value || a.rows[p].model.value).length;
  const local = a.templates.filter(t => t.source === 'local').length;
  return `${d.harness.value} · ${d.model.value || 'harness default'}` +
    (own ? ` · ${own} purpose override${own === 1 ? '' : 's'}` : '') +
    (local ? ` · ${local} local prompt${local === 1 ? '' : 's'}` : '');
}

function agentsProblems(a) {
  if (!a) return [];
  const out = [];
  for (const p of ['work', 'act-pr', 'review'])
    for (const b of a.rows[p].effective.blockers)
      out.push(`${a.rows[p].label}: ${b.why}`);
  for (const t of a.templates)
    if (t.problems.length) out.push(`${t.label} prompt: ${t.problems[0].why}`);
  return out;
}

function agentsDraftFor(a) {
  const d = S.agentsDraft;
  if (d && d.revision === a.revision) return d;
  if (d && d.dirty) { d.stale = true; return d; }
  const agents = {};
  for (const key of a.keys) {
    const row = Object.values(a.rows).flatMap(r => [r.harness, r.model])
      .find(x => x && x.key === key);
    if (row) agents[key] = row.value;
  }
  // a default harness that is only the documented default is still a value
  S.agentsDraft = { revision: a.revision, agents, prompts: {}, dirty: false,
                    open: null, renders: {}, diffs: {}, armed: false };
  return S.agentsDraft;
}

function agentHarnessOptions(a, row, value, inherit) {
  const names = a.harnesses.map(h => h.name);
  const opts = [];
  if (inherit !== null)
    opts.push(`<option value=""${!value ? ' selected' : ''}>Inherit default (${esc(inherit)})</option>`);
  for (const h of a.harnesses)
    opts.push(`<option value="${esc(h.name)}"${h.name === value ? ' selected' : ''}>` +
      `${esc(h.name)}${h.where === 'local' ? ' (local)' : ''}</option>`);
  if (value && !names.includes(value))
    opts.push(`<option value="${esc(value)}" selected>${esc(value)} — not installed</option>`);
  return opts.join('');
}

function agentRow(a, d, id) {
  const row = a.rows[id];
  const isDefault = id === 'default';
  const hKey = row.harness.key, mKey = row.model.key;
  const hVal = d.agents[hKey] ?? '';
  const mVal = d.agents[mKey] ?? '';
  const defaultH = d.agents[a.rows.default.harness.key] || 'claude';
  const defaultM = d.agents[a.rows.default.model.key] || '';
  const effH = isDefault ? hVal || 'claude' : (hVal || defaultH);
  const harness = a.harnesses.find(h => h.name === effH);
  const lock = (x) => x.locked
    ? `<span class="sbadge warn" title="${esc(x.how)}">Locked: ${esc(x.sourceWords)}</span>` : '';
  // "Use a model" chosen and nothing typed yet is still a choice: the
  // field stays open rather than snapping back to inherit on a repaint
  const inheritModel = !isDefault && !mVal && !(d.modelSet || {})[mKey];
  const effective = row.effective
    ? `<span class="shelp">In force now: <b>${esc(row.effective.selection.harness.name)}</b>` +
      ` · ${esc(row.effective.selection.model.value || 'harness default')}` +
      ` <span class="mono">(${esc(row.effective.selection.harness.setting)} from ` +
      `${esc(row.effective.selection.harness.source)})</span></span>` : '';
  const probs = [];
  if (!harness) probs.push(`${effH} is not installed — choose an installed harness, ` +
    `or add manager/local/adapters/${effH}/run. Choosing installs nothing.`);
  for (const b of (row.effective || {}).blockers || []) probs.push(b.why);
  return `<div class="srow agrow" data-agrow="${esc(id)}">` +
    `<span class="sname">${esc(row.label)}` +
    (row.templates ? `<span class="shelp">${row.templates.map(t => esc(t)).join(', ')}</span>` : '') +
    `</span>` +
    `<div class="sval s-edit"><div class="fgrid">` +
    `<div class="frow"><label for="ag-h-${esc(id)}">Harness</label>` +
    `<select id="ag-h-${esc(id)}" data-agkey="${esc(hKey)}"${row.harness.locked ? ' disabled' : ''}>` +
    agentHarnessOptions(a, row, hVal, isDefault ? null : defaultH) + `</select>${lock(row.harness)}</div>` +
    `<div class="frow"><label for="ag-m-${esc(id)}">Model</label>` +
    (isDefault ? '' :
      `<select id="ag-mi-${esc(id)}" data-agmodelmode="${esc(mKey)}" ` +
      `aria-label="${esc(row.label)} model: inherit or set"${row.model.locked ? ' disabled' : ''}>` +
      `<option value="inherit"${inheritModel ? ' selected' : ''}>Inherit default (${esc(defaultM || 'harness default')})</option>` +
      `<option value="set"${inheritModel ? '' : ' selected'}>Use a model for ${esc(row.label)}</option>` +
      `</select>`) +
    `<input type="text" id="ag-m-${esc(id)}" data-agkey="${esc(mKey)}" ` +
    `value="${esc(mVal)}" spellcheck="false" autocomplete="off" ` +
    `placeholder="${isDefault ? 'Harness default' : 'vendor model identifier'}"` +
    `${row.model.locked || inheritModel ? ' disabled' : ''}>${lock(row.model)}` +
    (isDefault ? `<span class="shelp">Empty means harness default: no model is passed.</span>` : '') +
    (!isDefault && inheritModel && defaultM && hVal && hVal !== defaultH
      ? `<span class="shelp"><b>Inherits ${esc(defaultM)}</b> — chosen for ${esc(defaultH)}; ` +
        `check it is a ${esc(hVal)} identifier.</span>` : '') +
    `</div></div>` +
    (harness ? `<span class="shelp">${esc(harness.setup)}</span>` : '') +
    effective + `</div></div>` +
    probs.map(p => `<p class="bad sprob">${esc(p)}</p>`).join('');
}

function agentTemplate(a, d, t) {
  const draft = d.prompts[t.name];
  const action = draft ? draft.action : 'keep';
  const text = draft && draft.action === 'set' ? draft.text
    : draft && draft.action === 'reset' ? t.builtin : t.text;
  const open = d.open === t.name;
  const source = action === 'reset' ? 'Built-in (reset pending)'
    : action === 'set' ? 'Local override (unsaved)'
    : t.source === 'local' ? 'Local override' : 'Built-in';
  const badge = `<span class="sbadge ${t.source === 'local' || action === 'set' ? 'ok' : 'dim'}">${esc(source)}</span>`;
  const head = `<div class="srow sline"><span class="sname">${esc(t.label)}` +
    `<span class="shelp mono">${esc(t.name)} · ${esc(t.stance)}</span></span>` +
    `<span class="sval">${badge}</span><span class="sright">` +
    `<button class="sb" data-agtpl="${esc(t.name)}" aria-expanded="${open}" ` +
    `aria-label="${open ? 'close' : 'edit'} the ${esc(t.label)} prompt">${open ? 'Close' : 'Edit'}</button>` +
    `</span></div>` +
    t.problems.map(p => `<p class="bad sprob">${esc(p.why)}</p>`).join('');
  if (!open) return head;
  const render = d.renders[t.name];
  const diff = d.diffs[t.name];
  const recovered = a.recovery.filter(r => r.template === t.name);
  return head +
    `<div class="item s-edit s-inline" data-agedit="${esc(t.name)}">` +
    `<div class="frow"><label for="ag-t-${esc(t.name)}">${esc(t.label)} template</label>` +
    `<textarea id="ag-t-${esc(t.name)}" data-agtext="${esc(t.name)}" rows="16" spellcheck="false">` +
    `${esc(text)}</textarea>` +
    `<span class="shelp">Placeholders are written {name}; a literal brace is doubled. ` +
    `Required: ${t.fields.filter(f => f.required).map(f => `{${f.name}}`).join(' ')}. ` +
    `It must keep the ${t.markers.map(m => `“${m}”`).join(', ')} instruction the board parses.</span>` +
    `</div>` +
    sref('Placeholders this template may use', `<div class="skv">` +
      t.fields.map(f => `<dt>{${esc(f.name)}}</dt><dd>${esc(f.what)}` +
        (f.required ? ' <span class="why">required</span>' : '') + `</dd>`).join('') + `</div>`) +
    `<div class="acts">` +
    `<label class="shelp" for="ag-card-${esc(t.name)}">Preview with</label>` +
    `<select id="ag-card-${esc(t.name)}" data-agcard="${esc(t.name)}" aria-label="preview with sample values or a card">` +
    `<option value="">sample values</option>` +
    allTasks().map(c => `<option value="${esc(c.file)}"${render && render.card === c.file ? ' selected' : ''}>` +
      `${esc(c.file)}</option>`).join('') + `</select>` +
    `<button class="sb" data-agrender="${esc(t.name)}" aria-label="render a preview of the ${esc(t.label)} prompt">Render preview</button>` +
    `<button class="sb" data-agdiff="${esc(t.name)}" aria-label="diff the ${esc(t.label)} prompt from the built-in">Diff from built-in</button>` +
    (t.source === 'local' || action === 'set'
      ? `<button class="sb danger" data-agreset="${esc(t.name)}" aria-label="reset the ${esc(t.label)} prompt to the built-in">Reset to built-in</button>` : '') +
    (draft ? `<button class="sb link" data-agcancel="${esc(t.name)}" aria-label="cancel the changes to the ${esc(t.label)} prompt">Cancel changes</button>` : '') +
    `</div>` +
    (diff !== undefined ? `<details class="fold sref" open><summary>Diff from the built-in</summary>` +
      `<div class="srefbody"><pre data-agdiffout="${esc(t.name)}">${esc(diff || 'identical to the built-in')}</pre></div></details>` : '') +
    (render ? `<details class="fold sref" open><summary>Rendered preview — ${esc(render.source || '')}</summary>` +
      `<div class="srefbody">` + (render.ok
        ? `<pre data-agrendered="${esc(t.name)}">${esc(render.rendered)}</pre>`
        : render.errors.map(e => `<p class="bad">${esc(e.why)}</p>`).join('')) +
      `</div></details>` : '') +
    (recovered.length ? sref(`Recover replaced text (${recovered.length})`,
      recovered.map((r, n) => `<div class="acts"><span class="shelp mono">` +
        `${esc(new Date((r.at || 0) * 1000).toLocaleString())} · ${esc((r.sha256 || '').slice(0, 12))}</span>` +
        `<button class="sb" data-agrestore="${esc(t.name)}" data-agrestoren="${n}" ` +
        `aria-label="load the replaced ${esc(t.label)} text into the editor">Load into the editor</button></div>`).join('')) : '') +
    `</div>`;
}

function settingsAgents(page) {
  const a = page.agents;
  if (!a) return `<div class="panel"><p>This board does not report its agents.</p></div>`;
  const d = agentsDraftFor(a);
  const pv = d.preview, ck = d.checked;
  const errs = (ck && ck.errors) || [];
  const steps =
    `<div id="ag-steps" class="acts">` +
    `<button class="sb" data-agstep="validate" aria-label="validate the agent settings draft">Validate</button>` +
    `<button class="sb" data-agstep="preview" aria-label="preview the agent settings draft">Preview</button>` +
    `<button class="sb primary${d.armed ? ' armed' : ''}" data-agstep="apply" ` +
    `aria-label="${d.armed ? 'confirm: apply' : 'apply'} the agent settings draft"` +
    `${d.dirty ? '' : ' disabled'}>${d.armed ? 'Confirm apply' : 'Apply'}</button>` +
    `<button class="sb link" data-agstep="discard" aria-label="discard the agent settings draft"` +
    `${d.dirty ? '' : ' disabled'}>Discard draft</button>` +
    `<span class="s-rev">revision ${esc(a.revision.slice(0, 12))}</span></div>` +
    (d.stale ? `<p class="bad">The agent settings changed on disk since this draft was opened. ` +
      `Applying will be refused as a conflict: discard the draft and re-read.</p>` : '') +
    (d.dirty ? `<p class="snote" role="status"><b>Unsaved draft.</b> Nothing has been written.</p>` : '') +
    errs.map(e => `<p class="bad" data-agerr="${esc(e.code)}">${esc(e.field ? e.field + ': ' : '')}${esc(e.why)}</p>`).join('') +
    (ck && ck.ok && !pv ? `<p class="snote">The draft validates. Nothing was written.</p>` : '') +
    (pv ? `<div class="s-conseq" data-agpreview="1"><p class="lead">If applied:</p><ul>` +
      pv.purposes.map(p => `<li>${esc(p.label)}: ` + (p.changed
        ? `${esc(p.before.harness.name)} · ${esc(p.before.model.value || 'harness default')} → ` +
          `<b>${esc(p.after.harness.name)} · ${esc(p.after.model.value || 'harness default')}</b>` +
          (p.inheritanceChanged ? ' (inheritance changes)' : '') +
          (p.modelCarried ? ` — the model is carried to a different harness; check it is one ${esc(p.after.harness.name)} knows` : '')
        : 'unchanged') +
        (p.blockers.length ? ` — <span class="bad">${esc(p.blockers[0].why)}</span>` : '') +
        (p.missingCapabilities.length ? ` <span class="shelp">${esc(p.after.harness.name)} does not declare: ${esc(p.missingCapabilities.join(', '))}</span>` : '') +
        `</li>`).join('') +
      pv.templates.map(t => `<li>${esc(t.template)}: ${esc(t.action === 'reset' ? 'reset to the built-in' : 'saved as a local override')}` +
        (t.recoverable ? ' — the replaced local text is kept for recovery' : '') + `</li>`).join('') +
      `</ul><p>${esc(pv.appliesWhy)}.</p>` +
      sref('What applying does and does not do', `<ul>` +
        pv.sideEffects.map(s => `<li>${esc(s)}</li>`).join('') + `</ul>`) + `</div>` : '');
  return spanel('Harness and model', esc(a.appliesWhy),
      AGENT_ROWS.map(id => agentRow(a, d, id)).join('') +
      `<div class="srow sline"><span class="sname">${esc(a.rows.refine.label)}</span>` +
      `<span class="sval">${esc(a.rows.refine.effective.selection.harness.name)} · ` +
      `${esc(a.rows.refine.effective.selection.model.value || 'harness default')}` +
      `<span class="shelp">${esc(a.rows.refine.why)}</span></span></div>`) +
    spanel('Prompt templates', 'local overrides only — the built-ins are never edited',
      a.templates.map(t => agentTemplate(a, d, t)).join('')) +
    spanel('Save', '', steps, 'sdraft') +
    sref('What these settings are, and are not', `<ul>` +
      a.facts.map(f => `<li>${esc(f)}</li>`).join('') + `</ul>`) +
    (a.history.length ? sref(`Recent changes (${a.history.length})`, `<ul>` +
      a.history.slice(0, 20).map(h => `<li>${esc(new Date(h.at * 1000).toLocaleString())} · ` +
        `${esc(h.actor || 'unknown actor')} · ${esc([...h.changedKeys, ...h.templates.map(t => t.template)].join(', '))}</li>`).join('') +
      `</ul>`) : '');
}

function agentsMark(d) {
  d.dirty = true; d.armed = false; d.checked = null; d.preview = null;
  // Typing does not repaint (that would take the caret), so the step bar
  // is brought up to date in place: Apply and Discard become available,
  // and a validation or preview of the text before this edit is removed
  // rather than left describing something else.
  const steps = document.getElementById('ag-steps');
  if (!steps) return;
  for (const step of ['apply', 'discard']) {
    const btn = steps.querySelector(`[data-agstep="${step}"]`);
    if (btn) btn.disabled = false;
  }
  const apply = steps.querySelector('[data-agstep="apply"]');
  if (apply && apply.classList.contains('armed')) {
    apply.classList.remove('armed');
    apply.textContent = 'Apply';
    apply.setAttribute('aria-label', 'apply the agent settings draft');
  }
  const panel = steps.parentElement;
  if (panel) panel.querySelectorAll('[data-agpreview], [data-agerr]')
    .forEach(e => e.remove());
}

function agentsPayload(d) {
  return { revision: d.revision, agents: d.agents, prompts: d.prompts };
}

async function agentsPost(step, body) {
  const res = await fetch(`/api/settings/agents/${step}`, {
    method: 'POST', headers: SETTINGS_HEADERS, body: JSON.stringify(body),
  });
  const data = await res.json();
  return { res, data };
}

function wireAgents(page) {
  const a = page.agents;
  if (!a) return;
  const d = agentsDraftFor(a);
  const body = $('#sbody');
  body.querySelectorAll('[data-agkey]').forEach(el => {
    const commit = () => { d.agents[el.dataset.agkey] = el.value.trim(); agentsMark(d); };
    if (el.tagName === 'SELECT') el.addEventListener('change', () => { commit(); renderSettings(); });
    else el.addEventListener('input', commit);
  });
  body.querySelectorAll('[data-agmodelmode]').forEach(el =>
    el.addEventListener('change', () => {
      const key = el.dataset.agmodelmode;
      d.modelSet = d.modelSet || {};
      d.modelSet[key] = el.value === 'set';
      if (el.value === 'inherit') d.agents[key] = '';
      agentsMark(d);
      const id = (body.querySelector(`input[data-agkey="${CSS.escape(key)}"]`) || {}).id;
      renderSettings();
      // choosing "Use a model" moves the person to the field it opened
      const field = el.value === 'set' && id ? document.getElementById(id) : null;
      if (field) field.focus();
    }));
  body.querySelectorAll('[data-agtpl]').forEach(btn =>
    btn.addEventListener('click', () => {
      d.open = d.open === btn.dataset.agtpl ? null : btn.dataset.agtpl;
      renderSettings();
      const t = d.open ? document.getElementById('ag-t-' + d.open) : null;
      if (t) t.focus();
      else {
        const back = $('#sbody').querySelector(`[data-agtpl="${CSS.escape(btn.dataset.agtpl)}"]`);
        if (back) back.focus();
      }
    }));
  body.querySelectorAll('[data-agtext]').forEach(el =>
    el.addEventListener('input', () => {
      d.prompts[el.dataset.agtext] = { action: 'set', text: el.value };
      agentsMark(d);
    }));
  const tpl = (name) => a.templates.find(t => t.name === name);
  const textOf = (name) => {
    const el = document.getElementById('ag-t-' + name);
    return el ? el.value : tpl(name).text;
  };
  body.querySelectorAll('[data-agrender]').forEach(btn =>
    btn.addEventListener('click', async () => {
      const name = btn.dataset.agrender;
      const card = (body.querySelector(`[data-agcard="${CSS.escape(name)}"]`) || {}).value || '';
      try {
        const { res, data } = await agentsPost('render',
          { template: name, text: textOf(name), card });
        if (!res.ok) { toast(data.error || 'could not render', true); return; }
        d.renders[name] = { ...data.render, card };
        renderSettings();
      } catch (e) { toast(e.message || 'the board could not be asked', true); }
    }));
  body.querySelectorAll('[data-agdiff]').forEach(btn =>
    btn.addEventListener('click', () => {
      d.diffs[btn.dataset.agdiff] = lineDiff(tpl(btn.dataset.agdiff).builtin,
                                             textOf(btn.dataset.agdiff));
      renderSettings();
    }));
  body.querySelectorAll('[data-agreset]').forEach(btn =>
    btn.addEventListener('click', () => {
      const t = tpl(btn.dataset.agreset);
      if (t.source === 'local') d.prompts[t.name] = { action: 'reset' };
      else delete d.prompts[t.name];
      agentsMark(d);
      d.diffs[t.name] = lineDiff(textOf(t.name), t.builtin);
      toast('reset staged — preview, then apply. The replaced text is kept for recovery');
      renderSettings();
    }));
  body.querySelectorAll('[data-agcancel]').forEach(btn =>
    btn.addEventListener('click', () => {
      delete d.prompts[btn.dataset.agcancel];
      delete d.diffs[btn.dataset.agcancel];
      delete d.renders[btn.dataset.agcancel];
      d.dirty = Object.keys(d.prompts).length > 0 || d.dirty;
      d.preview = null; d.checked = null; d.armed = false;
      renderSettings();
    }));
  body.querySelectorAll('[data-agrestore]').forEach(btn =>
    btn.addEventListener('click', () => {
      const name = btn.dataset.agrestore;
      const r = a.recovery.filter(x => x.template === name)[+btn.dataset.agrestoren];
      if (!r) return;
      d.prompts[name] = { action: 'set', text: r.text };
      agentsMark(d);
      toast('replaced text loaded into the editor — apply to restore it');
      renderSettings();
    }));
  body.querySelectorAll('[data-agstep]').forEach(btn =>
    btn.addEventListener('click', async () => {
      const step = btn.dataset.agstep;
      if (step === 'discard') {
        S.agentsDraft = null;
        toast('draft discarded — nothing was written');
        fetchSettings(true);
        return;
      }
      if (step === 'apply' && !d.armed) {
        d.armed = true;
        renderSettings();
        return;
      }
      try {
        const { res, data } = await agentsPost(step, agentsPayload(d));
        if (!res.ok) {
          toast(data.error || `the draft could not be ${step === 'apply' ? 'applied' : step + 'd'}`, true);
          if (data.conflict) d.stale = true;
          d.armed = false;
          renderSettings();
          return;
        }
        if (step === 'validate') {
          d.checked = data.validation;
          toast(data.validation.ok ? 'the draft validates — nothing was written'
            : `${data.validation.errors.length} would be refused — nothing was written`,
            !data.validation.ok);
        } else if (step === 'preview') {
          d.preview = data.preview;
          d.checked = { ok: data.preview.ok, errors: data.preview.errors };
          toast('previewed — nothing was written');
        } else {
          S.agentsDraft = null;
          await fetchSettings(true);
          toast(data.applied.unchanged ? 'nothing to change — nothing was written'
            : `written — ${data.applied.appliesWhy}`);
          return;
        }
        renderSettings();
      } catch (e) { toast(e.message || 'the board could not be asked', true); }
    }));
}

/* A plain line diff for the prompt editor: removed lines with "-", added
   with "+", context with a space. Small templates, so the quadratic LCS
   is fine; the server's preview carries its own unified diff. */
function lineDiff(before, after) {
  if (before === after) return '';
  const a = before.split('\n'), b = after.split('\n');
  const n = a.length, m = b.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push('  ' + a[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push('- ' + a[i++]);
    else out.push('+ ' + b[j++]);
  }
  while (i < n) out.push('- ' + a[i++]);
  while (j < m) out.push('+ ' + b[j++]);
  // keep the changed lines and two lines of context round them
  const keep = new Set();
  out.forEach((l, k) => { if (l[0] !== ' ') for (let x = k - 2; x <= k + 2; x++) keep.add(x); });
  return out.filter((_, k) => keep.has(k)).join('\n');
}

function settingsDiagnostics(page) {
  const d = page.diagnostics;
  const report = S.doctor && S.doctor.report;
  // the same result the header's ⚕ sheet draws, from the same function
  const findings = report
    ? configCheckBody(report, { purpose: S.settingsPurpose || null })
    : S.doctorError
      ? `<div class="cissue" role="alert"><b>The configuration check did not complete</b>` +
        `<span>${esc(S.doctorError)}</span></div>`
      : `<p class="cscope">Not checked yet.</p>`;
  const purposes = report
    ? `<div class="chiprow" role="group" aria-label="purpose">` +
      ['', ...Object.keys(INTENT_LABEL)].map(key =>
        `<button class="sb" ` +
        `data-spurpose="${esc(key)}" aria-pressed="${key === (S.settingsPurpose || '')}">` +
        `${key ? esc(INTENT_LABEL[key]) : 'All purposes'}</button>`).join('') + `</div>`
    : '';
  // One stage as a row: what it does, its side effects beside its control,
  // what it proves folded underneath, and whether this reading asked it.
  const stage = (row) => {
    const mode = d.modes[row.mode];
    const ran = report ? report.ran.includes(row.mode) : false;
    const result = report
      ? (report.summary.stages || []).find(s => s.mode === row.mode) : null;
    const badge = result && ['failed', 'issues'].includes(result.state) ? 'bad'
      : ran ? 'ok' : 'dim';
    const path = mode.uiPath || {};
    return `<div class="srow sline"><span class="sname">${esc(mode.label)}</span>` +
      `<span class="sval">${esc(mode.does)}` +
      // what an armed stage would do stays beside its control
      ((mode.sideEffects || []).length
        ? `<span class="shelp"><b>Side effects:</b> ` +
          `${esc(mode.sideEffects.join('; '))}</span>` : '') +
      (path.available
        ? (row.mode === 'inspect' ? '' : `<span class="shelp">${esc(path.how)}` +
            `${path.approval ? ` (${esc(path.approval)})` : ''}</span>`)
        : `<span class="shelp"><b>no control here.</b> <code>${esc(path.how || '')}</code>` +
          `${path.approval ? ` — ${esc(path.approval)}` : ''}</span>`) +
      `<details class="fold"><summary>What it proves</summary>` +
      `<p><b>Proves:</b> ${esc(row.proves)}</p>` +
      `<p><b>Does not prove:</b> ${esc(row.doesNotProve)}</p></details>` +
      `</span><span class="sright">` +
      // each stage's own result, in the doctor's word for it
      `<span class="sbadge ${badge}">` +
      `${esc(result ? result.word : ran ? 'run in this reading' : 'not asked')}</span>` +
      (path.available && row.mode !== 'inspect'
        ? `<button class="sb" data-sdoctor="${esc(row.mode)}" ` +
          `aria-label="run ${esc(mode.label)}">` +
          `${actLabel('Run it', 'run it?', 'running…')}</button>`
        : row.mode === 'inspect' ? ''
          : `<span class="sbadge dim" title="${esc(path.approval || '')}">` +
            `not offered here</span>`) +
      `</span></div>`;
  };
  // inspection, execution, and the one stage with no control: three
  // different things, so three panels rather than one list of stages
  const isInspect = (row) => row.mode === 'inspect';
  const offered = (row) => ((d.modes[row.mode] || {}).uiPath || {}).available;
  const inspectRows = d.coverage.filter(isInspect);
  const execRows = d.coverage.filter(r => !isInspect(r) && offered(r));
  const handRows = d.coverage.filter(r => !isInspect(r) && !offered(r));
  return spanel('Check configuration',
      report ? 'checked ' + esc(fmtShort(report.generated)) : 'Not inspected',
      `<div class="acts"><button class="sb primary" data-sinspect="1" ` +
      `aria-label="check configuration now">Check configuration</button></div>` +
      purposes + findings +
      // what the read-only check is, for whoever wants it — not the lead
      sref('What Check configuration does',
