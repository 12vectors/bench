name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The matrix leg that runs the strict, timed verify/backend (task 180).
  # Chosen by version rather than by a second matrix key, so the check
  # names stay `tests (3.11)` and `tests (3.13)`.
  STRICT_PYTHON: "3.13"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Two legs, on purpose different (verify/README.md, "Continuous
        # integration"):
        # - 3.11, plain: the oldest supported Python, stdlib only, nothing
        #   installed — the plain command, which reads skips as OK. It
        #   proves the suite runs with no dependencies at all.
        # - 3.13, strict: the newest supported Python with every
        #   dependency prepared, through verify/backend: any skip, zero
        #   discovery or an unimportable module is a setup error, and the
        #   run is timed, its timing and logs kept as an artifact on every
        #   path.
        # Neither runs the browser or docs checks; CI does not replace them.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for the tests that build scratch repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@bench.invalid
          git config --global init.defaultBranch main

      # ── plain leg ────────────────────────────────────────────────────
      - name: Plain unittest (stdlib only, skips allowed)
        if: matrix.python-version != env.STRICT_PYTHON
        run: python3 -m unittest discover -s tests -v

      # ── strict leg ───────────────────────────────────────────────────
      - name: Prepare node for the page-rule tests
        if: matrix.python-version == env.STRICT_PYTHON
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install markdown-it-py (site/requirements.txt)
        if: matrix.python-version == env.STRICT_PYTHON
        run: python3 -m pip install -r site/requirements.txt
      - name: Preflight (node, lsof, markdown-it) — verify/preflight backend
        if: matrix.python-version == env.STRICT_PYTHON
        run: python3 verify/preflight backend --artifacts "$RUNNER_TEMP/bench-ci/preflight"
      - name: Strict, timed full suite — verify/backend --require-timing
        if: matrix.python-version == env.STRICT_PYTHON
        run: python3 verify/backend --require-timing --artifacts "$RUNNER_TEMP/bench-ci/backend"
      - name: Attest the record (commit, Python, test set, no skips)
        if: always() && matrix.python-version == env.STRICT_PYTHON
        run: >-
          python3 verify/ci-summary "$RUNNER_TEMP/bench-ci/backend"
          --expect-revision "$GITHUB_SHA"
          --expect-python "${{ matrix.python-version }}"
          --write-context
      - name: Keep timing, logs and records
        if: always() && matrix.python-version == env.STRICT_PYTHON
        uses: actions/upload-artifact@v4
        with:
          # unique per interpreter, commit, run and attempt: a rerun never
          # overwrites or reads an earlier run's outputs
          name: bench-backend-strict-py${{ matrix.python-version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-ci/
          if-no-files-found: warn
          retention-days: 30
